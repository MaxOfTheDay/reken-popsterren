# De keuring bij elke PR en elke push naar main.
#
# Tot nu toe draaiden de tests alleen op de pc waar de studio op Publiceren
# drukt, of als Claude ze draaide. Een push met de hand of een bewerking op
# GitHub zelf werd door niemand nagekeken. Dit is dat vangnet.
#
#   keuring   npm run check: de vier Node-suites (± 2 s) plus de vraag of
#             index.html gelijkloopt met src/ (zaak H) -- geen npm install nodig
#             plus de ontvanger van Overzetten (worker/overzetten.js, kaal Node)
#             en bij een PR: is er een bestaande tekening vervangen zonder dat
#             ART_CACHE in sw.js omhoog ging (test/tekeningen.js)
#   browser   alle browsersuites, elk in een eigen job zodat ze naast elkaar
#             lopen (inhoud zaak X kijkt na dat er geen ontbreekt). Een paar:
#             sterren (de kortste die het beginscherm echt opbouwt; die
#             ziet een const die te vroeg gelezen wordt en een lege pagina geeft,
#             CLAUDE.md regel 0) en schuiven (geen scherm schuift verder dan er
#             iets te zien valt, en wat geen lijst is past op elke maat), en
#             robuust (de tik komt eerst, tikstormen, offline na het eerste
#             bezoek -- test/robuust.test.js), en vlucht (de zoom tussen kaart
#             en Werelden; wat op allebei staat -- balk, diamantenpil -- staat
#             stil. Een kopregel die op één scherm hoger werd, viel daar om
#             zonder dat iemand het zag, omdat hij hier niet draaide).
#             Ze draaien via test/alles.js, dus met dezelfde tweede kans als
#             npm test en Publiceren: wat omvalt draait nog één keer, en slaagt
#             het dan wel, dan blijft de PR groen met een gele waarschuwing die
#             zegt welke controle wiebelde. Zonder die tweede kans gaf één
#             beeldje te laat op een drukke GitHub-machine een rode PR en een
#             mail "run failed", terwijl de code goed was.
#   beelden  alleen bij een PR: dezelfde schermen voor (main) en na (deze PR),
#             naast elkaar gelegd (test/shots.js --vast, test/beeldverschil.js).
#             Blokkeert niets; de lijst staat in de samenvatting van de job en
#             voor | na | verschil in het artefact "beeldverschil". In het
#             stijlblad is de volgorde de cascade: een verhangen regel breekt
#             niets en geen test valt om, er ziet alleen iets anders uit.
#
# Bij een push naar main die een PR binnenhaalt slaat browser over: precies
# die samenvoeging is in de PR al door een browser gegaan. Een push met de hand
# naar main krijgt de hele ronde. Een nieuwe push op dezelfde PR-tak breekt de
# vorige ronde af -- die keurt een versie die niemand meer gaat mergen.
name: keuring

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: keuring-${{ github.ref }}
  # main breekt niet af: elke stap op main krijgt zijn eigen uitslag
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  keuring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:hub
      - run: npm run test:overzetten
      - if: github.event_name == 'pull_request'
        run: node test/tekeningen.js origin/${{ github.base_ref }}

  browser:
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request #')
    strategy:
      fail-fast: false
      matrix:
        # suite = de naam van de job (en van npm run test:<suite>),
        # bestand = test/<bestand>.test.js
        include:
          - { suite: sterren, bestand: profiles }
          - { suite: schuiven, bestand: schuiven }
          - { suite: robuust, bestand: robuust }
          - { suite: vlucht, bestand: vlucht }
          # de telmodus: de enige plek waar de stem nagemeten wordt
          - { suite: tellen, bestand: counting }
          # wat het toestel stil laat mislukken (stem, geluid, opslag, voorraad):
          # elke weigering geeft een teken in beeld of een briefje, en elke
          # toestelfunctie in src/ heeft een rij (test/toestel.test.js)
          - { suite: toestel, bestand: toestel }
          # De rest draaide tot november 2026 alleen op de eigen machine, en dan
          # bewaakt hij niets: inhoud zaak X houdt nu bij dat elke suite hier staat.
          - { suite: flits, bestand: flits }
          - { suite: kop, bestand: kop }
          - { suite: onderrand, bestand: onderrand }
          - { suite: rekenen, bestand: maths }
          - { suite: reis, bestand: reis }
          - { suite: ouder, bestand: ouder }
          - { suite: rondgang, bestand: rondgang }
          - { suite: voortgang, bestand: voortgang }
          - { suite: beloning, bestand: beloning }
          - { suite: studio, bestand: studio }
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Chromium één keer per Playwright-versie ophalen en daarna uit de voorraad
      # van GitHub: elke job haalde hem anders opnieuw van Playwrights eigen
      # server, en toen die op 11 november 2026 haperde, kon geen enkele PR meer
      # groen worden. De versie staat vast in package.json (inhoud zaak X).
      - id: pw
        run: echo "versie=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pwvoorraad
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}
      - if: steps.pwvoorraad.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # de browser lag er al; alleen de systeembibliotheken nog (uit Ubuntu, niet van Playwright)
      - if: steps.pwvoorraad.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node test/alles.js ${{ matrix.bestand }}

  beelden:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Chromium één keer per Playwright-versie ophalen en daarna uit de voorraad
      # van GitHub: elke job haalde hem anders opnieuw van Playwrights eigen
      # server, en toen die op 11 november 2026 haperde, kon geen enkele PR meer
      # groen worden. De versie staat vast in package.json (inhoud zaak X).
      - id: pw
        run: echo "versie=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pwvoorraad
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}
      - if: steps.pwvoorraad.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # de browser lag er al; alleen de systeembibliotheken nog (uit Ubuntu, niet van Playwright)
      - if: steps.pwvoorraad.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # main ernaast, in een eigen map: de opnames van allebei met de lijst schermen van deze PR
      - run: git worktree add ../basis origin/${{ github.base_ref }}
      - run: node test/shots.js voor --vast --app=../basis
      - run: node test/shots.js na --vast
      - run: node test/beeldverschil.js shots/voor shots/na shots/verschil
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beeldverschil
          path: shots/verschil
          if-no-files-found: ignore
