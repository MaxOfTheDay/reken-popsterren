  .dress-bar .db-info { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; text-align: left; white-space: nowrap; overflow: hidden; }
  .dress-bar .db-name { font-size: 16.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dress-bar .db-sub { flex: 0 1 auto; min-width: 0; font-size: 13.5px; opacity: .92; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dress-bar .db-highlight { color: var(--gold-accent); font-weight: 700; }
  .dress-bar .btn.small { white-space: nowrap; flex-shrink: 0; }
  /* wegvliegende diamant bij een aankoop */
  .fly-dia { position: fixed; z-index: 95; font-size: 22px; pointer-events: none; }

  /* ---- Instellingen (ouder-dashboard) ---- */
  .settings-sheet { width: 100%; max-width: var(--kolom); display: flex; flex-direction: column; gap: 14px; }

  /* ---- De kop van het ouderdeel, twee standen -----------------------------
     FASE 5D. Deze kop draagt drie dingen (terug + naam van het scherm, wíé, en
     wát daarover) en dat was op een telefoon 175 van 844 pixels -- op een kleine
     telefoon 31% van het beeld, vóór er één cijfer in zicht kwam.

     Bovenaan blijft hij ruim: daar ís de kop het scherm, en een ouder die net
     binnenkomt moet zien wat dit is. Zodra er gescrold wordt krimpt hij, precies
     zoals de trofeeënkast dat doet (zie #screen-trophies.gescrold): minder lucht,
     een kleinere titel, kleinere portretjes. Wat NIET wegvalt zijn de twee
     keuzerijen zelf -- wie er gekozen is en welk onderdeel je leest zijn precies
     de twee dingen die je onderweg nodig hebt. Dat scheelt ~40px zonder dat er
     iets verdwijnt of van plaats wisselt: gemeten 171 -> 139px. De raakvlakken
     blijven ruim genoeg voor een volwassen vinger -- de kindkaartjes 38, de
     tabbladen 36 -- en bovenaan zijn ze weer 46 en 40.

     Eén element, twee standen, net als bij de kast: dan kan er niets uit de pas
     gaan lopen. */
  #screen-settings .hub-sticky {
    /* Iets krapper dan de standaard 12/10: deze kop draagt drie regels en elke
       pixel telt er dus driemaal zo zwaar. FASE 5D.1 haalde er nog een paar af,
       verdeeld over alle vier de regels in plaats van uit één ervan -- gemeten
       171 -> 162px. Alle drie de dingen (terug + titel, wie, wat) blijven staan,
       en de winst komt uit de lúcht: geen enkel raakvlak is er kleiner van
       geworden. De terugknop blijft 44, de tabbladen blijven 40, en het
       kindkaartje gaat van 46 naar 44 -- de maat die in deze app overal de
       ondergrens is (zie .icon-btn). */
    padding-top: 9px; padding-bottom: 7px;
    transition: padding var(--t-snel) ease, background var(--t-snel) ease, box-shadow var(--t-snel) ease;
  }
  /* "Voor ouders" hoeft geen 24px te zijn -- dit scherm heeft geen titel nodig
     die het scherm draagt, alleen een naam. */
  #screen-settings .header-title { font-size: 21px; }
  #screen-settings .hub-sticky .screen-header { margin-bottom: 0; }
  #screen-settings .hub-sticky .icon-btn { transition: width var(--t-snel) ease, height var(--t-snel) ease, font-size var(--t-snel) ease; }
  #screen-settings .hub-sticky .screen-header,
  #screen-settings .who-row, #screen-settings .who-portrait,
  #screen-settings .header-title, #settings-subtabs {
    transition: margin var(--t-snel) ease, font-size var(--t-snel) ease,
                width var(--t-snel) ease, height var(--t-snel) ease;
  }
  #screen-settings.gescrold .hub-sticky {
    padding-top: 7px; padding-bottom: 7px;
    /* Dekkend gescrold, om dezelfde reden als bij de kast: op .82 bleven de
       koppen van de witte kaarten dwars door "Voor ouders" heen leesbaar. */
    background: var(--kop-plaat-vol);
    box-shadow: var(--e-3);
  }
  #screen-settings.gescrold .hub-sticky .screen-header { margin-bottom: 0; }
  #screen-settings.gescrold .header-title { font-size: 16.5px; }
  /* De enige plek in de app waar een raakvlak onder de 44px komt, en met opzet:
     dit is een ouderscherm (geen kinderhand), het is alleen de gescrolde stand
     (bovenaan is hij weer 44), en zonder deze regel bepaalt de terugknop in zijn
     eentje de hoogte van de bovenste regel -- dan houdt krimpen op bij 44 en
     levert de hele gescrolde stand nog maar 16px op in plaats van 40. */
  #screen-settings.gescrold .hub-sticky .icon-btn { width: 38px; height: 38px; font-size: 16px; }
  #screen-settings.gescrold .who-row { padding-top: 0; padding-bottom: 0; }
  #screen-settings.gescrold .who-btn { min-height: 38px; }
  #screen-settings.gescrold .who-portrait { width: 28px; height: 28px; }
  #screen-settings.gescrold .who-portrait svg { top: -3px; width: 48px; }
  #screen-settings.gescrold .who-btn .tab-label { font-size: 14px; }
  #screen-settings.gescrold #settings-subtabs { margin-top: 5px; }
  #screen-settings.gescrold .segmented { padding: 3px; }
  #screen-settings.gescrold .segmented button { padding: 7px 8px; min-height: 36px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) {
    #screen-settings .hub-sticky, #screen-settings .hub-sticky *,
    #settings-subtabs { transition: none; }
  }
  /* Een laag scherm: een telefoon in liggende stand (844x390) of een heel kleine
     telefoon. Daar is 171px kop gewoon te veel -- bijna de helft van het beeld --
     en de gescrolde stand helpt niet, want bovenaan is hij nog ruim. Dit is
     daarom dezelfde krappe maatvoering, maar dan meteen: de kop begint hier al
     compact. Dezelfde waarden als .gescrold hierboven, met opzet los
     opgeschreven -- een klasse en een schermmaat zijn twee verschillende
     aanleidingen voor hetzelfde resultaat, en CSS kan die niet delen zonder de
     ene aan de andere te knopen. */
  @media (max-height: 560px) {
    #screen-settings .hub-sticky { padding-top: 7px; padding-bottom: 6px; }
    #screen-settings .hub-sticky .screen-header { margin-bottom: 0; }
    #screen-settings .header-title { font-size: 17px; }
    #screen-settings .hub-sticky .icon-btn { width: 38px; height: 38px; font-size: 16px; }
    #screen-settings .who-btn { min-height: 38px; }
    #screen-settings .who-portrait { width: 28px; height: 28px; }
    #screen-settings .who-portrait svg { top: -3px; width: 48px; }
    #screen-settings .who-btn .tab-label { font-size: 14px; }
    #settings-subtabs { margin-top: 5px; }
    #screen-settings .segmented { padding: 3px; }
    #screen-settings .segmented button { padding: 7px 8px; min-height: 36px; font-size: 15px; }
  }

  /* zelfde donkerpaarse .hub-sticky-kop als de rest van de app: ← terug ·
     Voor ouders · (opgeslagen-bevestiging), met de profielkiezer en de
     Voortgang|Oefenen|Beheer-navigatie er direct onder, ook altijd in beeld */
  /* ==== Ouderdeel: twee navigatieniveaus, en ze moeten er ánders uitzien ====
     Hiervoor waren het twee identieke .segmented-sporen, pal op elkaar: niets
     vertelde dat het ene "wiens gegevens" kiest en het andere "wat daarover".
     Niveau 1 (wie) is nu een open, scrollende rij portretten -- geen spoor
     eromheen, want juist dat spoor laat iets als tabbladen lezen. Niveau 2 (wat)
     houdt het omsloten spoor.

     FASE 5D -- de breedte. Beide rijen stonden op een eigen max-width van 460,
     terwijl de titelregel erboven en de kaarten eronder op --kolom (640) staan.
     Op een telefoon zag je dat niet (daar is alles 100%), op een tablet des te
     meer: de terugknop stond 97px van de rand, de kindkiezer 187px, en de
     kaarten er weer ergens anders -- drie linkerkanten in één kop. Nu leest
     álles in dit scherm dezelfde --kolom, dus er is nog maar één linkerkant. */
  .who-row {
    display: flex; gap: 6px; padding: 1px 2px; width: 100%; max-width: var(--kolom, 640px);
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .who-row::-webkit-scrollbar { display: none; }
  /* hergebruikt .tab-btn uit de kleedkamer; alleen het portret is nieuw */
  .who-btn { padding-left: 5px; gap: 8px; min-height: 44px; flex: none; }
  .who-portrait { width: 34px; height: 34px; }
  .who-portrait svg { top: -4px; width: 58px; }
  /* Bewust NIET het blauw van .tab-btn.active: blauw betekent in deze app
     "actieve navigatie", en een ster kiezen is geen navigatie maar het bepalen
     van de context (wiens gegevens). Paars is de kleur van gewone keuzes, net
     als bij .chip.on. Zo verschillen de twee niveaus in vorm en in kleur.

     FASE 5D -- de gekozen ster mag niet te missen zijn: naast de paarse vulling
     staat er nu een lichte ring omheen, zodat ze ook op een tablet (waar de rij
     veel lucht heeft) meteen uit de rij springt. */
  .who-btn.active {
    background: linear-gradient(180deg, var(--purple-light), var(--purple-mid));
    color: var(--c-white);
    box-shadow: 0 3px 10px rgba(var(--purple-mid-rgb), .38), inset 0 0 0 1.5px rgba(255,255,255,.45);
  }
  .who-btn.active .who-portrait { border-color: var(--c-white); }
  #settings-subtabs { margin-top: 6px; }

  .segmented { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--glass-black-26); width: 100%; max-width: var(--kolom, 640px); }
  .segmented button {
    flex: 1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; color: var(--c-white);
    border: none; background: transparent; border-radius: var(--r-sm); padding: 9px 8px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  /* drie labels moeten in het spoor passen zonder af te breken; de maatregel
     hieronder is het vangnet voor grote systeemletters (gemeten past het op
     320px ook zonder) */
  .segmented button { min-width: 0; white-space: nowrap; }
  @media (max-width: 360px) {
    .segmented { gap: 3px; padding: 3px; }
    .segmented button { font-size: 14.5px; padding: 10px 4px; }
  }
  /* blauw = actieve navigatie/keuze (zelfde taal als .tab-btn.active in de
     kleedkamer en .nav-item.active in de vaste navigatie) -- paars blijft
     gereserveerd voor gewone (niet-navigatie) keuzes, goud voor spelen/verdiend */
  .segmented button.on { background: linear-gradient(180deg, var(--blue-fill-bottom), var(--blue-fill-top)); color: var(--purple-shadow); box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  /* korte, subtiele bevestiging na elke automatische opslag -- verschijnt even
     in de anders lege rechterkop-cel, geen aparte "Opslaan"-knop nodig */
  .saved-pill {
    font-size: 12.5px; font-weight: 700; color: var(--green-deep); background: var(--green-badge-bg);
    border-radius: var(--r-pill); padding: 5px 12px; white-space: nowrap;
    opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .saved-pill.show { opacity: 1; transform: translateY(0); }
  /* De opslagbevestiging reserveert ~100px in de rechtercel, en omdat de
     zijkolommen 1fr delen kneep dat de titel in het midden dood ("Voor ou..."
     op 320px). Uit de stroom halen loste dat op maar liet de flits over de
     titel heen lopen; op smalle schermen krimpt ze daarom tot alleen het vinkje
     -- kort genoeg om de titel te laten passen, en de betekenis (opgeslagen)
     zit toch al in het vinkje. */
  @media (max-width: 400px) {
    .saved-pill .sp-word { display: none; }
    .saved-pill { padding: 5px 8px; font-size: 14px; }
  }

  .settings-panel { display: flex; flex-direction: column; gap: 14px; }
  .set-card { background: var(--c-white); color: var(--c-ink); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--e-2); }
  .set-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .set-card-head .ico { width: 34px; height: 34px; border-radius: var(--r-sm); flex-shrink: 0; display: grid; place-items: center; font-size: 18px; background: var(--paper-tint); border: 1px solid var(--paper-border); }
  .set-card-head h2 { font-size: 18px; font-weight: 700; color: var(--purple-mid); }
  .set-card-head .sub { font-size: 12.5px; color: var(--paper-ink-muted); font-weight: 500; margin-top: 1px; }
  /* "Wat oefenen" en "Hoe spelen" zijn de kern van dit scherm -- een paarse
     (structuur-kleur) icoonvulling + iets steviger kop zet ze visueel voorop
     t.o.v. de secundaire kaarten (Profiel, Gegevens beheren) eronder */
  /* FASE 5D.1 -- de rand was 1,5px vol --purple-light, en met drie kaarten onder
     elkaar plus paarse chips erin was álles op dit scherm paars omlijnd. Verzadigd
     paars is nu voorbehouden aan wat gekozen ís (chips), aan de kop en aan het
     icoontegeltje; de buitenrand van een kaart is een haarlijn in dezelfde
     papierkleur als de rest van het ouderdeel. Het verschil met .secundair zit
     daarmee waar het hoort: in de kop en de tegel, niet in een kader. */
  .set-card.primary { border: 1.5px solid var(--paper-border); }
  .set-card.primary .set-card-head .ico { background: linear-gradient(180deg, var(--purple-light), var(--purple-mid)); color: var(--c-white); border-color: transparent; }
  .set-card.primary .set-card-head h2 { font-size: 19.5px; }
  /* FASE 5D -- de tegenhanger van .primary: alles wat ná de hoofdkeuzes komt
     (weergave, lengte, extra uitdaging). Niets verborgen, alleen stiller: geen
     paarse omlijsting, een gedempte kop en iets minder lucht. Zo is de rangorde
     op het drukste scherm van het ouderdeel te zien in plaats van te raden. */
  .set-card.secundair { padding: 14px 18px; }
  .set-card.secundair .set-card-head { margin-bottom: 10px; }
  .set-card.secundair .set-card-head h2 { font-size: 16px; color: var(--paper-ink); }
  .set-card.secundair .set-card-head .ico { font-size: 16px; width: 30px; height: 30px; }
  /* Wissen zat als permanent zichtbaar rood vlak onderaan het instellingenscherm,
     altijd in beeld naast gewone instellingen. Nu zit het achter een rustige
     openklapper: het rode vlak bestáát pas als een ouder er zelf om vraagt.
     <details> i.p.v. eigen JS -- toetsenbord en schermlezer krijgen we gratis. */
  .danger-reveal { margin-top: 12px; }
  .danger-reveal > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    min-height: 44px; box-sizing: border-box; padding: 9px 15px;
    font-size: 13.5px; font-weight: 700; color: var(--paper-ink-muted);
    border: 1.5px solid var(--paper-border); border-radius: var(--r-pill);
  }
  .danger-reveal > summary::-webkit-details-marker { display: none; }
  .danger-reveal > summary::after { content: '▾'; opacity: .7; }
  .danger-reveal[open] > summary { color: var(--danger-title); border-color: var(--danger-border); }
  .danger-reveal[open] > summary::after { content: '▴'; }
  .danger-reveal .danger-zone { margin-top: 10px; }
  /* twee openklappers onder elkaar (wissen, verwijderen): lucht ertussen, zodat
     het twee losse vragen blijven en geen lijstje om achteloos door te tikken */
  .danger-reveal + .danger-reveal { margin-top: 10px; }
  .danger-zone .d b { color: var(--danger-title); font-weight: 700; }
  /* de tweede, vervangende actie in de back-upkaart: een streepje erboven, zodat
     "maken" en "terugzetten" niet als twee knoppen van hetzelfde soort lezen */
  .data-los { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--paper-border); }
  .data-los .note { margin-top: 8px; }
  /* Dezelfde openklapper, maar voor een gewone keuze i.p.v. een gevaarlijke: de
     oefeninstellingen bij het maken van een ster. Vandaar de papierkleuren i.p.v.
     het rood, en een volle breedte met twee regels i.p.v. een pil -- de tweede
     regel toont wát er nu ingesteld staat, zodat een ouder die hem nooit opent
     tóch ziet waar haar kind mee begint. */
  .set-reveal { margin-top: 15px; }
  .set-reveal > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    min-height: 44px; box-sizing: border-box; padding: 10px 14px;
    border: 1.5px solid var(--paper-border); border-radius: var(--r-md);
  }
  .set-reveal > summary::-webkit-details-marker { display: none; }
  .set-reveal > summary::after { content: '▾'; margin-left: auto; opacity: .7; flex: none; }
  .set-reveal[open] > summary { border-color: var(--purple-light); }
  .set-reveal[open] > summary::after { content: '▴'; }
  /* hetzelfde tegeltje als op een kaartkop, zodat het als één familie leest */
  .sr-ico {
    width: 34px; height: 34px; border-radius: var(--r-sm); flex: none; display: grid; place-items: center;
    font-size: 18px; background: var(--paper-tint); border: 1px solid var(--paper-border);
  }
  .sr-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sr-title { font-size: 13px; font-weight: 700; color: var(--paper-ink); }
  .sr-val { font-size: 12px; font-weight: 500; color: var(--paper-ink-muted); }
  .set-reveal-body { margin-top: 12px; }
  /* twee groepen (Wat oefenen / Hoe spelen) zonder er twee kaarten ín een kaart
     van te maken: een streepje en een kleinere kop doen hier hetzelfde werk */
  .reveal-group + .reveal-group { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--paper-border); }
  .rg-title { font-size: 14px; font-weight: 700; color: var(--purple-mid); margin-bottom: 10px; }
  /* streepje tussen de kindkaarten en het app-brede blok eronder: het staat op de
     paarse schermachtergrond, niet op een witte kaart, vandaar de witte tekst */
  .sheet-rule { display: flex; align-items: center; gap: 10px; margin: 4px 2px 0;
    color: var(--c-white); opacity: .8; font-size: 12.5px; font-weight: 700; }
  .sheet-rule::before, .sheet-rule::after { content: ''; flex: 1; height: 1px; background: var(--glass-white-22); }

  .set-field { display: flex; flex-direction: column; gap: 7px; }
  .set-field + .set-field { margin-top: 15px; }
  .set-field .lbl { font-size: 13px; font-weight: 700; color: var(--paper-ink); }
  .set-card .note, .set-field .note { font-size: 12px; color: var(--paper-ink-muted); font-weight: 500; }
  /* FASE 5D.1 -- de uitleg bij een instelling stond als "(zo werkt dit)" ín het
     label, op dezelfde regel. Op een telefoon werd dat één doorlopende dichte
     regel van vet plus haakjes die over twee of drie regels afbrak, en dan is het
     label zelf niet meer te vinden. Nu: het label op zijn eigen regel, de uitleg
     eronder in één kleinere, gedempte zin.
     De negatieve marge is de tegenhanger van de 7px gap van .set-field: label en
     uitleg horen bij elkaar (3px), de chips eronder zijn iets anders (7px). */
  .set-field .hulp {
    font-size: 12px; font-weight: 500; color: var(--paper-ink-muted);
    line-height: 1.3; margin-top: -4px;
  }
  /* "Tafels van" only matters once Maal/Delen is on -- dimmed (not disabled: still
     tappable, so a parent can pre-select tables before turning the operation on) */
  .set-field.inactive { opacity: .5; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  /* FASE 5D.1 -- drie keuzes die samen één vraag beantwoorden ("hoe tonen we de
     antwoorden?") horen op één regel te staan. Met de natuurlijke breedte viel
     "🎲 Mix" op een telefoon van 390 als enige op een tweede regel, en dan leest
     hij als een losse extra optie in plaats van als de derde van drie.
     Gelijke delen met een bodembreedte: past het niet meer (een heel smal
     venster of grote systeemletters), dan wikkelt het gewoon weer -- liever twee
     nette regels dan drie samengeperste kolommen. Gemeten: op 320px past het
     nog, op 280px wikkelt het. De vorm zelf staat bij .chip.gestapeld hieronder;
     hier is alleen de naam van de rij, want .chip-row doet de rest al. */
  /* Bewerkingen (+ - x :) as a fixed 2x2 grid: +/- (optellen/aftrekken) and x/:
     (vermenigvuldigen/delen) are natural pairs, and the natural flex-wrap on
     narrow screens gave an unbalanced 3-then-1 instead. max-content columns
     keep each chip its own width -- no stretching to fill the grid cell.
     Een klasse en geen #set-ops: het maakformulier toont dezelfde rij met een
     eigen id-voorvoegsel, en een id-regel zou daar stilletjes niet meer pakken. */
  .ops-grid { display: grid; grid-template-columns: repeat(2, max-content); }
  /* ---- Telmodus: de fasekiezer ---------------------------------------------
     FASE 5D. Zie oefenGroups voor het waarom; dit is de vorm.
       .fr-zin      de zin bovenaan, die zegt wat de twee rijen samen betekenen
       .chip.bereik een fase die binnen [start .. hoogste] valt: licht gevuld,
                    zodat beide rijen dezelfde band tekenen. De gekozen fase
                    blijft gewoon .chip.on (vol paars) -- .bereik is de zachtere
                    laag eronder en mag die dus nooit overschrijven.
       .stage-legend  de namen, in kolommen i.p.v. als alinea, met wat buiten
                    het bereik valt gedempt. */
  .fr-zin {
    background: var(--lavender-wash); border-radius: var(--r-sm); padding: 9px 12px; margin-bottom: 13px;
    font-size: 13.5px; font-weight: 500; color: var(--paper-ink);
  }
  .fr-zin b { color: var(--purple-mid); font-weight: 700; }
  /* Krapper dan de gewone chip: elf stuks moeten op een telefoon in twee rijen
     passen zonder dat de nummers hun raakvlak kwijtraken (38px hoog blijft
     comfortabel voor een volwassen vinger op een instellingenscherm). */
  .stage-chips { gap: 6px; }
  .stage-chips .chip { min-width: 36px; padding: 7px 10px; font-size: 15px; }
  /* FASE 5D.1 -- de band was een lavendel vulling MÉT een volle paarse rand, en
     dan zie je elf paarse ringen in plaats van één doorlopend bereik. De rand is
     nu een fractie van dezelfde paarse kleur (.22), dus hij hoort er wel bij maar
     concurreert niet met de twee gekozen uiteinden -- die blijven vol paars en
     dus onmiskenbaar de eindpunten. */
  .chip.bereik { background: var(--lavender-wash); border-color: rgba(var(--purple-mid-rgb), .22); }
  .chip.bereik:hover { background: var(--lavender-wash-3); border-color: var(--purple-light); }
  /* .on wint van .bereik: dezelfde volle paarse vulling als elke andere gekozen
     chip in de app, ook als hij binnen het bereik valt (en dat doet hij altijd). */
  .chip.bereik.on { background: linear-gradient(180deg, var(--purple-light), var(--purple-mid)); border-color: transparent; }
  .stage-legend {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 3px 14px; margin: 13px 2px 2px; font-size: 12.5px; color: var(--paper-ink-muted);
  }
  .stage-legend span { display: flex; align-items: baseline; gap: 5px; line-height: 1.35; }
  .stage-legend b { color: var(--purple-mid); font-weight: 700; min-width: 15px; }
  .stage-legend span.uit { opacity: .42; }
  .stage-legend .sl-tag {
    font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    background: var(--purple-mid); color: var(--c-white); border-radius: var(--r-pill); padding: 1px 6px; margin-left: 4px;
  }
  /* ---- De moduskeuze: twee helften, niet twee pillen --------------------
     Dit is de zwaarste keuze van het scherm (ze verandert alles eronder), dus
     krijgt ze de volle breedte in plaats van twee pillen die links samendrommen.
     Het is nog steeds .chip -- zelfde kleuren, zelfde ronding, zelfde gekozen-
     stand -- alleen groter, met het icoon boven het woord en een vinkje op de
     gekozen kant. */
  /* Icoon bóven het woord, gelijke helften. Gedeeld door de moduskeuze (de
     zwaarste keuze van het scherm) en de weergavekeuze in de stille kaart; het
     verschil tussen die twee zit alleen in de maat, hieronder. Het blijft
     .chip -- zelfde kleuren, zelfde ronding, zelfde gekozen-stand.
     min-width is de vangrail: past het niet meer (een heel smal venster of grote
     systeemletters), dan wikkelt de rij netjes in plaats van de woorden. */
  .chip.gestapeld {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--r-md);
  }
  .chip.gestapeld .mc-ico { line-height: 1.05; }
  .chip.gestapeld .mc-label { font-weight: 700; }
  /* FASE 5D.1 -- de moduskeuze een slag lager: opgemeten 74 -> 62px (16%). Ze
     was zo hoog dat ze als de hoofdknop van een spel las in plaats van als de
     bovenste keuze van een instellingenscherm. Het raakvlak blijft ruim boven de
     44px, en het icoon, het woord, het vinkje en de twee gelijke helften blijven
     alle vier staan. */
  .mode-row { gap: 9px; }
  .mode-row .chip.gestapeld { gap: 2px; padding: 7px 8px 8px; font-size: 15px; min-width: 96px; }
  .mode-row .chip.gestapeld .mc-ico { font-size: 21px; }
  .mode-row .chip.gestapeld.on .mc-label::after { content: ' ✓'; }
  /* Dezelfde vorm, een maat kleiner: drie op een rij op een telefoon van 390,
     en op 320 wikkelt hij naar 2 + 1 in plaats van de woorden af te knijpen. */
  .drie-op-een-rij .chip.gestapeld { gap: 1px; padding: 6px 5px 7px; font-size: 13.5px; min-width: 78px; }
  .drie-op-een-rij .chip.gestapeld .mc-ico { font-size: 17px; }
  .chip {
    font-family: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer; text-align: center; min-width: 44px;
    border: 2px solid var(--paper-border); background: var(--c-white); color: var(--purple-mid); border-radius: var(--r-pill); padding: 7px 15px;
    transition: transform .07s, background .12s, border-color .12s, color .12s;
  }
  .chip:hover { border-color: var(--purple-light); }
  .chip:active { transform: scale(.95); }
  .chip.on { background: linear-gradient(180deg, var(--purple-light), var(--purple-mid)); border-color: transparent; color: var(--c-white); box-shadow: 0 3px 9px rgba(var(--purple-mid-rgb), .32); }
  /* kleurkeuze bij het maken van een ster: het woord alleen zegt te weinig, dus
     de kleur staat erbij. (.item-thumb uit de winkel kan dit ook, maar die is
     getekend voor het donkere winkelraster en valt uit elkaar op wit papier.) */
  .chip.swatch { display: inline-flex; align-items: center; gap: 8px; }
  .chip.swatch .sw {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--paper-border); box-shadow: inset 0 -2px 3px rgba(0,0,0,.16);
  }
  .chip.swatch.on .sw { border-color: rgba(255,255,255,.75); }
  /* Het voorbeeld staat boven de keuzes: je maakt iemand, je vult geen formulier in.
     Zelfde podiumkader als op de keuzekaart, zodat het al lijkt op waar ze straks
     staat. */
  /* Het voorbeeld staat vóór de keuzes -- je maakt iemand, je vult geen formulier
     in -- maar het is niet het onderwerp. Op 148px vulde het een derde van de
     telefoon en begonnen de échte keuzes pas onder de vouw; op 124px staat "Wie
     ben je?" er meteen naast in beeld en is de pop nog steeds goed te zien. */
  .newstar-preview { display: flex; justify-content: center; margin: -2px 0 13px; }
  .newstar-preview .stage { width: 124px; aspect-ratio: 10 / 11; }
  /* Klaar! blijft in beeld. Het formulier is één vel (basis, naam, haar, kleren,
     manier van spelen, en een dichte openklapper met de oefening) en dat vel is op
     een telefoon anderhalf scherm lang -- de knop die het hele scherm bestáát
     stond dus onder de vouw, en met het toetsenbord open twee schermen laag. Een
     plakkende voet lost dat op zonder de volgorde van het formulier aan te raken:
     de vragen blijven in dezelfde volgorde staan, het antwoord is alleen altijd
     bereikbaar. (Enter in het naamveld doet nog steeds hetzelfde -- zie daar.)

     De negatieve marges lopen tot in de randen van de kaart, zodat het wit van de
     voet doorloopt tot de hoeken en er niets tussen de knop en de kaartrand
     doorheen schuift. */
  /* ---- Het maakformulier leest als keuzes, niet als een formulier ----------
     Vijf rijen label-plus-pillen onder elkaar, elk met een volle 2px-rand om
     élke pil: dat gaf veertig omlijnde vakjes waar de gekozen pil het in zijn
     eentje van moest winnen. Hier is de níet gekozen pil stiller (dunnere rand,
     zacht vlak in plaats van wit) en blijft de gekozen pil precies zoals hij was.
     Het verschil doet nu het werk, niet de omlijning.

     Alleen binnen dit scherm: in het ouderdeel staan dezelfde pillen op een
     scherm dat wél een instellingenformulier ís, en daar horen ze zoals ze zijn. */
  #screen-newstar .set-field + .set-field { margin-top: 12px; }
  #screen-newstar .set-field { gap: 6px; }
  #screen-newstar .chip {
    border-width: 1.5px; border-color: var(--paper-border); background: var(--paper-tint);
  }
  #screen-newstar .chip:hover { border-color: var(--purple-light); background: var(--c-white); }
  /* de fase-band uit het ouderdeel werkt ook hier; zonder deze regel dekt de
     id-selector hierboven hem af (hogere specificiteit) en zou de openklapper
     in het maakformulier elf identieke rondjes tonen waar het ouderdeel een
     bereik laat zien */
  #screen-newstar .chip.bereik { background: var(--lavender-wash); border-color: rgba(var(--purple-mid-rgb), .22); }
  #screen-newstar .chip.on { border-color: transparent; background: linear-gradient(180deg, var(--purple-light), var(--purple-mid)); }
  #screen-newstar .set-card { padding: 14px 16px; }
  #screen-newstar .set-reveal { margin-top: 13px; }
  #screen-newstar input[type=text] { border-width: 1.5px; }

  .newstar-voet {
    /* bottom op -(schermrand): dán plakt de voet gelijk met de ónderkant van het
       scherm. Op 0 zou hij de rand van het scherm vrijlaten en schoof het
       formulier daar zichtbaar onderdoor.

       Plus de veilige zone van het toestel: op een telefoon met een streepje
       onderaan hoort de knop daar niet achter te vallen. Op alles zonder streepje
       is env() nul en verandert er niets. */
    position: sticky; z-index: 3;
    bottom: calc(env(safe-area-inset-bottom, 0px) - var(--rand));
    margin: 18px -18px -16px; padding: 12px 18px 14px;
    background: var(--c-white); border-top: 1px solid var(--paper-border);
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    box-shadow: 0 -8px 14px rgba(40,10,70,.07);
  }
  .newstar-go { width: 100%; font-size: 19px; }
  /* Niet [disabled] maar [aria-disabled]: het ziet er hetzelfde uit, maar de tik
     kómt binnen. Een uitgeschakelde knop krijgt in geen enkele browser een
     click-gebeurtenis, dus "Klaar" was letterlijk de enige knop in de app waar
     tikken niets teruggaf -- terwijl dat juist het moment is waarop een kind niet
     weet wat er nog mist. createStar weigert nog steeds (dezelfde regel als
     altijd) en wijst nu aan wáár het antwoord hoort. De indruk-beweging van .btn
     blijft daarom gewoon staan: er gebéurt iets. */
  .newstar-go[aria-disabled="true"] { opacity: .45; box-shadow: none; }
  /* De pulse die zegt "hier moet je nog even tikken". Geen rood en geen kruisje:
     er is niets fout gegaan, er is alleen nog niet geantwoord. Twee keer en dan
     stil -- een veld dat blijft kloppen wordt behang. */
  .vraagt { animation: vraagt 1.15s ease-out 2; }
  @keyframes vraagt {
    0%   { box-shadow: 0 0 0 0 rgba(var(--purple-mid-rgb), .55); }
    65%  { box-shadow: 0 0 0 11px rgba(var(--purple-mid-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--purple-mid-rgb), 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    /* geen klop, maar de aanwijzing zelf mag niet verdwijnen: een stille ring */
    .vraagt { animation: none; box-shadow: 0 0 0 3px rgba(var(--purple-mid-rgb), .5); }
  }

  /* de naam is het enige tekstveld in de hele app -- zonder duidelijk signaal
     ziet het eruit als platte tekst i.p.v. iets aantikbaars, dus een potloodje
     maakt "dit kun je wijzigen" expliciet i.p.v. impliciet aan de rand */
  .name-edit-wrap { position: relative; max-width: 220px; }
  .name-edit-wrap .name-edit-ico {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: .5; pointer-events: none;
  }
  .settings-sheet input[type=text] {
    font-family: inherit; font-size: 17px; font-weight: 600; color: var(--paper-ink);
    border: 2px solid var(--paper-border); border-radius: var(--r-sm); padding: 9px 34px 9px 13px; width: 100%; background: var(--paper-tint);
  }
  .settings-sheet input[type=text]:focus-visible { outline: none; border-color: var(--purple-light); background: var(--c-white); }
  .data-btns { display: flex; gap: 10px; flex-wrap: wrap; }

  .danger-zone {
    background: var(--danger-bg); border: 1.5px dashed var(--danger-border); border-radius: var(--r-lg); padding: 15px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .danger-zone .t { font-size: 14.5px; font-weight: 700; color: var(--danger-title); }
  .danger-zone .d { font-size: 12.5px; color: var(--danger-desc); font-weight: 500; margin-top: 2px; max-width: 42ch; }
  .danger-btn { background: linear-gradient(180deg, var(--red-danger-500), var(--red-danger-shadow)); color: var(--c-white); border: none; border-radius: var(--r-sm); padding: 10px 16px; font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; box-shadow: 0 var(--btn-lip-sm) 0 var(--red-danger-shadow); white-space: nowrap; }
  .danger-btn:active { transform: translateY(3px); box-shadow: none; }

  /* ---- Ouder-statistiek (tegels + meter) ---- */
  /* FASE 5D -- drie tegels in plaats van zes, dus ook op een telefoon drie
     kolommen: het raster klapte hiervoor onder 480px naar twee, wat met zes
     tegels klopte maar met drie een eenzame derde op een eigen rij zou geven.
     De maat is nagemeten op de krapste stand (320px: 88px per tegel, "goed
     beantwoord" op twee regels) -- vandaar het kleinere getal daaronder. */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .stat-tile { position: relative; background: var(--paper-tint); border: 1px solid var(--paper-border); border-radius: var(--r-md); padding: 12px 8px 10px; text-align: center; overflow: hidden; }
  .stat-tile::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--tint, var(--purple-light)); }
  .stat-tile .num { font-size: 26px; font-weight: 700; color: var(--paper-ink); line-height: 1; }
  .stat-tile .cap { font-size: 11.5px; color: var(--paper-ink-muted); margin-top: 5px; font-weight: 500; line-height: 1.2; }
  .stat-line { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 2px 7px; }
  .stat-line .k { font-size: 14px; font-weight: 600; color: var(--paper-ink); }
  .stat-line .v { font-size: 16px; font-weight: 700; color: var(--purple-mid); }
  .stat-bar { height: 13px; background: var(--lavender-wash-3); border-radius: var(--r-pill); overflow: hidden; }
  .stat-bar > div { height: 100%; border-radius: var(--r-pill); background: var(--purple-light); }
  .practice-hint { font-size: 12.5px; color: var(--paper-ink-muted); font-weight: 500; margin: 14px 2px 8px; }
  .practice-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .practice-chip { background: var(--practice-bg); border: 1px solid var(--gold-light); color: var(--practice-text); border-radius: var(--r-pill); padding: 6px 13px; font-weight: 700; font-size: 15px; }
  .stats-empty { font-size: 13.5px; color: var(--green-deep); font-weight: 600; margin-top: 6px; }
  @media (max-width: 360px) {
    .stat-tile { padding: 10px 5px 9px; }
    .stat-tile .num { font-size: 22px; }
    .stat-tile .cap { font-size: 11px; }
  }
  /* De oogst: sterren, perfecte shows en trofeeën. Bewust géén tegels -- ze zijn
     van het kind en staan groot in de kast en op de kaart; hier hoeven ze alleen
     te bestaan. Eén rustige regel die op een smal scherm netjes afbreekt. */
  .oogst-rij {
    display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 11px 2px 0;
    font-size: 13px; font-weight: 500; color: var(--paper-ink-muted);
  }
  .oogst-item b { font-weight: 700; color: var(--paper-ink); }
  /* De niveau-inschatting staat apart, achter een streepje: het is de enige
     afgeleide waarde op dit scherm en de enige die uitleg nodig heeft. */
  .niveau-blok { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--paper-border); }
  .niveau-kop { font-size: 14px; font-weight: 700; color: var(--paper-ink); margin: 0 2px 8px; }
  /* Waar het kind nú mee bezig is -- sinds fase 5D.1 het onderwerp van dit blok
     in plaats van een voetnoot onder een percentage (zie niveauHtml). Vandaar een
     maat groter dan een notitie, en een eigen lavendel vlakje zoals elk ander
     "dit is de stand"-vlakje in het ouderdeel. */
  .niveau-bezig {
    padding: 10px 13px; border-radius: var(--r-sm);
    background: var(--lavender-wash); font-size: 14px; font-weight: 500; color: var(--paper-ink);
  }
  .niveau-bezig b { color: var(--purple-mid); font-weight: 700; }
  .niveau-blok .note { margin-top: 8px; }

  /* ---- Modal (oudervraag) ---- */
  /* De padding op de achtergrond is niet cosmetisch: zonder stond een venster van
     340px op een telefoon van 320 met zijn randen buiten beeld -- en dat is
     precies het venster waarin "Ja, wissen" staat. Nu past het altijd, met een
     rand eromheen, en een lange tekst (wat er weggaat én wat er blijft) maakt het
     venster hoogstens scrollend in plaats van afgesneden. */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--c-white); color: var(--c-ink); border-radius: var(--r-lg); padding: 24px 28px; text-align: center;
    width: 100%; max-width: 340px; max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .modal h3 { color: var(--purple-deep); margin-bottom: 10px; }
  /* zelfde twee blokjes stonden tweemaal identiek als losse inline style op
     de bevestigingsmodals (stoppen / algemene bevestiging) -- nu één plek */
  .modal-body { font-size: 15px; color: var(--paper-ink-muted); margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* Op een smalle telefoon wikkelden de twee knoppen tóch, en dan stonden er een
     brede gouden en een smalle rode onder elkaar -- wat leest als één knop met een
     losse strook eronder. Onder elkaar én even breed: "Nee, terug" bovenaan (de
     veilige kant hoort de makkelijkste te zijn) en de onomkeerbare eronder. */
  @media (max-width: 400px) {
    .modal-actions { flex-direction: column; }
    .modal-actions > * { width: 100%; }
  }
  .modal input {
    font-family: inherit; font-size: 26px; text-align: center; width: 110px;
    border: 3px solid var(--purple-light); border-radius: var(--r-sm); padding: 6px; margin: 10px 0;
  }

  /* geen eigen z-index meer: #confetti-layer bepaalt waar de hele laag zit */
  .confetti-bit { position: fixed; top: -40px; font-size: 26px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body class="start">
<div class="grain" aria-hidden="true"></div>
<div id="confetti-layer" aria-hidden="true"></div>
<div id="app">

  <!-- ===== Profielkeuze ===== -->
  <div class="screen active app-sfeer" id="screen-profile">
    <div class="map-sky" aria-hidden="true">
      <div class="map-sky-inner">
        <span style="top:14%;font-size:28px;animation-duration:85s;animation-delay:-20s;opacity:.24">☁️</span>
        <span style="top:36%;font-size:22px;animation-duration:95s;animation-delay:-55s;opacity:.18">☁️</span>
        <span style="top:60%;font-size:32px;animation-duration:75s;animation-delay:-10s;opacity:.3">☁️</span>
        <span style="top:84%;font-size:26px;animation-duration:88s;animation-delay:-42s;opacity:.22">☁️</span>
      </div>
    </div>
    <h1 class="title">Reken Popsterren</h1>
    <div class="subtitle" id="profile-subtitle"></div>
    <!-- De "+" staat vást in het raster en wordt nooit weggegooid: renderProfiles
         zet de sterrentegels ervóór en laat deze knop staan. Daardoor komt hij
         vanzelf ná de laatste ster te staan, houdt hij zijn id (en dus zijn plek
         in het ouderdeel en in de tests), en is er geen los blok onder het raster
         meer dat op een eigen rij om aandacht vraagt. -->
    <div class="star-grid" id="profile-row">
      <button class="add-tegel" id="btn-newstar" onclick="openNewStar('profile')">
        <span class="at-plus" aria-hidden="true">＋</span>
        <span class="at-tekst">Nieuwe ster</span>
      </button>
    </div>
    <div class="restore-hint" id="restore-hint">Al een back-up? Zet hem terug via ⚙️ → Voor ouders.</div>
    <div class="profile-spacer" aria-hidden="true"></div>
  </div>

  <!-- ===== Kaart / wereldtournee (hoofdscherm) ===== -->
  <div class="screen hub" id="screen-map">
    <div class="map-ground" aria-hidden="true"></div>
    <div class="map-sky" aria-hidden="true">
      <!-- elk element drift't lineair van -80px naar 100vw+80px; het negatieve
           animation-delay bepaalt waar het bij het ínladen al in die reis zit
           (delay/duration = hoe ver "over" het scherm). Die fracties zijn hier
           bewust over ~0.06 .. 0.90 gespreid (i.p.v. toevallig gekozen getallen
           die tot een clustertje links + een leeg gat rechts leidden) zodat de
           lucht meteen bij het openen al over de hele breedte gevuld oogt. -->
      <div class="map-sky-inner">
        <span style="top:8%;font-size:26px;animation-duration:88s;animation-delay:-16s;opacity:.22">☁️</span>
        <span style="top:24%;font-size:34px;animation-duration:70s;animation-delay:-20s;opacity:.3">☁️</span>
        <span style="top:40%;font-size:22px;animation-duration:100s;animation-delay:-39s;opacity:.18">☁️</span>
        <span style="top:58%;font-size:30px;animation-duration:80s;animation-delay:-39s;opacity:.26">☁️</span>
        <span style="top:80%;font-size:36px;animation-duration:65s;animation-delay:-38s;opacity:.32">☁️</span>
        <span style="top:33%;font-size:24px;animation-duration:58s;animation-delay:-40s;opacity:.3">✈️</span>
        <span class="rev" style="top:68%;font-size:20px;animation-duration:72s;animation-delay:-15s;opacity:.2">✈️</span>
      </div>
    </div>
    <!-- Eén rij. Elke pixel die deze balk hoog is, is een pixel van de tekening
         die een kind niet ziet: de balk ligt er dekkend overheen. Wat hier stond
         en weg is: "Level 6 / 8" en "⭐ 13/24" (de genummerde haltes, de gouden
         huidige halte en de ster die erop staat zeggen dat beter, en een kind van
         vijf leest geen breuk) en de sterrenladder (staat nu in de Trofeeënkast,
         waar je juist gaat kijken hoe het ervoor staat). -->
    <div class="hub-sticky">
      <div class="screen-header">
        <button class="map-id-btn header-left" onclick="goProfiles()" aria-label="Wie speelt er" title="Wie speelt er">
          <span class="map-portrait" id="map-portrait"></span>
        </button>
        <button class="header-title world-pick" id="map-tournee-label" onclick="openReis()"
          aria-label="Bekijk de hele tournee" title="Bekijk de hele tournee"></button>
        <button class="diamond-badge header-right" onclick="navGo('dress')" aria-label="Naar de kleedkamer" title="Naar de kleedkamer">💎 <span id="map-diamonds">0</span></button>
      </div>
    </div>
    <!-- De wereld beslaat het hele scherm; de kop en de navigatie zweven erboven.
         Staat als eerste in de opmaak (en op z-index 0) zodat hij achter alles valt. -->
    <div class="tour-map" id="tour-map"></div>
    <!-- de weg terug naar de wereld waar ze speelt; alleen zichtbaar als ze elders kijkt -->
    <button class="world-back" id="world-back" hidden></button>
    <!-- Memory-spel: alleen zichtbaar voor een telmodus-ster met memory aan -->
    <button class="mem-fab" id="mem-fab" onclick="startMemory()" style="display:none" aria-label="Memory-spel">🎤<span>Memory</span><span class="mem-pay">💎 <span id="mem-fab-pay">0</span></span></button>
  </div>

  <!-- ===== De hele tournee (fase 4B) =====
       Eén laag boven de wereldkaart: waar ben ik in het héle avontuur? De baan
       zelf wordt door renderReis() opgebouwd uit WORLDS en de voortgang van fase
       4A -- er staat hier met opzet geen enkele wereld met naam, zodat een wereld
       erbij niets aan dit blokje verandert. -->
  <div class="screen hub" id="screen-journey">
    <div class="hub-sticky">
      <div class="screen-header">
        <button class="btn icon-btn header-left" onclick="reisSluit()" aria-label="Terug naar de kaart" title="Terug naar de kaart">←</button>
        <div class="header-title reis-titel"><span class="rt-ico" aria-hidden="true">🌍</span> De hele tournee</div>
        <div class="diamond-badge header-right">💎 <span id="reis-diamonds">0</span></div>
      </div>
    </div>
    <div class="reis-track" id="reis-track"></div>
    <!-- Alleen zichtbaar als je jezelf niet meer ziet; zie reisVolgKnop. -->
    <button class="reis-terug" id="reis-terug" type="button" onclick="reisTerugNaarNu()"
      aria-label="Terug naar waar je bent">↑</button>
  </div>

  <!-- ===== Memory-spel (lees-vrij: zoek de gelijke hoeveelheden) ===== -->
  <!-- FASE 5E -- ook het memoryspel staat in de schil. Het was het laatste scherm
       van de app dat rechtstreeks op het kale bodyverloop stond, en dat is precies
       het felste violet dat de app kent: naast de kaart, de kleedkamer en de kast
       las het als een scherm uit een ander spel. Geen laag erbij die iets afdekt --
       dezelfde regel als op de andere rustpunten. -->
  <div class="screen app-sfeer" id="screen-memory">
    <div class="hub-sticky">
      <div class="screen-header">
        <button class="btn icon-btn header-left" onclick="exitMemory()" aria-label="Terug naar de kaart" title="Terug naar de kaart">←</button>
        <div class="header-title">🎤 Memory</div>
        <div class="diamond-badge header-right">💎 <span id="mem-diamonds">0</span></div>
      </div>
      <!-- zelfde balk als in de show: hier is elk vakje een gevonden paar -->
      <div class="game-progress-row">
        <div class="segbar" id="mem-progress" role="progressbar" aria-label="Gevonden paren"></div>
      </div>
    </div>
    <div class="mem-arena">
      <div class="mem-grid" id="mem-grid"></div>
    </div>
    <div class="mem-done" id="mem-done" style="display:none">
      <div class="mem-done-card">
        <div class="mem-done-title">🎉</div>
        <div class="mem-done-earn earn-chip dia" id="mem-done-earn"></div>
        <div class="mem-done-btns">
          <button class="btn" onclick="startMemory()">🎤 Nog een keer</button>
          <button class="btn gray" onclick="exitMemory()">🗺️ Kaart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Spel ===== -->
  <div class="screen" id="screen-game">
    <!-- De zaal. Ligt achter alles (z 0) en vangt geen tikken. Elke wereld heeft
         er een: zonder eigen zaaltekening draagt .venue-sfeer hem alleen op de
         wereldkleuren -- zie applyVenue. -->
    <div class="venue" id="game-venue" aria-hidden="true">
      <div class="venue-sfeer"></div>
      <div class="venue-art"></div>
      <div class="venue-licht"></div>
    </div>
    <div class="hub-sticky">
      <div class="screen-header">
        <button class="btn icon-btn header-left" onclick="askQuit()" aria-label="Show stoppen" title="Show stoppen">✕</button>
        <div class="header-title" id="game-lvl-label"></div>
        <div class="diamond-badge header-right">💎 <span id="game-diamonds">0</span></div>
      </div>
      <div class="game-progress-row">
        <span class="notes-left" id="notes-left"></span>
        <div class="segbar" id="qprogress" role="progressbar" aria-label="Voortgang in de show"></div>
      </div>
    </div>
    <div class="game-arena">
      <!-- De bundel en het podium horen bij de ster, niet bij het scherm: ze staan
           dus in dezelfde doos als zij en schuiven met elke indeling mee. -->
      <div class="show-panel">
        <div class="venue-bundel" aria-hidden="true"></div>
        <div class="venue-vloer" aria-hidden="true"></div>
        <div class="stage stage-frame show-stage" id="show-stage">
          <div class="avatar-holder idle" id="game-avatar-inner"></div>
        </div>
      </div>
      <div class="math-panel">
        <div class="question-card" id="question-card">
          <div id="question-text"></div>
          <div class="spot-rail" aria-hidden="true"><div class="spotlight-bar" id="spotlight-bar"></div></div>
        </div>
        <div class="gold-banner" id="gold-banner"></div>

<!-- vangt een tik overal op het scherm op tijdens "tik om verder te gaan" i.p.v.
     alleen op de kleine toast-bubbel zelf -- zit onder de toast (lagere z-index)
     zodat die zelf nog leesbaar bovenop blijft, maar tikken erop valt gewoon door
     naar deze laag (de toast zelf heeft pointer-events:none) -->
<div class="tap-veil" id="tap-veil"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   INHOUD — zoek op de sectienaam (bv. "= Telmodus") om er te springen.
   Regelnummers staan er bewust niet bij: die verouderen meteen.

     Helpers ............ mini-hulpjes ($, rnd, pick, shuffle)
     Items .............. kleerkast-inhoud (data)
     Werelden ........... WORLDS + level→wereld + afgeleide voortgang (data)
     Trofeeën ........... trofee-definities + planken (data)
     Sterrencarrière .... rang-ladder op sterren (RANK_TIERS, starRank)
     Opslag ............. db, load/save, migratie, profielen
     Trilfeedback ....... haptics
     Geluid ............. klikjes, fanfares (WebAudio)
     Gesproken opdrachten  nl-NL stem — ALLEEN telmodus (zie speak())
     Avatar (SVG) ....... de pop tekenen (BASES: meisje of jongen)
     Schermen ........... navigatie, kaart, kop/voet
     Trofeeën-scherm .... kast, claim-ceremonie, ster-status-ladder
     Vragen maken ....... rekenmodus: genTriple/genQuestion/genMissing/genChain
     Telmodus ........... lees-vrije vragen: fases, rungs, genCount, rendering
     Memory-spel ........ los kaartspel (lees-vrij)
     Extra uitdagingen .. beheersing, pauzeren, inroostering speciale vragen
     Spel ............... de show: renderQuestion, submitAnswer, endLevel
     Kleedkamer ......... winkel, passen, aankleden
     Instellingen ....... ouderscherm: voortgang + oefening
     Start .............. opstarten, service worker

   Tests: test/counting.test.js (telmodus) en test/maths.test.js
   (rekenmodus + adaptieve motor). Draaien met `npm test`.
   ===================================================================== */
/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rnd(0, arr.length - 1)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rnd(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ================= De wereldbeloningen, getekend (fase 4D.2) ===============
   Zes hoofdstukken uit zes werelden, en met opzet één familie. Wat ze delen:

     * ze zitten allemaal op dezelfde kop -- het hoofd staat in élke basis op
       (100, 72) met straal 32, dus de schedeltop ligt op y = 40, en alles wat
       hier getekend wordt hoort dáár overheen te vallen en niet ernaast;
     * ze reiken allemaal tot ergens tussen y = 8 en y = 20 en geen enkele komt
       onder y = 59 -- ruim boven de nek (y = 94) waar de kleren beginnen;
     * platte vlakken met één donkerder rand eromheen (~2 breed voor de omtrek,
       ~1.3 voor de details), geen verlopen, geen filters;
     * geen enkele verwijzing naar buiten: geen <image>, geen url(), geen
       klassen. Dat moet ook wel -- itemThumb zet exact dezelfde vormen in een
       vakje van 52 pixels, en een miniatuur heeft geen stylesheet bij zich.

   Functies en geen kant-en-klare strings, om één reden: de hoepel, het blad en
   de noot komen elk meer dan eens voor, en een vorm die je twee keer overtikt
   loopt de derde keer uit elkaar. */

/* De hoepel die precies over de schedel loopt: een boog met straal 34 om
   (100, 74), waardoor zijn top op y = 40 ligt -- de schedeltop zelf. Het
   notenkroontje en de bladerkrans hangen er allebei aan en zitten daardoor ook
   allebei even diep op het hoofd. */
const HOOFDBAND = 'M74 52 A34 34 0 0 1 126 52';
// Eén hoepel = twee streken: eerst de donkere en dikkere, dan de kleur erop.
// Zo krijgt de boog dezelfde rand als elk ander vlak, zonder een tweede pad.
function hoofdband(kleur, rand, dik) {
  return `<path d="${HOOFDBAND}" fill="none" stroke="${rand}" stroke-width="${dik + 3}" stroke-linecap="round"/>`
       + `<path d="${HOOFDBAND}" fill="none" stroke="${kleur}" stroke-width="${dik}" stroke-linecap="round"/>`;
}
/* Een achtste noot: bolletje op de hoepel, steel omhoog, vlaggetje naar rechts.
   Staat rechtop en kantelt niet mee met de boog -- drie schuine noten lezen als
   omgevallen, en dit is een kroontje. De randdikte wordt door de schaal heen
   teruggerekend, anders wordt de kleinste noot ook de dunst omrande. */
function muziekNoot(x, y, sc) {
  const r = (w) => (w / sc).toFixed(2);
  return `<g transform="translate(${x},${y}) scale(${sc})" fill="#ffd740" stroke="#c8a200" stroke-width="${r(1.8)}" stroke-linejoin="round">`
    + `<path d="M3 -1 L3 -18 Q13 -15 11.5 -6 Q10.5 -11.5 6 -12.5 L6 -1 Z"/>`
    + `<ellipse cx="0" cy="0" rx="6" ry="4.6" transform="rotate(-18)"/></g>`;
}
// Eén breed blad met een nerf, met de punt naar buiten gedraaid.
function jungleBlad(x, y, hoek, sc) {
  const r = (w) => (w / sc).toFixed(2);
  return `<g transform="translate(${x},${y}) rotate(${hoek}) scale(${sc})">`
    + `<path d="M0 0 Q10 -8 20 0 Q10 8 0 0 Z" fill="#4caf50" stroke="#2e7d32" stroke-width="${r(2)}" stroke-linejoin="round"/>`
    + `<path d="M3 0 H16" fill="none" stroke="#2e7d32" stroke-width="${r(1.3)}" stroke-linecap="round"/></g>`;
}

// 🎵 Notenkroontje -- een gouden hoepel met drie achtste noten erop, de
// middelste het hoogst. Reikt tot y = 11.
function artNotenkroon() {
  /* De bolletjes staan vríj boven de hoepel en niet erop: goud op goud loopt
     anders tot één vlek dicht, en dan is het een kroontje met drie sprieten. */
  return hoofdband('#ffd740', '#c8a200', 5.5)
    + muziekNoot(82, 35, 0.9) + muziekNoot(118, 35, 0.9) + muziekNoot(100, 29, 1);
}
// 🍭 Lollyhoedje -- een roze-witte spiraallolly naast het hoofd, stokje schuin
// in het haar. Het enige stuk van de zes dat niet midden op de kop zit; het
// stokje loopt naar (80, 57) en dat is net binnen de haarrand.
function artLolly() {
  return `<line x1="69" y1="38" x2="80" y2="57" stroke="#c9a86a" stroke-width="7" stroke-linecap="round"/>`
    + `<line x1="69" y1="38" x2="80" y2="57" stroke="#f0e0c0" stroke-width="4" stroke-linecap="round"/>`
    + `<circle cx="68" cy="26" r="15" fill="#fff5f8" stroke="#d81b60" stroke-width="2"/>`
    /* De draai: halve cirkels met een steeds grotere straal, om en om links en
       rechts van het midden. Eén doorlopend pad, dus één streek -- een spiraal
       uit losse boogjes krijgt bij elke naad een knikje. Drie dikke windingen en
       geen vijf dunne: op de pop is de lolly 15 punten breed, en daar lopen vijf
       lijntjes in elkaar over tot één roze vlek. */
    + `<path d="M71 26 A4.25 4.25 0 0 1 62.5 26 A6.75 6.75 0 0 1 76 26 A9.5 9.5 0 0 1 57 26"`
    + ` fill="none" stroke="#f06292" stroke-width="4.2" stroke-linecap="round"/>`;
}
// 🌴 Bladerkrans -- vijf brede bladeren op een groene hoepel, met één hibiscus
// links erop. De breedste van de zes, en dat hoort ook: het is een krans.
function artBladerkrans() {
  const bloem = (x, y) => {
    let s = '';
    for (let i = 0; i < 5; i++) {
      const a = (i * 72) * Math.PI / 180;
      s += `<circle cx="${(x + 5 * Math.sin(a)).toFixed(1)}" cy="${(y - 5 * Math.cos(a)).toFixed(1)}" r="4.6" fill="#ff5c8a" stroke="#c2185b" stroke-width="1.5"/>`;
    }
    return s + `<circle cx="${x}" cy="${y}" r="3.2" fill="#ffd740" stroke="#c8a200" stroke-width="1.3"/>`;
  };
  return hoofdband('#43a047', '#2e7d32', 6)
    + jungleBlad(74, 52.1, -140, 0.72) + jungleBlad(83, 44.6, -120, 0.88)
    + jungleBlad(100, 40, -90, 1)
    + jungleBlad(117, 44.6, -60, 0.88) + jungleBlad(126, 52.1, -40, 0.72)
    + bloem(75, 46);
}
// 🏴‍☠️ Piratenhoed -- een driekante steek met gouden rand en een crèmekleurig
// doodshoofdje. Het vlak is donker maar niet zwart: de kaartjes in de
// kleedkamer staan zelf al op een donkere achtergrond.
function artPiratenhoed() {
  /* Eén gesloten omtrek, en daarin de drie dingen die een steek een steek maken:
     twee opgeslagen punten die hóger staan dan waar de rand het hoofd raakt
     (60,28) en (140,28), een kruin die daartussen bolt (top op y=16), en een
     rand die in het midden doorzakt. Zonder die punten is het een pet. */
  return `<path d="M60 28 Q66 38 78 40 Q76 20 100 16 Q124 20 122 40 Q134 38 140 28 Q142 48 126 55 Q100 62 74 55 Q58 48 60 28 Z" fill="#39404d" stroke="#ffd54f" stroke-width="2.5" stroke-linejoin="round"/>`
    // de naad waar de omgeslagen rand ophoudt en de kruin begint
    + `<path d="M78 41 Q100 47 122 41" fill="none" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>`
    + `<circle cx="100" cy="31" r="7" fill="#f5efe0"/>`
    + `<path d="M95 36 h10 v3.4 q0 2.5 -5 2.5 q-5 0 -5 -2.5 Z" fill="#f5efe0"/>`
    + `<circle cx="97.4" cy="30.5" r="2.1" fill="#39404d"/><circle cx="102.6" cy="30.5" r="2.1" fill="#39404d"/>`
    + `<path d="M98.7 36.6 v4.2 M101.3 36.6 v4.2" stroke="#39404d" stroke-width="1.2" stroke-linecap="round"/>`;
}
// ❄️ IJskroontje -- drie ijsscherven van ongelijke hoogte. De onderrand is geen
// rechte lijn maar buigt mee met de schedel, zodat de kroon op het hoofd staat
// en er niet bovenop zweeft.
function artIjskroon() {
  return `<path d="M75 51 L82 22 L90 37 L100 12 L110 37 L118 20 L125 51 Q100 36 75 51 Z" fill="#b3e5fc" stroke="#4b9fd0" stroke-width="2" stroke-linejoin="round"/>`
    + `<path d="M100 15 L104.5 35 L100 35 Z" fill="#e8f7ff"/>`
    + `<path d="M83.4 27 Q84 29.4 86.4 30 Q84 30.6 83.4 33 Q82.8 30.6 80.4 30 Q82.8 29.4 83.4 27 Z" fill="#ffffff"/>`;
}
/* 🪄 Tovenaarshoed -- de puntmuts met de gouden sterren. Dit is de tekening die
   al in het spel zat voor het winkelitem acc_tovenaarshoed; dat item is weg en de
   vorm bleef, nu als de beloning van de Toverwereld.

   Één ding is er veranderd: de punt begon op y = 0 en begint nu op y = 8. Dat
   was de hoogste van de zes en stak er dus uit; op 8 reikt hij even ver als het
   ijskroontje en het notenkroontje ernaast. De sterren staan daarom op een breuk
   van de kegelhoogte en niet op een vaste y -- zo blijven ze op hun plek zitten
   als de punt ooit nog verschuift. */
const TOVERHOED_PUNT = 8;
function artToverhoed() {
  const t = TOVERHOED_PUNT, h = 44 - t;
  return `<path d="M100 ${t} L79 44 L121 44 Z" fill="#5e35b1" stroke="#311b92" stroke-width="2"/>`
    + `<path d="M71 44 L129 44 Q129 51 121 51 L79 51 Q71 51 71 44 Z" fill="#7e57c2" stroke="#311b92" stroke-width="1.5"/>`
    + `<text x="92" y="${Math.round(t + h * 0.86)}" font-size="12" fill="#ffd54f">★</text>`
    + `<text x="99" y="${Math.round(t + h * 0.53)}" font-size="9" fill="#ffd54f">★</text>`;
}

/* ================= Werelden =================
   Een wereld is een stuk van de tournee: een vast aantal levels met een eigen

   élke wereld gelijk en staat hier dus níét in. Zie docs/PROGRESSION-REVIEW.md.

   p.level blijft "de eerstvolgende show": 1 t/m WORLD_LAST + 1. Een wereld is puur
   een hergroepering van dat ene getal, dus er verhuist geen enkele opgeslagen ster.

   Maar p.level zegt ALLEEN waar de ster staat, en nooit wat er af is. Of een wereld
   uitgespeeld is leest de app uit p.stars (worldDone), en wat de volgende wereld is
   uit frontierWorld() -- niet uit een nummer. Zie de afgeleide voortgang onder
   worldProgress().

   LET OP -- de vololgorde en de lengtes liggen vast zodra een wereld eenmaal
   gespeeld is. Een wereld ertussen schuiven of korter maken hernummert alle
   levels erna, en dan verhuizen de sterren van een kind naar een andere wereld.
   Achteraan bijplakken mag altijd.

   ---- Een wereld erbij ----------------------------------------------------
   Eén regel in de lijst hieronder, en verder niets. Alles wat de app over een
   wereld weet leest ze hiervandaan:

     WORLD_START/LAST/AVAIL  rebuildWorldStarts() rekent de levelnummers opnieuw uit
     de kaart                worldFor() / worldForIndex() vinden de wereld bij een level
     de tekening             art  (ontbreekt die: de reservekaart met de kleuren hieronder)
     de sfeer                theme -> CSS-variabelen (applyWorldTheme), nooit een if per wereld
     de route                nodes/curve (ontbreken die: defaultNodes() slingert er een)
     de voortgang            worldDone()/frontierWorld() tellen hem vanzelf mee
     de tournee             reisPlaatsen() rijgt hem als bestemming aan de reis,
                             zodra hij binnen de horizon valt -- zie
                             laatsteZichtbareWereld(). Een wereld die verder weg
                             ligt bestaat wél, maar staat nog niet op het scherm en
                             haalt dus ook zijn tekening niet op.
     de zaal                 venue (ontbreekt die: VENUE_TERUGVAL, en dat is de stand
                             van nu -- geen enkele wereld hoeft hem op te geven)
     de beloning             beloning -> het id van een item uit ITEMS, dat je krijgt
                             zodra deze wereld uit is (fase 4D.1). Weglaten mag: dan
                             geeft die wereld geen spulletje.
     de perfecte wereld      niets -- rebuildWorldBadges() zet er vanzelf een trofee
                             bij, op het wereld-id. Overal drie sterren is de enige
                             voorwaarde en die is voor élke wereld gelijk. Er komt
                             géén tweede trofee voor "uitgespeeld": dat levert het
                             spulletje uit `beloning` op (zie fase 5C).

   Zoek dus niet naar een tweede plek -- die is er niet, en als je er ooit een
   nodig lijkt te hebben, hoort het veld hier en niet daar.

   ---- Een eigen zaaltekening voor een wereld ------------------------------
   Er is er nog geen; de zaal leent nu de wereldkaart zelf (zie VENUE_TERUGVAL).
   Komt die er wél, dan is dat één regel in de wereld hieronder:

     venue: { art: 'assets/bg/venue-ijs.webp', zoom: 100, focus: '50% 50%', blur: 0, dim: 1, op: 1 },

   Meer niet. Geen tweede pad, geen if, geen nieuw scherm: applyVenue hangt hem
   in dezelfde laag waar nu de geleende kaart hangt, en alles eromheen (het licht,
   de vloer, de bundel, de kop) blijft precies zoals het staat.

   released: false houdt een wereld uit het spel terwijl hij zíjn levelnummers al
   wel reserveert -- zie worldReleased(). Laat het veld gewoon weg voor een wereld
   die gespeeld mag worden.

   Let op dat "geschreven", "uitgebracht" en "te zien" drie verschillende dingen
   zijn, en dat een wereld hier staan dus niet betekent dat een kind hem ziet:

     geschreven    hij staat in deze lijst
     uitgebracht   hij mag gespeeld worden      (released, zie worldReleased)
     te zien       hij staat op de reis         (zie laatsteZichtbareWereld)

   Een wereld kan geschreven zijn en niet uitgebracht (klaar voor later), en hij
   kan uitgebracht zijn en toch nog niet te zien (te ver vooruit). Alle drie zijn
   afgeleid; er wordt er geen van bewaard.

   Velden die er nog NIET zijn omdat de app ze nog niet nodig heeft:
   wereld-outfit, ontgrendel-voorwaarde. Ontgrendelen loopt nog steeds via p.level
   (een halte is speelbaar t/m p.level, en werelden staan op een rij), en dat is
   precies genoeg. Komen die dingen er, dan komen ze hier als veld bij -- niet als
   uitzondering ergens in een scherm.

   (beloning stond in dat rijtje tot fase 4D.1; nu is het gewoon een veld.) */
