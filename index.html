    background: linear-gradient(180deg, transparent, rgba(58,26,2,.6) 38%, rgba(48,20,2,.92));
  }
  .reis-halte.vol .reis-sterren { color: var(--gold-accent); }

  /* Hier ben je. De enige bestemming die groter is, licht geeft en de ster draagt --
     en de enige met beweging op dit scherm. */
  .reis-halte.nu { --kaart-b: clamp(166px, 51vw, 216px); z-index: 4; }
  /* De gloed stond een derde te hoog. "Hier ben je" wordt al gezegd door de ster
     erop, de gouden route ernaartoe, de maat van de kaart en de gouden rand -- de
     gloed hoeft dat alleen te onderstrepen. Op deze waarde blijft de tékening het
     helderste ding op de kaart, en dat is de bedoeling. */
  .reis-halte.nu .reis-plaats {
    box-shadow: inset 0 0 0 2.5px var(--gold-accent), 0 0 0 1px rgba(18,6,36,.6),
                0 0 20px rgba(255,193,7,.32), 0 16px 30px var(--stop-schaduw);
    animation: reisGloed 3.4s ease-in-out infinite alternate;
  }
  @keyframes reisGloed {
    from { box-shadow: inset 0 0 0 2.5px var(--gold-accent), 0 0 0 1px rgba(18,6,36,.6),
                       0 0 13px rgba(255,193,7,.2), 0 16px 30px var(--stop-schaduw); }
    to   { box-shadow: inset 0 0 0 2.5px var(--gold-accent), 0 0 0 1px rgba(18,6,36,.6),
                       0 0 26px rgba(255,193,7,.42), 0 16px 30px var(--stop-schaduw); }
  }
  .reis-halte.nu::before { background: radial-gradient(closest-side,
    rgba(255,196,90,.22), rgba(var(--w-sky-rgb, 61,26,99), .2) 48%, transparent 76%); }
  .reis-halte.nu .rn-tekst { font-size: 13.5px; }

  /* Nog niet aan de beurt. De tekening blíjft staan -- dat is de hele reden dat een
     kind omhoog wil -- maar ontkleurd, donkerder en met een koele waas erover: je
     ziet dat het er is en dat je er nog niet bent. Geen gloed, geen rand, geen
     sterren (er valt nog niets te tellen). */
  .reis-halte.verder { --kaart-b: clamp(132px, 40vw, 172px); }
  .reis-halte.verder .reis-plaats {
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.08), 0 0 0 3px rgba(18,6,36,.5),
                0 10px 20px var(--stop-schaduw);
  }
  .reis-halte.verder .reis-art { filter: saturate(.54) brightness(.75) contrast(.95); }
  .reis-halte.verder .reis-plaats::after {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(34,30,86,.28), rgba(12,8,36,.4));
  }
  .reis-halte.verder::before { opacity: .35; }
  .reis-halte.verder .rn-tekst { opacity: .72; font-weight: 700; }
  .reis-halte.verder .reis-label { padding-top: 10px; }

  /* Hier stond .reis-halte.mist: een vorm in de nevel voor een wereld die nog niet
     uitgebracht was. Die staat er niet meer -- een wereld die er voor een kind nog
     niet is hoort ook niet als vraagteken op zijn reis te staan, en de reis houdt
     sowieso een paar bestemmingen voorbij "hier" op (zie laatsteZichtbareWereld).
     Wat daarboven ligt zegt de mist, en die telt niet hoeveel het er zijn. */

  /* ---- De ster op de reis -------------------------------------------------
     Klein gehouden: ze moet te zien zijn dat ze ergens stáát, niet de bestemming
     afdekken. Ze zakt een stuk over de bovenrand van haar kaart heen -- dat leest
     als "erop" in plaats van "erboven", en het scheelt precies de hoogte die de
     bestemmingen dichter op elkaar laat staan. Dezelfde gloed en contactschaduw als
     op de wereldkaart (.tour-hero), alleen in pixels.

     --pop-kant schuift haar een tikje naar de kant waar de route verdergaat, zodat
     ze de goede kant op lijkt te kijken; renderReis zet 'm. */
  .reis-pop {
    position: absolute; left: calc(50% + var(--pop-kant, 0px)); bottom: calc(100% - 34px);
    transform: translateX(-50%); width: 56px; pointer-events: none; z-index: 3;
  }
  .reis-pop svg { width: 100%; height: auto; display: block; position: relative; z-index: 1; }
  .reis-pop::before {
    content: ''; position: absolute; z-index: 0; left: 50%; bottom: 4px; transform: translateX(-50%);
    width: 78px; height: 78px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,247,220,.44), rgba(255,236,186,.15) 54%, transparent 74%);
  }
  .reis-pop::after {
    content: ''; position: absolute; z-index: 0; left: 50%; bottom: 1px; transform: translateX(-50%);
    width: 38px; height: 10px; border-radius: 50%; background: rgba(12,2,26,.45); filter: blur(3px);
  }

  /* ---- De mist bovenaan ----------------------------------------------------
     Waar de reis ophoudt, houdt hij niet óp: de route loopt door en verdwijnt in de
     wolken. Dat staat er altijd -- of er nu nog werelden boven je liggen of niet.
     Alleen als álles uit is komt er één pil bij, want dán is "er komt nog meer" het
     enige dat er nog te zeggen valt. */
  .reis-mist {
    position: absolute; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
    height: calc(var(--reis-stap) * 1.6); overflow: hidden;
    background: linear-gradient(180deg, #110720 12%, rgba(17,7,32,.86) 46%, rgba(17,7,32,0) 100%);
  }
  .reis-mist .map-sky-inner > span { opacity: .26; }
  .reis-vervolg {
    position: absolute; left: 50%; top: 38%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 13px; font-weight: 700; letter-spacing: .02em; padding: 6px 13px; border-radius: var(--r-pill);
    color: var(--lavender-text); background: rgba(32,12,58,.6);
    border: 1px solid var(--glass-white-22); text-shadow: var(--hud-ink);
  }

  /* ---- Terug naar waar je bent --------------------------------------------
     Alleen als je zover weggescrold bent dat je jezelf niet meer ziet. Hij staat op
     dezelfde plek als de memory-knop op de kaart (rechtsonder, boven de balk), draagt
     hetzelfde donkere glas als de rest van de zwevende bediening, en verdwijnt zodra
     je weer in de buurt bent -- dus hij staat nooit "voor het geval dat" in beeld. */
  .reis-terug {
    position: fixed; right: 14px; bottom: calc(var(--balk-ruimte) + 10px); z-index: 30;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--glass-white-28);
    display: flex; align-items: center; justify-content: center; padding: 0;
    font-family: inherit; font-size: 19px; color: var(--c-white); cursor: pointer;
    background: rgba(32,12,58,.8);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(8px) scale(.9); pointer-events: none;
    transition: opacity .2s ease, transform .2s var(--ease-uit);
  }
  .reis-terug.aan { opacity: 1; transform: none; pointer-events: auto; }
  .reis-terug:active { transform: scale(.92); }

  @media (max-width: 360px) {
    #screen-journey .reis-titel { font-size: 15.5px; gap: 5px; }
    #screen-journey .reis-titel .rt-ico { display: none; }
    #screen-journey .icon-btn { width: 34px; height: 34px; font-size: 16px; }
    #screen-journey .diamond-badge { font-size: 15.5px; padding: 0 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reis-halte.nu .reis-plaats { animation: none; }
    .reis-plaats, .reis-terug { transition: none; }
    .reis-mist .map-sky-inner > span { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .map-sky span, .avatar-holder.idle { animation: none; }
    /* De spotlight blíjft -- hij is een kleur op de grond, geen beweging, en juist
       zonder de ademende gloed is hij wat er nog overblijft om "hier speel je"
       te zeggen. Alleen het ademen ervan gaat uit. */
    .tour-stop.next::after { animation: none; opacity: .9; }
    /* De indrukveer gaat uit; de tik zelf blijft voelbaar via het filter op .dot,
       dat geen beweging is. */
    .tour-stop .stop-body, .tour-stop:active .stop-body { transition: none; }
    /* Het aankomst-moment gaat uit; het tabje en de sterren staan er dan gewoon.
       Er gaat niets verloren -- de sterren zíjn het bericht, de beweging was
       alleen de aankondiging ervan. */
    .tour-stop.net-af .cstars, .tour-stop.net-af .cstars svg { animation: none; }
    .cq-listen, .cg-obj.pop, .cg-dot.pop { animation: none; }
    .cg-obj.pre, .cg-dot.pre { opacity: 1; transform: none; }
    .cg-obj.fade-out, .cg-dot.fade-out { animation: none; opacity: .12; }
    .df-dot.pre { opacity: 1; transform: none; }
    .df-dot.pop { animation: none; }
    .df-dot.fade-out { animation: none; opacity: .12; }
    .mem-inner { transition: none; }
    .mem-card.done .mem-face { animation: none; }
  }

  /* ---- Trofeeënkast (fase 5C) ----
     Het scherm heette een kast maar zag eruit als een voortgangsrapport: een balk
     in de kop, een balk per plank, een balk per kaartje, en bovenaan ook nog de
     ster-statusbalk. Wat een kind zag was hoevéél er nog niet af was.

     De herindeling is bijna helemaal wéghalen. Wat blijft: één rustige regel met
     de stand, vier planken met lucht ertussen, en kaartjes met maar twee standen
     die ertoe doen -- goud (van mij) en gedempt (nog niet). Het paars, de ronde
     hoeken, het glas en het goud blijven precies zoals de rest van de app ze
     gebruikt; er is geen nieuwe vormtaal bijgekomen. */
  /* Breder dan de standaard 680: de perfecte werelden staan op tabletbreedte met
     z'n drieën naast elkaar en hebben ruimte nodig voor hun medaillon. */
  #screen-trophies { --kolom: 760px; }
  /* De stand, in de kop, als zin. Geen balk: zie renderShelves. */
  .kast-telling {
    font-size: 13px; font-weight: 700; color: var(--lavender-text);
    opacity: .82; text-align: center; margin-top: 2px;
    /* zie .gescrold hieronder: hij klapt weg zodra er gescrold wordt. max-height
       en niet display:none, anders springt de kop in plaats van te krimpen. */
    max-height: 20px; overflow: hidden;
    transition: max-height var(--t-snel, .22s) ease, opacity var(--t-tik, .1s) ease, margin-top var(--t-snel, .22s) ease;
  }
  /* ---- De plakkende kop, twee standen ----
     Bovenaan is dit een kop met lucht: titel, saldo en de zin met de stand, op
     dezelfde halfdoorzichtige paarse plaat als elk ander rustpunt.

     Maar zodra er gescrold wordt schuiven er trofeekaarten onderdoor, en op .82
     dekking bleven hun namen daar gewoon leesbaar staan: "Goudzoeker" dwars door
     "Trofeeënkast" heen. Glas hoort te tonen dát er iets onder zit, niet wát.
     Gescrold wordt de plaat daarom dichter en de waas twee keer zo sterk, en
     tegelijk krimpt de kop: de zin met de stand klapt weg (die heb je bovenaan
     al gelezen) en de randen worden krapper. Wat overblijft is precies wat je
     onderweg nodig hebt -- terug, waar je bent, en je saldo.

     Gescrold dekt hij vólledig, en dat is met tegenzin zo gekomen. Nagemeten op een
     telefoon met de kast half gescrold, als het grootste licht/donker-verschil in de
     strook naast de titel (0-255): .82 gaf 28-33, .95 nog 9-14, .97 nog 5-11. Ook op
     .97 stonden er dus nog spookletters achter "Trofeeënkast" -- op armlengte niet te
     zien, maar wel zodra je het scherm van dichtbij bekijkt, en dát was precies de
     klacht. Alleen volledig dekken haalt ze helemaal weg.

     Wat er wél blijft van het glas: de waas staat er nog (hij pakt wat er langs de
     ronde onderhoeken heen kijkt), de kop bovenaan is onveranderd doorschijnend
     (.82, zie de regel hierboven), en de plaat is geen vlakke rechthoek maar een
     verloop -- dezelfde truc als de kleedkamerkop, die ook een laag over zijn
     grondkleur legt. Een plakkende kop is hier geen raam maar een richel waar de
     kast onderdoor schuift, en een richel hoort dicht te zijn.

     De overgang loopt over de kop zelf en niet over een tweede laag: één element,
     twee standen, dus er kan niets uit de pas gaan lopen. */
  #screen-trophies .hub-sticky {
    transition: padding var(--t-snel, .22s) ease, background var(--t-snel, .22s) ease,
                box-shadow var(--t-snel, .22s) ease;
  }
  #screen-trophies.gescrold .hub-sticky {
    padding-top: 8px; padding-bottom: 7px;
    background: var(--kop-plaat-vol);
    backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: var(--e-3);
  }
  #screen-trophies.gescrold .kast-telling { max-height: 0; opacity: 0; margin-top: 0; }
  #screen-trophies.gescrold .hub-sticky .screen-header { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) {
    #screen-trophies .hub-sticky, .kast-telling { transition: none; }
  }
  #trophy-shelves { width: 100%; max-width: var(--kolom); }
  /* Een plank: een eigen vlak met lucht eromheen, zodat de vier groepen echt vier
     groepen zijn. Ruimer dan voorheen (was 6/12/13 met 14 marge) -- dat was krap
     omdat er acht planken op het scherm moesten; met vier mag het ademen. */
  /* FASE 5E -- de plank is de rústigste van de drie vlakken: hij is een groep en
     geen kaartje, dus hij ligt een halve trap onder het nutskaartje erin. Dezelfde
     haarlijn licht bovenin als elk ander vlak in de app (--vlak-top). */
  .shelf {
    background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(0,0,0,.14));
    border: 1px solid var(--glass-white-13);
    border-radius: var(--r-lg); padding: 14px 13px 16px; margin: 16px 0 0;
    box-shadow: var(--vlak-top);
  }
  .shelf:last-of-type { margin-bottom: 4px; }
  /* Plank compleet: één zacht gouden randje, en verder niets. Geen teller die
     "5 van 5" zegt -- dat staat al op de vijf gouden kaartjes eronder. */
  .shelf.full { border-color: var(--goud-rand); box-shadow: inset 0 1px 0 rgba(255,241,190,.16); }
  .shelf-title { margin: 0 2px 12px; }
  .shelf-naam { font-size: 16.5px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 1px 0 var(--glass-black-25); }
  .shelf-note { font-size: 12.5px; font-weight: 600; color: var(--lavender-text); opacity: .78; margin-top: 2px; line-height: 1.25; }
  /* flex i.p.v. grid, zelfde reden als .item-grid in de kleedkamer: planken hebben
     een oneven aantal kaartjes, en CSS Grid geeft elke rij dezelfde kolomposities --
     de laatste, onvolledige rij bleef daardoor links hangen i.p.v. te centreren. */
  .trophy-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; align-items: stretch; }
  /* Vaste kolombreedte (flex-grow: 0) i.p.v. meegroeien: een laatste, alleenstaande
     kaart heeft niemand om de breedte mee te delen en zou anders zichtbaar bréder
     worden dan de kaarten erboven -- precies op de plek waar hij al als enige
     gecentreerd staat. Een kaart wisselt nergens in deze app van formaat. */
  /* FASE 5E -- letterlijk hetzelfde plankje als het kleedkamerkaartje (--vlak*),
     inclusief de haarlijn licht bovenin die hier ontbrak. De kast en de kleedkamer
     zijn de twee verzamelschermen van de app; ze horen van hetzelfde hout te zijn. */
  .trophy-card {
    position: relative; flex: 0 1 calc(50% - 5px); max-width: 210px;
    background: var(--vlak);
    border: 2px solid var(--vlak-rand);
    border-radius: var(--r-md); padding: 13px 9px 12px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; gap: 1px;
    box-shadow: var(--vlak-top);
    transition: filter .12s, transform .07s;
  }
  .trophy-card:hover { filter: brightness(1.1); }
  .trophy-card:active { transform: scale(.97); }
  .trophy-card .temoji { font-size: 38px; line-height: 1; height: 44px; display: grid; place-items: center; filter: var(--emoji-schaduw); }
  .trophy-card .tname { font-size: 15px; font-weight: 700; margin-top: 3px; line-height: 1.14; }
  .trophy-card .tdesc { font-size: 12.5px; font-weight: 600; color: var(--lavender-text); opacity: .8; margin-top: 3px; line-height: 1.2; }
  /* drie kolommen zodra de plank het comfortabel trekt, vier op tabletbreedte */
  @media (min-width: 560px) { .trophy-card { flex-basis: calc(33.333% - 6.7px); } }
  @media (min-width: 760px) { .trophy-card { flex-basis: calc(25% - 7.5px); } }
  /* ===== twee standen, en één ervan is goud =====
     NOG NIET: gedempt, maar niet kapot. Het icoon blijft in kleur (grijs maken zou
     zeggen "hier is niets"), alleen zachter -- een kind hoort te kunnen zien wat er
     nog te halen valt. */
  .trophy-card.fresh .temoji, .trophy-card.busy .temoji { opacity: .55; }
  .trophy-card.fresh .tname, .trophy-card.busy .tname { opacity: .8; }
  /* LOCKED: donkerder, icoon sterk gedimd (voorlopig sluimerend, zie trophyStatus) */
  .trophy-card.locked { background: var(--glass-black-26); border-color: var(--glass-white-10); box-shadow: none; }
  .trophy-card.locked .temoji { filter: grayscale(1); opacity: .45; }
  .trophy-card.locked .tname, .trophy-card.locked .tdesc { opacity: .5; }
  /* BEHAALD: trots, maar stil.
     Dit is de 'verdiend'-taal die de rest van de app al spreekt (afgelegde halte op
     de kaart, aangetrokken stuk in de kleedkamer), met één bijstelling na het
     kijken op een telefoon: daar staan zes, acht behaalde kaarten onder elkaar, en
     met een rand in vól goud plus een gouden halo eromheen werd de hele kolom één
     gouden vlak -- waarin de kaart die écht om een tik vraagt ('klaar om te
     openen') niet meer opviel.

     Dus: het licht ván binnen doet het werk (een warme veeg achter het icoon), de
     rand is goud maar half doorzichtig, en de halo eromheen is weg. Vol goud en
     een gloed naar buiten zijn nu exclusief van .ready -- daar is er hoogstens één
     van in beeld, en die mag schreeuwen. De rangorde is daarmee:
        klaar om te openen  vol goud + gloed + beweging
        behaald             zacht goud + warm licht van binnen, volkomen stil
        nog niet            gedempt, maar in kleur */
  /* FASE 5E.1 -- bezonken. Deze kaart stond op --goud-rand (.5) met een warme veeg
     van .28 erachter, en dat is bijna dezelfde randsterkte als .ready hieronder. In
     een kast met acht kaarten waarvan er zes behaald zijn, is dat weer één gouden
     vlak -- en dan moet je zóeken welke er om een tik vraagt. Een halve trap terug
     (--goud-rand-zacht, en de veeg van .28 naar .2) laat de kaart nog steeds warm
     en verdiend lezen, maar hij roept niet meer. De gouden naam blijft: dáár zie je
     op leesafstand aan dat je hem hebt. */
  .trophy-card.done {
    background:
      radial-gradient(78% 60% at 50% 26%, rgba(var(--goud-rgb),.2), transparent 74%),
      var(--goud-tint-zacht);
    border-color: var(--goud-rand-zacht);
    box-shadow: inset 0 1px 0 rgba(255,241,190,.16);
  }
  .trophy-card.done .tname { color: var(--gold-light); }
  .trophy-card.done .tdesc { color: var(--c-white); opacity: .8; }
  /* De stand op een lopende kaart: alleen het getal, geen balk. "82 / 100 sommen"
     zegt alles wat een balkje zou zeggen, en het staat er in de taal van een
     rekenspel. De balk stond op élke kaart en maakte van de kast een lijst. */
  .tstand { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--c-white); opacity: .78; }
  .tstand span { font-weight: 600; opacity: .8; }
  .tstand.sub { font-weight: 600; opacity: .55; }
  /* ===== De perfecte werelden =====
     De grootste prijs van het spel, en de enige kaart die eruit springt. Het
     medaillon is dezelfde vorm als bij de onthulling na de laatste ster (zie
     .wf-trofee): het wereldicoon in een rondje, en behaald een gouden ring met een
     ster in de hoek. De kleur ín het rondje komt van de wereld zelf (theme.sky /
     theme.glow, via inline --pw-sky/--pw-glow), dus een zevende wereld krijgt zijn
     eigen medaillon zonder dat hier iets bij hoeft. */
  .pw-grid { gap: 11px; }
  /* Ruimer dan een gewone kaart, en sinds deze polijstronde ruimer dan hij was: er
     stond onder elke naam nog "Overal drie sterren", zes keer. Die regel is weg
     (zie perfectCardHTML) en de ruimte gaat naar het medaillon -- dát is waar je
     naar kijkt, niet naar het bijschrift. */
  .pw-card { flex: 0 1 calc(50% - 5.5px); max-width: 240px; padding: 17px 10px 16px; }
  @media (min-width: 560px) { .pw-card { flex-basis: calc(33.333% - 7.4px); } }
  @media (min-width: 760px) { .pw-card { flex-basis: calc(33.333% - 7.4px); } }
  .pw-card .tname { margin-top: 9px; font-size: 15.5px; }
  .pw-medal {
    position: relative; width: 76px; height: 76px; margin: 2px auto 0;
    border-radius: 50%; display: grid; place-items: center;
    background:
      radial-gradient(76% 76% at 50% 22%, var(--pw-glow, #7a2f63), transparent 74%),
      linear-gradient(180deg, var(--pw-sky, #3a1f6e), rgba(0,0,0,.42));
    border: 2px solid var(--glass-white-30);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 10px rgba(0,0,0,.3);
  }
  .pw-ico { font-size: 35px; line-height: 1; filter: var(--emoji-schaduw); }
  /* Nog niet perfect: de wereldkleur blijft, een slag zachter. Geen grijs -- de
     blauwe IJswereld hoort ook ongewonnen nog blauw te lokken. */
  .pw-card.fresh .pw-medal, .pw-card.busy .pw-medal { opacity: .62; }
  .pw-card.fresh .pw-ico, .pw-card.busy .pw-ico { opacity: .8; }
  /* Behaald: gouden ring, gouden gloed, en de ster in dezelfde hoek als bij de
     onthulling. Dít is het kaartje waar een kind acht shows lang naar toe werkt. */
  .trophy-card.done .pw-medal {
    border-color: var(--gold-accent);
    box-shadow: inset 0 2px 0 rgba(255,241,190,.3), 0 0 16px rgba(255,196,61,.5);
  }
  .trophy-card.done .pw-medal::after {
    content: '⭐'; position: absolute; right: -6px; bottom: -6px; font-size: 20px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  /* ===== KLAAR OM TE OPENEN =====
     De normale kaart (eigen icoon, eigen naam, eigen beschrijving) met een gouden
     rand en "🎁 Open!" onderaan. Bewust niet een compleet ander kaartje: vijf
     klaarliggende trofeeën moeten vijf verschillende dingen blijven. */
  /* Vol goud plus de gloed: precies dezelfde twee dingen als het kledingstuk dat
     je draagt (.item-card.equipped). Één gloedsterkte in de hele app -- was .48 op
     een eigen oranje hier en .46 op een eigen geel daar. */
  .trophy-card.ready {
    border-color: var(--gold-accent); background: var(--goud-tint);
    box-shadow: var(--goud-gloed);
  }
  .ready-open {
    display: block; text-align: center; margin-top: 8px;
    color: var(--ink-on-gold); background: var(--gold-accent);
    font-size: 13.5px; font-weight: 700; letter-spacing: .01em;
    border-radius: var(--r-pill); padding: 5px 8px;
    animation: readyPulse 1.4s ease-in-out infinite;
  }
  /* FASE 5E -- de klop zit in de gloed en niet meer in een slagschaduw die met de
     schaduwlip van een knop te verwarren was. Van de gedeelde gouden gloed naar
     anderhalf keer die gloed: één beweging, in de kleur die "verdiend" betekent. */
  @keyframes readyPulse { 0%,100% { transform: scale(1); box-shadow: var(--goud-gloed); } 50% { transform: scale(1.03); box-shadow: 0 0 26px rgba(255,190,60,.7); } }
  /* dé gouden mijlpaal-pil: één component voor "rang omhoog" en "trofee klaar",
     op het eindscherm (.end-milestone) en in de trofeeënkast. Hoogstens één
     tegelijk in beeld.

     FASE 5E -- hij droeg lettérlijk het verloop van de hoofdknop (--gold-cta-top/
     bottom). Op het eindscherm stonden daardoor twee identieke gouden dingen onder
     elkaar: "3 nieuwe trofeeën klaar!" en "Verder op tournee". Dezelfde kleur,
     hetzelfde verloop, dezelfde maat -- alleen pulseerde de bovenste, en dus trok
     juist de belóning de tik weg bij de knop die het scherm afmaakt.

     Nu spreekt hij de taal van "verdiend" en niet die van "druk hier": vlak goud
     (--gold-accent, precies het goud van een behaalde trofee en van het kledingstuk
     dat je draagt) in plaats van een verloop, en géén schaduwlip -- een lip is wat
     een knóp indrukbaar maakt. Hij blijft tikbaar en hij blijft pulseren; hij is
     alleen niet langer de hoofdknop van het scherm.

     FASE 5E.1 -- en daarna nog één trap terug. Het gouden verloop was weg, maar de
     pil hield de máten van een knop: 16,5px letter, 10px lucht boven en onder, en
     een gloed van dezelfde sterkte als het kledingstuk dat je draagt. Op een
     telefoon stonden daardoor nog steeds twee dingen van bijna dezelfde breedte
     onder elkaar te stralen, en las de bovenste als de eerste van twee knoppen.
     Vier kleine dingen samen halen dat weg zonder hem stil te maken:

       - 15,5px in plaats van 16,5 en 7px lucht in plaats van 10: de pil krimpt
         zichtbaar naar meldingsformaat en wordt vanzelf smaller, want hij is
         inline-flex en groeit met zijn inhoud mee.
       - de vulling een tikje terug (.88 in plaats van vol): nog steeds goud, nog
         steeds donkere inkt erop, maar niet langer het felste vlak van het scherm.
         De hoofdknop is dat nu alleen.
       - --goud-gloed-zacht in plaats van --goud-gloed: een halo van een derde.
       - de klop zit alleen nog in de maat en niet meer in de gloed (beloningKlop
         i.p.v. readyPulse). Een pulserende halo vlak boven een knop is precies wat
         "druk hier" zegt; een zacht ademende pil zegt "kijk eens".

     Het cadeautje en de tekst blijven staan zoals ze waren -- dát is waar een kind
     aan ziet wat er gebeurd is -- en het raakvlak blijft ruim boven 44px. */
  .gold-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    color: var(--ink-on-gold); font-weight: 700; font-size: 15.5px; font-family: inherit;
    background: rgba(var(--goud-rgb), .88); border: none; border-radius: var(--r-pill);
    padding: 7px 16px; min-height: 34px; box-shadow: var(--goud-gloed-zacht);
    animation: beloningKlop 2.4s ease-in-out infinite; cursor: pointer;
  }
  /* Dezelfde ademhaling als readyPulse, maar zonder de gloed erin en trager: dit is
     een melding die er nog staat, geen knop die om een tik vraagt. */
  @keyframes beloningKlop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  @media (prefers-reduced-motion: reduce) { .gold-pill { animation: none; } }
  .gold-pill:active { transform: scale(.96); }
  /* ---- Claim-feestje: klein, vrolijk, blijft open tot er getikt wordt ---- */
  .trophy-pop-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(20,4,40,.45); animation: popFade .25s ease; cursor: pointer;
  }
  .trophy-pop-overlay.closing { animation: popFade .3s ease reverse forwards; }
  .trophy-pop { padding: 22px 30px; }
  .tp-head { font-size: 16px; font-weight: 700; color: var(--gold-light); }
  .tp-emoji { font-size: 66px; line-height: 1.1; margin: 4px 0; filter: drop-shadow(0 0 10px rgba(255,215,64,.8)); }
  .tp-name { font-size: 20px; font-weight: 700; color: var(--c-white); }
  .tp-joepie { font-size: 15px; font-weight: 700; color: var(--pink-light); margin-top: 4px; }
  @keyframes popFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { 0% { transform: scale(.4) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.1) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  /* ---- Ster-status omhoog: dé grote mijlpaal. Het nieuwe rang-icoon knalt naar
     voren met een uitbarsting van datzelfde icoon eromheen. ---- */
  .rankup-overlay {
    position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(circle at 50% 44%, rgba(74,20,140,.5), rgba(20,4,40,.66)); animation: popFade .3s ease;
  }
  .rankup-overlay.closing { animation: popFade .3s ease reverse forwards; }
  .rankup-core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
  .rankup-sparks { position: absolute; left: 50%; top: 50px; width: 0; height: 0; }
  .rankup-spark { position: absolute; left: 0; top: 0; font-size: 30px; opacity: 0; animation: rankSpark 1s ease-out both; }
  .rankup-badge { font-size: 94px; line-height: 1; filter: drop-shadow(0 6px 16px rgba(0,0,0,.55)); animation: rankBadgePop .7s cubic-bezier(.2,1.5,.4,1) both; }
  .rankup-label { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-light); text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: rankTextRise .5s ease .28s both; }
  .rankup-name { font-size: clamp(26px, 8vw, 34px); font-weight: 700; color: var(--c-white); text-shadow: 0 0 16px var(--gold-cta-bottom), 0 3px 0 rgba(0,0,0,.35); animation: rankTextRise .5s ease .4s both; }
  @keyframes rankBadgePop { 0% { transform: scale(0) rotate(-45deg); } 60% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes rankTextRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes rankSpark {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    22% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05); }
  }

  /* ---- Wereldfeest (fase 4D.1): wereld uit, en/of overal drie sterren ----
     Eén laag voor allebei. De vorm is met opzet die van een kaartje en niet die
     van de trofee-onthulling: er wordt hier niets geopend, er wordt iets láten
     zien. Vandaar geen kist, geen stralenkrans en geen spanning -- alleen wat je
     nu hebt, met een confetti-kanon eromheen (dat komt uit confettiBurst, niet
     uit de CSS).

     Eén regel of twee, en de tweede is niet belangrijker dan de eerste: ze staan
     onder elkaar in dezelfde vorm, want "je hebt een spulletje" en "je wereld is
     perfect" zijn twee even grote dingen die toevallig samenvielen. */
  .wereld-feest-overlay {
    position: fixed; inset: 0; z-index: 96; display: flex; align-items: center; justify-content: center;
    padding: 16px; cursor: pointer;
    background: radial-gradient(circle at 50% 42%, rgba(74,20,140,.5), rgba(20,4,40,.66)); animation: popFade .3s ease;
  }
  /* pointer-events uit zodra hij wegfadet: die 300 ms zijn anders een laag glas
     over de knop waar het kind net naartoe wilde */
  .wereld-feest-overlay.closing { animation: popFade .3s ease reverse forwards; pointer-events: none; }
  .wereld-feest { width: min(92vw, 360px); padding: 18px 18px 14px; }
  .wf-kop { font-size: clamp(24px, 7.5vw, 30px); font-weight: 700; color: var(--c-white); line-height: 1.1;
    text-shadow: 0 0 16px var(--gold-cta-bottom), 0 3px 0 rgba(0,0,0,.35); }
  .wf-wereld { font-size: 15px; font-weight: 700; color: var(--gold-light); margin-top: 3px; }
  .wf-rijen { display: flex; flex-direction: column; gap: 8px; margin: 13px 0 4px; }
  /* Een regel is een plaatje links en twee woorden rechts -- links uitgelijnd, want
     twee gecentreerde regels onder elkaar hebben geen gemeenschappelijke lijn en
     lezen dan als twee losse plaatjes. */
  .wf-rij { display: flex; align-items: center; gap: 11px; text-align: left;
    padding: 9px 12px; border-radius: var(--r-sm);
    background: rgba(255,214,90,.13); border: 2px solid var(--gold-accent); }
  /* Iets breder dan het vakje in de kleedkamer (52), en dat is fase 4D.2: de
     getekende beloningen zijn niet allemaal even breed als hoog -- de
     bladerkrans is bijna twee keer zo breed als hij hoog is. In een raster van
     kaartjes is daar plaats voor, in één regel naast een tekst niet. */
  .wf-beeld { flex: none; width: 72px; display: flex; align-items: center; justify-content: center; }
  /* het item leent het miniatuur uit de kleedkamer: één tekening, twee plekken */
  .wf-beeld .item-thumb { margin: 0; width: 72px; }
  .wf-trofee {
    position: relative; display: grid; place-items: center; width: 46px; height: 46px;
    border-radius: 50%; font-size: 26px; line-height: 1;
    /* exact hetzelfde medaillon als .pw-medal in de kast, alleen kleiner: de
       wereldkleuren van binnen, de gouden ring eromheen, de ster in de hoek. */
    background:
      radial-gradient(76% 76% at 50% 22%, var(--pw-glow, #7a2f63), transparent 74%),
      linear-gradient(180deg, var(--pw-sky, #3a1f6e), rgba(0,0,0,.42));
    border: 2px solid var(--gold-accent);
    box-shadow: inset 0 2px 0 rgba(255,241,190,.3), 0 0 12px rgba(255,196,61,.45);
  }
  /* dezelfde ster in dezelfde hoek als op het medaillon in de kast (.pw-medal) */
  .wf-trofee::after { content: '⭐'; position: absolute; right: -4px; bottom: -4px;
    font-size: 15px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .wf-tekst { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .wf-tekst b { font-size: 16px; font-weight: 700; color: var(--gold-light); }
  .wf-tekst span { font-size: 14px; font-weight: 700; color: var(--c-white); opacity: .92;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-verder { font-size: 12.5px; font-weight: 700; color: var(--c-white); opacity: .6; margin-top: 8px; }
  .wereld-feest .wf-rij { animation: rankTextRise .45s ease both; }
  .wereld-feest .wf-rij:nth-child(2) { animation-delay: .12s; }
  @media (prefers-reduced-motion: reduce) {
    .wereld-feest-overlay { animation: none; }
    .wereld-feest .wf-rij { animation: none; }
  }

  /* ===== Trofee-feestje, versie "dopamine" =====
     Vier momenten: (1) de klare kaart lokt met glans + wiebel, (2) de tik geeft
     een ripple, (3) het openen is een schatkist die openknalt met stralen,
     schokgolf en een confetti-kanon, (4) de behaalde kaart glimt kort na. */

  /* (1) Klare trofee: een glans-veeg glijdt over de kaart + het cadeau wiebelt */
  .trophy-card.ready { overflow: hidden; }
  .trophy-card.ready::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%; z-index: 3; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(0) skewX(-18deg);
    animation: shineSweep 2.6s ease-in-out infinite;
  }
  /* FASE 6B -- dezelfde veeg, maar op transform in plaats van op left.

     Hij liep van left:-60% naar left:130%: 190% van de kaartbreedte, en left is
     een opmaakwaarde, dus de browser rekende de opmaak van die kaart bij élk
     beeldje opnieuw uit. Met vier klaarliggende trofeeën in beeld werd dat 29 keer
     per seconde een layout op een scherm waar verder niets beweegt -- de kaart
     doet er in dezelfde drie seconden nul. Gemeten met de processor acht keer
     geremd: 123 ms layout per drie seconden. Geen enkel beeldje viel daardoor weg,
     ook niet op 8x -- dit is dus geen haperingsbug maar werk dat nergens voor
     nodig is, en het groeit mee met het aantal trofeeën dat klaarligt.

     De veeg is 45% van de kaart breed, dus die 190% van de kaart is 422,2% van de
     veeg zelf (procenten in translateX gaan over het element zelf). De skew komt
     erachteraan en staat op dezelfde plek in de keten als eerst, dus het beeld is
     pixel voor pixel hetzelfde -- nagemeten op zes standen van de animatie. */
  @keyframes shineSweep {
    0% { transform: translateX(0) skewX(-18deg); }
    55%, 100% { transform: translateX(422.222%) skewX(-18deg); }
  }
  /* ook het medaillon van een klaarliggende perfecte wereld wiebelt: de kaart ziet
     er anders uit, maar "hier ligt iets voor je klaar" moet overal hetzelfde zeggen */
  .trophy-card.ready .temoji, .trophy-card.ready .pw-medal { animation: giftWiggle 2.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes giftWiggle {
    0%, 58%, 100% { transform: rotate(0) translateY(0); }
    66% { transform: rotate(-9deg); } 74% { transform: rotate(8deg); }
    82% { transform: rotate(-5deg) translateY(-2px); } 90% { transform: rotate(3deg); }
  }

  /* (2) Tik-ripple: een lichtkringetje dat vanaf de vingerplek uitdijt */
  .tap-ripple {
    position: fixed; z-index: 93; pointer-events: none; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,150,.85), rgba(255,236,150,0) 70%);
    transform: translate(-50%, -50%) scale(0); animation: tapRipple .5s ease-out forwards;
  }
  @keyframes tapRipple { 0% { transform: translate(-50%,-50%) scale(0); opacity: .9; } 100% { transform: translate(-50%,-50%) scale(9); opacity: 0; } }

  /* (3) Openen: schatkist-moment met stralen, schokgolf en emoji-inslag */
  .tp-stage { position: relative; width: 150px; height: 118px; margin: 6px auto 2px; display: flex; align-items: center; justify-content: center; }
  .tp-chest { position: absolute; z-index: 2; font-size: 74px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); animation: chestShake .5s ease-in-out infinite; }
  @keyframes chestShake { 0%,100% { transform: rotate(-5deg) translateY(0); } 25% { transform: rotate(5deg) translateY(-2px); } 50% { transform: rotate(-4deg); } 75% { transform: rotate(4deg) translateY(-2px); } }
  .tp-emoji { position: relative; z-index: 3; font-size: 66px; line-height: 1.1; filter: drop-shadow(0 0 10px rgba(255,215,64,.85)); opacity: 0; transform: scale(.2); }
  .tp-rays {
    position: absolute; width: 210px; height: 210px; z-index: 1; opacity: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,236,150,.5) 0deg 9deg, transparent 9deg 21deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
  }
  .tp-ring { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 4px solid rgba(255,236,150,.9); z-index: 1; opacity: 0; }
  .trophy-pop .tp-name, .trophy-pop .tp-joepie { opacity: 0; }
  .trophy-pop.burst .tp-chest { animation: chestBurst .4s ease forwards; }
  @keyframes chestBurst { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(1.25) rotate(-4deg); } 100% { transform: scale(1.75); opacity: 0; } }
  /* Onthulling én daarna: het emoji verschijnt met een bounce en blijft dan zacht
     wiegen zolang de trofee 'open' staat (tot je sluit). */
  .trophy-pop.burst .tp-emoji { animation: emojiReveal .55s cubic-bezier(.2,1.5,.4,1) .12s forwards, emojiBob 2.6s ease-in-out .75s infinite; }
  @keyframes emojiReveal { 0% { opacity: 0; transform: scale(.2) rotate(-12deg); } 60% { opacity: 1; transform: scale(1.18) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes emojiBob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05); } }
  /* De lichtstralen blijven traag ronddraaien terwijl de trofee open is. */
  .trophy-pop.burst .tp-rays { animation: raysReveal .5s ease .12s forwards, raysSpin 10s linear .12s infinite; }
  @keyframes raysReveal { 0% { opacity: 0; } 100% { opacity: .5; } }
  @keyframes raysSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .trophy-pop.burst .tp-ring { animation: ringOut .55s ease-out .12s forwards; }
  @keyframes ringOut { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(3.4); } }
  .trophy-pop.burst .tp-name { animation: rankTextRise .45s ease .25s both; }
  .trophy-pop.burst .tp-joepie { animation: rankTextRise .45s ease .38s both; }

  /* Confetti-kanon: stukjes vliegen vanuit één punt naar buiten (met lichte zwaartekracht) */
  .burst-bit { position: fixed; z-index: 92; pointer-events: none; font-size: 24px; will-change: transform, opacity; animation: burstOut .95s cubic-bezier(.15,.6,.3,1) forwards; }
  @keyframes burstOut {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
  }

  /* (4) Net behaald: een eenmalige gouden shimmer over de kaart. Blijft binnen de
     kaart (inset:0 + verschuivende gradient); z-index 2 houdt 'm onder een eventueel
     hoekbadge (het slotje staat op z-index 3). */
  .trophy-card.just-claimed::after {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
    background: linear-gradient(105deg, transparent 38%, rgba(255,236,150,.7) 50%, transparent 62%);
    background-size: 250% 100%; background-position: 120% 0;
    animation: claimShimmer .9s ease-out forwards;
  }
  @keyframes claimShimmer { from { background-position: 120% 0; } to { background-position: -40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .trophy-card.ready, .ready-open { animation: none; }
    .trophy-card.ready::after, .trophy-card.ready .temoji, .trophy-card.ready .pw-medal,
    .trophy-card.just-claimed::after { animation: none; }

    .tp-chest, .tp-rays, .tp-ring, .burst-bit, .tap-ripple { display: none; }
    .trophy-pop .tp-name, .trophy-pop .tp-joepie, .trophy-pop.burst .tp-emoji { opacity: 1; transform: none; animation: none; }
    .rankup-badge, .rankup-label, .rankup-name { animation: none; }
    .rankup-spark { display: none; }
  }
  /* geel/goud stipje op het Trofeeën-tabblad zolang er iets nieuws in de kast ligt —
     zelfde kleurtaal als de rest van de trofee-elementen (banner, ready-kaart) */
  .nav-item { position: relative; }
  .nav-item .nav-dot {
    position: absolute; top: 3px; right: calc(50% - 22px); width: 12px; height: 12px;
    border-radius: 50%; background: var(--gold-accent); border: 2px solid var(--c-white); display: none;
    box-shadow: 0 1px 4px var(--glass-black-40);
  }
  .nav-item.has-new .nav-dot { display: block; }
  @media (max-width: 520px) {
    /* gelijke flexibele zijkolommen: de titel blijft écht in het schermmidden,
       ook nu de linkercel leeg is (met auto|1fr|auto hing hij ~47px naar links) */
    .screen-header { grid-template-columns: 1fr auto 1fr; gap: 8px; }
    .screen-header .header-title { font-size: 20px; overflow: hidden; text-overflow: ellipsis; }
  }

  /* ---- Level einde ---- */
  /* verticaal gecentreerd via veilige auto-marges (knipt nooit af bij overloop) */
  /* Wit glas op 14% was net genoeg om op een vlak verloop te bestaan, maar het
     is geen oppervlak: de gouden pil, de drie vakjes en de juichtekst zweefden
     er meer bovenop dan erin. Nu een echt donker paneel in dezelfde taal als de
     plakkende kop -- dat leest ook straks nog, als er licht achter staat. */
  .result-card {
    background: var(--paneel);
    backdrop-filter: var(--paneel-waas); -webkit-backdrop-filter: var(--paneel-waas);
    border: 1.5px solid var(--paneel-rand);
    box-shadow: var(--e-2), inset 0 1px 0 rgba(255,255,255,.12);
    border-radius: var(--r-lg); padding: 18px 22px 20px; text-align: center;
    width: 100%; max-width: var(--kolom); margin: auto 0;
  }
  /* de titel is hier de kop van een kaart, niet van een scherm: kleiner dan de
     .title elders, zodat de sterren eronder de blikvanger blijven */
  .result-card .title { font-size: clamp(22px, 6vw, 30px); margin: 2px 0 0; }
  /* eigen klasse i.p.v. de vorige losse inline width/height -- net als de andere
     paspop-scènes (.show-stage, en .spiegel in de kleedkamer) nu met eigen
     smalle-scherm-maat, zodat 'm ook op een laag/liggend toestel nooit
     afgesneden wordt */
  .end-stage { width: 150px; height: 168px; margin: 4px auto 0; }
  .end-text { font-size: 18px; }
  .result-stars { font-size: 48px; letter-spacing: 4px; margin: 6px 0 2px; }
  /* korte schermen: het eindscherm moet ook op een 320x568 in één beeld passen --
     het is een vier-seconden-moment, daar hoort geen scrollen bij */
  @media (max-height: 740px) {
    .result-card { padding: 11px 16px 10px; }
    .result-card .title { font-size: clamp(19px, 5.4vw, 24px); }
    .end-stage { width: 104px; height: 116px; }
    .result-stars { font-size: 36px; letter-spacing: 2px; margin: 3px 0 0; }
    .end-text { font-size: 15px; }
    .earn-line { gap: 6px; margin: 7px 0 8px; }
    .earn-chip { font-size: 14px; padding: 7px 4px; }
    .end-milestone { min-height: 30px; margin-bottom: 8px; }
    .milestone-hint { font-size: 13px; padding: 6px 12px; }
    .end-actions { gap: 7px; }
    .end-actions .btn.big { font-size: 20px; padding: 11px 18px; }
    .end-actions .btn.soft { font-size: 15px; padding: 9px 16px; }
    .gold-pill { font-size: 14.5px; padding: 6px 13px; min-height: 30px; }
  }
  .result-stars span { display: inline-block; }
  /* gemiste ster: dof én kleurloos — zelfde taal als op de reiskaart */
  .result-stars .dim { opacity: .25; filter: grayscale(1); }
  /* Opbrengst: altijd dezelfde twee vakjes, altijd in dezelfde volgorde en
     dezelfde breedte -- 💎 verdiend · ⭐ sterren. Het was een rij losse pillen
     die op een telefoon in 1/2/1 afbrak, met wisselend aantal chips, plús een
     rangpil en een trofeebanner erbij: zes gouden/gekleurde dingen onder elkaar
     op precies het scherm dat één ding moet vieren. Een nul tonen mag.
     (Het derde vakje was 👏 publiek, bij de publieksmeter; die is vervallen.) */
  .earn-line { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0 12px; }
  .earn-chip { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 16px; font-weight: 700; line-height: 1;
    background: var(--glass-black-30); border-radius: var(--r-pill); padding: 9px 6px; }
  /* De twee vakjes dragen de twee accenten van de app, elk in zijn eigen rol: het
     blauw van de diamant (de munt) en het goud van de ster (wat je verdiende). */
  .earn-chip.dia { background: rgba(41,182,246,.32); }
  .earn-chip.star { background: rgba(var(--goud-rgb),.26); }
  /* Mijlpaal: precies één regel, en hoogstens één ding. Volgorde van belang:
     nieuwe ster-status > nieuwe trofee > hoe ver nog tot de volgende status.
     De eerste twee zijn een beloning (gouden pil, tikbaar); de derde is een
     vooruitblik en blijft daarom bewust stil (gestippeld, niet pulserend). */
  .end-milestone { margin: 0 0 14px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
  .milestone-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 700;
    color: var(--gold-light); background: var(--goud-tint); border: 1px dashed var(--goud-rand);
    border-radius: var(--r-pill); padding: 8px 15px; }
  .end-actions { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .end-actions .btn { width: 100%; max-width: 320px; }
  .end-actions .btn.big { font-size: 23px; padding: 15px 20px; }

  /* ---- Kleedkamer ----
     Opbouw: vaste kop (titel + 💎 + paspop + tabbladen) blijft plakken bovenaan,
     het rek met spulletjes scrollt eronder door, en de actiebalk (passen/kopen)
     zit vast boven de navigatie. Zo is elke tik meteen zichtbaar op de paspop. */
  /* Ruimte onder het rek voor de twee zwevende balken plus de veilige zone van
     het toestel: de navigatiebalk (--balk-ruimte, veilige zone incl.), daarboven
     de actiebalk (12 lucht + 52 hoog) en daarboven nog lucht, zodat het laatste
     kaartje er echt onderuit te scrollen is en niet net eronder blijft plakken. */
  #screen-dress { padding-bottom: calc(var(--balk-ruimte) + 82px); }
  /* FASE 5B -- de kleedkamer op een breed scherm: de kop krimpt daar mee met de
     kolom. FASE 5D heeft daar één gedeelde regel van gemaakt voor álle
     gebruiksschermen (.screen.gebruik, zie het skelet bovenaan); hier stond hij
     als enige, en de kast en het ouderdeel misten hem. */
  /* De kop was ooit 0-407px van een 844px scherm: titel, paspop, een
     Spullen/Looks-schakelaar én acht categorieën in twee rijen. De schakelaar
     stond daarna naast de paspop, met de dobbelsteen eronder -- een blok van
     342px dat midden in een band van 459px zweefde, met de categorierij eronder
     wél over de volle breedte. Twee uitlijningen boven elkaar, plus een knop
     (verras me) die bij geen van beide groepen hoorde: dat las als scheef.
     Nu is er één keuzerij met alleen de kledingsoorten: twee aparte
     bedieningen voor één vraag was de eigenlijke fout. */
  /* De balk bloedt tot de schermrand door met een negatieve marge ter grootte van
     de schermpadding. Die drie waarden (top, breedte, marge) stonden per scherm
     met de hand uitgerekend: 12 hier, 8 in het spel (dat scherm heeft 8px
     padding), 10 op de kaart. Eén verkeerd bijgewerkt getal en de balk laat een
     streepje achtergrond langs de rand staan. Nu volgt alles uit --rand, en zet
     een scherm dat één waarde om (zie .screen). */
  .hub-sticky {
    position: sticky; top: calc(var(--rand, 12px) * -1); z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    width: calc(100% + var(--rand, 12px) * 2);
    margin: calc(var(--rand, 12px) * -1) calc(var(--rand, 12px) * -1) var(--kop-gap, 12px);
    padding: 12px 12px 10px;
    /* was .92 -- dat is in de praktijk ondoorzichtig, en straks een balk dwars
       door de tekening heen. Op .82 schuift de inhoud er zichtbaar onderdoor. */
    background: var(--kop-plaat);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--glass-white-14);
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    box-shadow: var(--e-2);
  }
  .hub-sticky .screen-header { margin-bottom: 4px; }
  /* FASE 5B.1 -- de kleedkamer heeft de meeste kop van alle rustpunten (titel,
     spiegel én categorierij) en daarmee het minste rek. Deze vier regels halen er
     samen ~14px af zonder dat er iets kleiner wordt dat een vinger moet raken:
     de terugknop blijft 44px, de categorieknoppen blijven 44px. */
  #screen-dress .hub-sticky {
    padding-top: 9px; padding-bottom: 8px;
    /* het licht boven de spiegel, in het vlak waar de spiegel in staat. Zelfde
       grondkleur als elke andere plakkende kop; alleen een warme kegel erbij. */
    background:
      radial-gradient(78% 86% at 50% 0%, rgba(255,216,158,.16), transparent 70%),
      var(--kop-plaat);
  }
  #screen-dress .hub-sticky .screen-header { margin-bottom: 3px; }
  /* ---- De kop van een hulpscherm ------------------------------------------
     Dezelfde plakkende kop, maar dan voor een scherm dat geen spel is: nieuwe
     ster nu, en straks net zo goed de kleedkamer, de trofeeën en het ouderdeel.

     Het verschil met de spelkop is bewust klein en helemaal in gewicht: minder
     hoog, minder vlak, een haarlijn in plaats van een balkrand, en een zachtere
     schaduw. Een hulpscherm heeft één taak en één weg terug -- dan hoort de kop
     niet het zwaarste ding op het scherm te zijn. Doordat de schil (.app-sfeer)
     eronder doorloopt, hangen kop en inhoud in dezelfde ruimte in plaats van als
     twee losse blokken op elkaar. */
  .hub-sticky.sub {
    padding: 6px 10px 8px;
    /* Vierkant onderaan, en niet afgerond zoals de spelkop: een afgeronde balk
       bóven een afgeronde witte kaart leest als twee blokken op elkaar. Recht is
       hier een rand waar de inhoud onderdoor schuift. */
    border-radius: 0;
    background: rgba(30,8,56,.74);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--glass-white-14);
    box-shadow: 0 6px 18px rgba(10,2,24,.28);
  }
  .hub-sticky.sub .screen-header { margin-bottom: 0; }
  .hub-sticky.sub .header-title { font-size: 19px; }
  /* De terugknop houdt zijn 44px raakvlak (kinderhand), maar niet zijn lip: een
     knop die indrukbaar lijkt trekt aandacht, en dit is de uitgang en niet de
     bedoeling van het scherm. */
  .hub-sticky.sub .icon-btn {
    font-size: 17px; border-color: var(--glass-white-22);
    background: rgba(255,255,255,.1); box-shadow: none;
  }
  .hub-sticky.sub .icon-btn:active { transform: scale(.94); box-shadow: none; }
  /* de rand-/gloedbehandeling zit nu in de gedeelde .stage-frame (zie .stage
     hierboven) -- hier alleen nog de eigen afmeting van de kleedkamer-scène */
  /* FASE 5B -- de pop is waar dit scherm over gáát ("maak mijn ster mooi"), dus
     haar maat mag niet één vast getal zijn dat op een telefoon net past en op een
     tablet verdrinkt. Ze staat nu op de kleinste van twee maten: een deel van de
     schermhóógte (anders duwt ze het rek uit beeld) en een deel van de bréedte
     (anders wordt ze op een liggende tablet een pilaar). De bovengrens houdt haar
     op een groot scherm nog steeds een pop en geen poster.
       390x844   -> 168 hoog  -- de breedte is hier de grens
       834x1112  -> 236 hoog  -- een tablet geeft de ruimte, dus neem 'm
       1024x768  -> 177 hoog  -- liggend telt de hoogte, niet de breedte
       320x568   -> 119 hoog  -- zie de lage-schermregel hieronder
     FASE 5B.1 heeft die getallen op een telefoon een slag teruggebracht (195 ->
     168). De kop was daar 320 van 844 pixels, en dan is het rek eronder een
     kier. Samen met de krappere lucht in de kop hieronder scheelt dat ~12%: de
     pop blijft het grootste ding op het scherm, maar er past een halve rij
     spulletjes meer onder. Op een tablet verandert er niets -- daar was de
     verhouding al goed.
     De verhouding 1.19 : 1 is die van hiervoor (208 : 175); .show-stage in de zaal
     leunt erop ("zelfde verhouding als de spiegel"), dus die blijft kloppen. */
  #screen-dress { --pop-h: clamp(132px, min(23vh, 43vw), 236px); }
  /* Lage schermen (een kleine telefoon staand, elke telefoon liggend). Daar is de
     kop het probleem en niet het rek: op 320x568 stond hij op 47% van het beeld en
     bleef er anderhalve rij spulletjes over. Alles wat hier staat haalt er samen
     zo'n 30px af -- een kleinere pop, minder lucht om de kop en om de categorierij.
     De raakvlakken blijven: de terugknop en de categorieknoppen houden hun 44px. */
  @media (max-height: 700px) {
    #screen-dress { --pop-h: clamp(112px, 21vh, 146px); }
    #screen-dress .hub-sticky { padding-top: 8px; padding-bottom: 7px; }
    #screen-dress .screen-header { margin-bottom: 2px; }
    #screen-dress .header-title { font-size: 21px; }
    #screen-dress .shop-tabs-wrap { margin-top: 4px; }
    #screen-dress .schat-entry { margin-top: 4px; min-height: 36px; padding: 4px 12px; }
  }
  /* Een telefoon in liggende stand (844x390) is de krapste stand die dit scherm
     kent: na de kop en de navigatiebalk blijft er ~100px over, en dat is minder
     dan één rij kaartjes. De kop kan niet veel verder krimpen -- de terugknop en
     de categorieknoppen houden hun 44px raakvlak -- dus krimpt hier ook het
     kaartje: een miniatuur van 40 in plaats van 52 maakt een rij ~22px lager, en
     dan past er weer een hele rij plus een glimp van de volgende. Alleen hier;
     elders (het wereldfeest leent hetzelfde vakje) blijft 52 staan. */
  @media (max-height: 460px) {
    #screen-dress { --pop-h: clamp(92px, 26vh, 120px); }
    #screen-dress .item-thumb { height: 40px; margin-bottom: 4px; }
    #screen-dress .item-thumb svg { height: 40px; }
    #screen-dress .item-thumb .thumb-emo { font-size: 30px; }
    #screen-dress .item-thumb .thumb-swatch { width: 34px; height: 34px; }
    #screen-dress .schat-raadsel { width: 40px; height: 40px; font-size: 21px; }
    #screen-dress .schat-entry { margin-top: 4px; min-height: 34px; padding: 3px 12px; font-size: 13.5px; }
  }
  /* Smalle telefoon: de naam van het scherm past niet meer tussen twee even brede
     zijkolommen van elk 108px, en werd afgekapt tot "Kleedka…". De drie cellen
     krijgen hier de breedte die ze écht nodig hebben (terugknop 44, teller zoveel
     als het getal vraagt, de naam de rest) en de teller een maat kleiner. De naam
     staat dan een paar pixels uit het optische midden -- ruil ik graag tegen een
     scherm dat zijn eigen naam voluit kan zeggen. */
  @media (max-width: 380px) {
    #screen-dress .screen-header { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
    #screen-dress .diamond-badge { font-size: 18px; padding: 6px 12px; }
  }
  /* ---- De spiegel ---------------------------------------------------------
     Waar de kleedkamer om draait: "hoe ziet mijn ster eruit?". Het was een
     .stage -- dezelfde bouwsteen als de zaal en het eindscherm -- en dat bracht
     twee dingen mee die hier niets te zoeken hebben: het decor van het podium
     dat dit kind ooit kocht (applyStage zette de achtergrond én drie emoji in de
     hoeken) en de drie draaiende schijnwerpervlekken van .stage::after. Podia
     zijn sinds fase 1 uit de kleedkamer; dan hoort hun versiering hier ook niet
     meer te staan.

     Wat ervoor in de plaats komt is een spiegel, en die is met drie dingen
     gemaakt en niet met een plaatje:
       1. de boog       -- de bovenhoeken lopen rond, de onderkant niet. Dat is
                           de vorm van een passpiegel, en meer heeft een kind niet
                           nodig om te zien wat dit is.
       2. het licht     -- warm van bovenaf (de lampen boven een kaptafel) en een
                           warme plas waar ze staat. Die plas is er niet voor de
                           sfeer maar voor de leesbaarheid: zonder dat licht
                           verdwijnt een donkere outfit in het violette glas.
       3. het glas      -- één schuine glans en een donkere onderrand. Genoeg om
                           spiegel te zijn, te weinig om met haar te concurreren.
     Geen animatie: het enige wat hier hoort te bewegen is zij. */
  .spiegel {
    position: relative; flex-shrink: 0; overflow: hidden; cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    height: var(--pop-h); width: calc(var(--pop-h) * 1.19);
    border: 2px solid rgba(255,255,255,.42);
    border-radius: 50% 50% var(--r-lg) var(--r-lg) / 30% 30% var(--r-lg) var(--r-lg);
    /* Van onder naar boven gelezen: het glas is lichter dan de kamer eromheen
       (anders is een spiegel een gat), er valt licht van de lampen bovenin, er
       staat een zachte lichtkolom achter haar zodat ook een donkere outfit leest,
       en er ligt een warme plas op de grond waar ze staat. */
    background:
      radial-gradient(56% 34% at 50% 99%, rgba(255,216,168,.62), transparent 72%),
      radial-gradient(44% 56% at 50% 58%, rgba(244,232,255,.3), transparent 70%),
      radial-gradient(82% 44% at 50% 2%, rgba(255,238,210,.3), transparent 66%),
      linear-gradient(168deg, #6a3eb2 0%, #4d2884 50%, #3a1d69 100%);
    box-shadow: var(--e-2), 0 0 26px rgba(150,86,255,.34),
                inset 0 2px 14px rgba(255,228,186,.26), inset 0 1px 0 rgba(255,255,255,.34);
    transition: transform .14s;
  }
  .spiegel:active { transform: scale(.98); }
  /* dezelfde afspraak als bij .stage: de pop schaalt mee met de hoogte van haar
     kader, zodat ze op geen enkel scherm afgesneden kan raken */
  .spiegel .avatar-holder { height: 92%; }
  .spiegel .avatar-holder svg { height: 100%; width: auto; display: block; }
  .spiegel::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(116deg, rgba(255,255,255,.18) 0 9%, rgba(255,255,255,.06) 17%, transparent 32%);
  }
  /* 🎲 verras me: trekt een willekeurige outfit uit wat ze al bezit. Hoort bij
     háár, dus staat hij als merkje op de rand van het podiumkader. Eén rand, geen
     extra ringen: dát was de klacht, niet de plek. (Op de sterrenkeuze stond
     hetzelfde patroon voor een ▶-merkje; dáár is het weg, want dáár beloofde het
     hetzelfde als de tegel eronder. Hier doet het knopje iets eigens.) */
  .stage-wrap { position: relative; display: flex; justify-content: center; }
  /* FASE 5B.1 -- kleiner, kalmer, en echt aan de spiegel vast. Het was een paarse
     knop van 42px met een dikke witte ring die half over de hoek van het kader
     hing: dezelfde ring als de spiegel zelf, dus twee even harde randen die
     elkaar overlapten, en zwaar genoeg om als hoofdknop te lezen. Nu is het een
     merkje van hetzelfde glas als de balken onderaan, dat tegen de onderrand van
     de spiegel aan zit. Nog steeds 38px, dus nog steeds met een kindervinger te
     raken, maar het zegt "ook leuk" en niet "begin hier". */
  .shuffle-btn {
    position: absolute; right: -12px; bottom: 6px; width: 38px; height: 38px;
    border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    font-size: 18px; line-height: 1; font-family: inherit; border: 0;
    background: rgba(38,12,70,.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(8,1,20,.42), inset 0 0 0 1.5px rgba(255,255,255,.26);
    transition: transform .15s, box-shadow .15s;
  }
  .shuffle-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(8,1,20,.5), inset 0 0 0 1.5px rgba(255,255,255,.4); }
  .shuffle-btn:active { transform: scale(.92); }
  /* Eén scrollende rij met alleen iconen -- alleen de categorie die aanstaat zet
     er zijn woord bij. Het was een vaste 4x2-grid waarin de helft van de labels
     werd afgekapt ("Schoe…", "Microf…", "Acces…"): een emoji plus een half woord
     is slechter dan één van de twee. Twee rijen worden zo één rij, en het woord
     staat er nog steeds -- alleen bij de categorie waar je nú in kijkt. */
  .shop-tabs-wrap { width: 100%; max-width: var(--kolom); margin-top: 5px; }
  /* padding-inline 12 en niet 4: aan het begin en het eind van de rij hoort lucht
     te staan. Zonder die lucht lag de eerste knop tegen de schermrand en las een
     half weggeschoven knop als een fout in plaats van als "er staat hier meer".
     scroll-padding-inline zet dezelfde lucht neer als de rij zichzélf verschuift
     (scrollIntoView bij een categoriewissel), zodat de gekozen knop nooit tegen
     de rand aan landt. */
  .shop-tabs {
    display: flex; gap: 6px; padding: 1px 12px; overflow-x: auto;
    /* 36 en niet 12: de rij draagt een fade-masker van 34px aan de kant waar nog
       meer staat (zie .hscroll-fade). Met minder marge landt de gekozen knop
       precies ónder die fade en staat juist het woord dat je net koos half
       vervaagd -- de enige knop die volledig leesbaar hoort te zijn. */
    scroll-padding-inline: 36px;
    scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth;
  }
  .shop-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    font-family: inherit; font-size: 15px; font-weight: 700; border: none; cursor: pointer;
    padding: 0 12px; border-radius: var(--r-pill); color: var(--c-white); background: var(--glass-white-18);
    transition: transform .07s, background .12s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; min-width: 46px; flex: none;
  }
  .tab-btn .tab-ico { font-size: 21px; line-height: 1; filter: var(--emoji-schaduw); }
  .tab-label { white-space: nowrap; }
  .tab-btn:active { transform: scale(.95); }
  /* FASE 5B.1 -- hetzelfde cyaan als hiervoor, maar als licht in plaats van als
     vlak. Het was een dekkende cyaan pil met donkere letter: samen met het woord
     erbij werd dat het felste ding op het scherm, feller dan de pop en feller dan
     het spulletje dat ze aanheeft -- terwijl "in welke la kijk ik" de minst
     belangrijke van die drie is. Dit is letterlijk het materiaal van .nav-item
     .active onderaan (doorschijnend cyaan + een ring), dus de categorierij bovenin
     en de tabbalk onderin zeggen "hier sta je" nu op precies dezelfde manier. */
  .tab-btn.active {
    background: var(--nav-sel); color: var(--c-white);
    box-shadow: inset 0 0 0 2px var(--nav-sel-ring);
    text-shadow: var(--nav-ink);
  }
  /* flex i.p.v. grid: bij een oneven aantal spulletjes bleef het laatste kaartje
     in een CSS-grid altijd in de eerste kolom hangen (grid deelt élke rij
     dezelfde kolomposities toe), dus links uitgelijnd met een lege plek ernaast
     in plaats van gecentreerd. flex-wrap + justify-content:center centreert
     élke rij apart, vol of niet -- ook de laatste, hoe je ook telt. */
  /* FASE 5B -- hoe breed een kaartje minimaal is, en dus hoeveel er op een rij
     passen. Stond op 130: op een telefoon van 390 zijn dat twee kolommen, en de
     accessoires (17 stuks) werden daarmee negen rijen scrollen om te zien wat je
     hébt. Op 104 staan er drie naast elkaar van elk ~115px -- nog altijd ruim
     boven een kindervingertop (44px) en anderhalf keer zoveel spulletjes in
     beeld. Op een tablet mogen ze een maat groter, zodat een kaartje daar niet
     ineens half zo groot oogt als op een telefoon (128 tegen 115). */
  .item-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: var(--kolom); --kaart-min: 104px; }
  @media (min-width: 560px) { .item-grid { --kaart-min: 118px; } }
  /* FASE 5B.1 -- het kaartje is een plankje en geen doos. De rand stond op 2px
     .35 wit: bij drie kolommen zijn dat zeventien even harde omlijningen onder
     elkaar, en dan is het raster het onderwerp in plaats van de spulletjes erin.
     De rand blijft 2px breed (de staten hieronder kleuren hem, en dan mag de
     opmaak niet verspringen) maar is in rust bijna weg; wat het kaartje van de
     achtergrond losmaakt is nu het vlak zelf plus een haarlijn licht bovenin.
     Daardoor kan goud ("dit draag je") echt het hardst spreken. */
  /* FASE 5E -- de drie waarden hieronder zijn nu de gedeelde --vlak*-familie: exact
     hetzelfde plankje als de trofeekaart in de kast. Zie het vlakkenblok in :root. */
  .item-card {
    position: relative; flex: 1 1 var(--kaart-min); max-width: calc(var(--kaart-min) * 1.7);
    background: var(--vlak); border: 2px solid var(--vlak-rand);
    border-radius: var(--r-md); padding: 9px 6px 10px; text-align: center; cursor: pointer;
    box-shadow: var(--vlak-top);
    transition: transform .07s, background .12s, border-color .12s, box-shadow .12s;
  }
  .item-card:hover { background: var(--vlak-hover); }
  .item-card:active { transform: scale(.97); }
  /* Kaart-staten: blauw = "hier kijk je naar", goud = "dit staat aan". De blauwe
     variant had ook nog een 3px ring én een schaalsprong; dat was een vierde
     signaal in een raster dat er al drie heeft, terwijl de paspop erboven de
     preview al veel duidelijker laat zien. Alleen de rand blijft. */
  /* Twee staten, en ze mogen niet even hard schreeuwen. "Hier kijk ik naar" is
     een moment (het duurt tot de volgende tik); "dit draag ik" is een antwoord op
     de vraag waar het kind voor kwam. Cyaan is daarom een rand plus een tint,
     goud is een rand plus een tint plus een gloed. */
  .item-card.selected { background: var(--cyaan-tint); border-color: var(--cyaan-rand); }
  .item-card.equipped {
    border-color: var(--gold-accent); background: var(--goud-tint);
    box-shadow: var(--goud-gloed), inset 0 1px 0 rgba(255,241,190,.3);
  }
  .item-card.selected.equipped { border-color: var(--gold-accent); box-shadow: var(--goud-gloed); }
  /* .owned and .selected are two plain (non-combined) classes with identical
     specificity, both setting background/border-color -- .owned happened to
     be declared later in the file, so it silently won that tie and previewing
     an owned item showed a half-gray, half-blue card (gray body, blue ring
     only, since .owned doesn't touch box-shadow/transform). Ownership is
     already communicated by the status badge below, so the card itself
     should just show the same full "you're looking at this" blue as any
     other selected item -- this combined selector's higher specificity wins
     outright, no reliance on rule order. */
  .item-card.owned.selected { background: var(--cyaan-tint); border-color: var(--cyaan-rand); }
  /* zelfde tie als hierboven, maar dan voor :hover -- .owned/.equipped/.selected
     zetten allemaal hun eigen achtergrond, met dezelfde specificiteit als de
     kale .item-card:hover regel. Die verliest dus stilzwijgend de tie (bron-
     volgorde), en een owned/equipped/selected kaartje reageerde daardoor
     helemaal niet op hover terwijl een niet-bezeten kaartje wél oplichtte.
     Hier expliciet per staat een eigen, iets lichtere hover-tint (in de eigen
     kleur van die staat) zodat ieder kaartje evengoed op hover reageert. */
  .item-card.owned:hover { background: rgba(255,255,255,.22); }
  .item-card.equipped:hover { background: rgba(var(--goud-rgb),.24); }
  .item-card.selected:hover, .item-card.owned.selected:hover { background: rgba(56,189,248,.3); }
  .item-card.selected.equipped:hover { background: rgba(var(--goud-rgb),.24); }
  .item-card.just-bought { animation: boughtPop .85s ease; }
  @keyframes boughtPop { 0% { transform: scale(1); } 35% { transform: scale(1.08); box-shadow: 0 0 22px rgba(255,215,64,.75); } 100% { transform: scale(1); } }
  /* Eén miniatuur-zone voor álle spullen. Er waren er drie: een getekende jurk
     zweefde vrij op een basislijn, een emoji hing eronder zonder schaduw, en een
     podium was een wit omrand bolletje van 46px. Dezelfde soort dingen zagen er
     dus per categorie anders uit. Nu staat alles in hetzelfde vak van 52px, op
     dezelfde optische hoogte en met dezelfde slagschaduw; wat verschilt is nog
     alleen waar de tekening vandaan komt (getekend of emoji). */
  .item-thumb { height: 52px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
  /* Hoogte vast, breedte vrij -- maar nooit breder dan het vakje zelf. Een
     tekening die wel breder is (de bladerkrans) krimpt dan netjes mee i.p.v.
     buiten haar kaartje te vallen: een viewBox schaalt vanzelf naar wat er
     overblijft, en houdt daarbij zijn verhoudingen. */
  .item-thumb svg { height: 52px; width: auto; max-width: 100%; display: block; filter: var(--emoji-schaduw); }
  /* 38 en niet 34: de zes wereldbeloningen zijn getékend en vullen hun vak van 52px
     helemaal, een emoji op 34 liet er een derde leeg. Naast elkaar in dezelfde rij
     las dat als "het verdiende spulletje is groter dan het gekochte" -- en juist
     dát verschil hoort er niet te zijn (koop en beloning zijn even leuk, alleen
     anders te krijgen). Op 38 wegen ze optisch even zwaar. */
  .item-thumb .thumb-emo { font-size: 38px; line-height: 1; filter: var(--emoji-schaduw); }
  /* een podium is een plek, geen voorwerp: zijn kleur ís het item, dus een klein
     decorvlak met het herkenningsicoon erop -- in hetzelfde vak, zelfde schaduw */
  .item-thumb .thumb-stage {
    width: 46px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center;
    font-size: 22px; border: 1.5px solid rgba(255,255,255,.5);
    filter: var(--emoji-schaduw); text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .item-thumb .thumb-swatch { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); }
  .item-name { font-size: 13.5px; font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
  /* Eén pilletje per kaartje, en dus één staat. Ze kunnen niet stapelen: de JS
     kiest er precies één (zie dressCardState). Van hard naar zacht:
       new    net gekocht -- goud, pulseert twee tellen
       on     draag je nu -- goud, vol
       owned  van jou     -- helder wit, want "dit kun je aandoen" is een
              uitnodiging en geen grijs gebied (stond op grijs en las als "uit")
       slot   nog te verdienen bij een wereld -- rustig goud, met het wereldteken
       price  te koop en je hebt genoeg -- goud
       need   te koop maar nog niet genoeg -- stil, geen goud, geen alarm */
  .item-status {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 21px; margin-top: 5px; padding: 3px 9px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap;
    background: var(--glass-black-24); color: var(--muted-text-2);
  }
  .item-status.price { color: var(--gold-light); background: rgba(var(--goud-rgb),.14); }
  /* "Nog niet genoeg" is een stand en geen fout: de pil verliest zijn goud (dat
     betekent hier "dit kan") en houdt verder alles -- zelfde maat, zelfde plek,
     zelfde leesbare letter. Geen rood, geen kruisje, geen slotje: het getal
     ernaast is al het hele verhaal, en de balk onderaan zegt hoeveel er nog bij
     moet zodra je erop tikt. */
  .item-status.need { color: var(--muted-text-2); background: var(--glass-black-30); }
  .item-status.owned { color: var(--purple-shadow); background: rgba(255,255,255,.82); }
  .item-status.on { color: var(--ink-on-gold); background: var(--gold-accent); }
  .item-status.new { color: var(--ink-on-gold); background: var(--gold-accent); animation: readyPulse 1.4s ease-in-out 2; }
  /* FASE 4D.1 -- nog te verdienen bij een wereld. Bewust dezelfde rustige taal als
     "te weinig diamanten" en niet iets prikkelends: het is een doel om naartoe te
     spelen, geen aanbieding. Het wereld-icoon ernaast zegt bij wélke wereld. */
  .item-status.slot { color: var(--gold-light); background: rgba(255,179,0,.13); opacity: .9; }

  /* Bezit staat óók op het kaartje zelf, want het pilletje is klein en een kind
     van vijf leest hem niet. Dit was grijs ("uitgeschakeld"-taal voor precies de
     spullen die je wél mag aandoen); nu is het gewoon een tikje helderder dan een
     kaartje dat nog niet van jou is. Goud blijft voor "dit draag je nu". */
  .item-card.owned { border-color: rgba(255,255,255,.34); background: rgba(255,255,255,.16); }
  /* Een wereldbeloning die nog niet van jou is. Dit was een streepjesrand, en die
     zegt in elke app die een kind ooit ziet hetzelfde: hier hoort iets te staan en
     het is er niet (een lege plek, een kapot kaartje). Precies het tegenovergestelde
     van wat bedoeld was. Nu is het een gesloten kaartje met warm licht erin -- iets
     goudens achter glas, dat je nog niet kunt pakken. Sinds fase 6E staat zo'n
     kaartje alleen nog in het schattenvak, en wat erin staat is niet het spulletje
     maar het raadsel (.schat-raadsel): de tekening hoeft dus niet meer gedempt te
     worden om zich van "van jou" te onderscheiden -- er stáát geen tekening. */
  .item-card.teverdienen {
    border-color: rgba(255,203,110,.32);
    background:
      radial-gradient(74% 56% at 50% 26%, rgba(255,196,94,.18), transparent 72%),
      var(--goud-tint-zacht);
  }
  .item-card.teverdienen:hover {
    background:
      radial-gradient(74% 56% at 50% 26%, rgba(255,196,94,.26), transparent 72%),
      rgba(var(--goud-rgb),.13);
  }
  /* Aangetikt blijft aangetikt, ook bij een beloning: de streepjesrand houdt zijn
     vorm ("hier hoort nog iets te komen") maar krijgt het blauw van "hier kijk je
     naar". Dit staat er expliciet omdat .teverdienen ná .selected komt en anders
     stilzwijgend die gelijkspel wint -- dezelfde val als bij .owned hierboven. */
  .item-card.teverdienen.selected,
  .item-card.teverdienen.selected:hover { border-color: var(--cyaan-rand); background: rgba(56,189,248,.15); }
  /* Waar een spulletje vandaan komt, als het eenmaal van je is: één wereldteken in
     de hoek en verder niets. Geen "beloning"-label over de tekening heen -- zodra
     je het hebt is het gewoon een van je spullen, met een herkomst. */
  .item-card .item-wereld {
    position: absolute; top: 4px; right: 4px; font-size: 12px; line-height: 1;
    padding: 3px 5px; border-radius: var(--r-pill); background: var(--glass-black-30);
    box-shadow: inset 0 0 0 1px rgba(255,214,90,.34);
  }

  /* ===== Wereldschatten (fase 6E) =====
     Eén regel onder de categorierij, en één vak erachter. Wat het moet doen is
     klein: laten zien dát er zoiets bestaat, laten zien hoever je bent, en er in
     één tik heen. Wat het níet moet doen is een tweede winkel worden -- dus geen
     eigen kop, geen eigen scherm, geen eigen navigatielaag. Het rek eronder is
     letterlijk hetzelfde rek (.item-grid met .item-card), alleen met andere
     kaartjes erin. */
  .schat-entry {
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px;
    width: calc(100% - 24px); max-width: calc(var(--kolom) - 24px); margin: 6px auto 0;
    min-height: 40px; padding: 6px 14px; cursor: pointer;
    border: 1.5px solid rgba(255,203,110,.34); border-radius: var(--r-pill);
    font-size: 14.5px; font-weight: 700; color: var(--gold-light);
    background:
      radial-gradient(72% 130% at 50% 0%, rgba(255,196,94,.16), transparent 74%),
      var(--glass-black-24);
    transition: transform .07s, background .12s, border-color .12s, box-shadow .12s;
  }
  .schat-entry:active { transform: scale(.98); }
  .schat-entry .se-ico { font-size: 17px; line-height: 1; filter: var(--emoji-schaduw); }
  .schat-entry .se-naam { white-space: nowrap; }
  /* De teller is het antwoord op "hoever ben ik": wit en iets zwaarder dan het
     woord ervoor, want dát getal is wat een kind twee keer per week komt kijken. */
  .schat-entry .se-telling { color: var(--c-white); opacity: .9; font-weight: 700; white-space: nowrap; }
  .schat-entry .se-telling b { color: var(--gold-accent); }
  /* Open: hetzelfde "hier sta je" als de actieve categorieknop, maar dan in goud --
     want dit vak gaat over wat je verdient en niet over wat je koopt. */
  .schat-entry.open {
    border-color: var(--gold-accent); color: var(--c-white);
    background: var(--goud-tint);
    box-shadow: var(--goud-gloed);
  }
  /* Een schat die nog niet van jou is: het medaillon van zijn wereld met een
     vraagteken erin. Dezelfde vorm en dezelfde wereldkleuren als de perfecte-
     wereldkaart in de kast (.pw-medal), zodat "dit hoort bij die wereld" er zonder
     één woord op staat -- en zodat een zevende wereld zijn raadsel meekrijgt uit
     zijn eigen theme, zonder dat hier iets bij hoeft. */
  .schat-raadsel {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    font-size: 26px; font-weight: 700; line-height: 1;
    color: rgba(255,238,190,.86); text-shadow: 0 1px 3px rgba(0,0,0,.5);
    background:
      radial-gradient(76% 76% at 50% 22%, var(--pw-glow, #7a2f63), transparent 74%),
      linear-gradient(180deg, var(--pw-sky, #3a1f6e), rgba(0,0,0,.42));
    border: 2px solid rgba(255,214,90,.42);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 3px 10px rgba(0,0,0,.3);
  }
  /* Verdiend. Hetzelfde plankje als elk ander kaartje, met een warme ondergrond
     eronder: genoeg om te zien dat dit er een van de verzameling is, te weinig om
     met "dit draag je nu" (goud, vol) te gaan wedijveren. */
  .item-card.schat-kaart.owned {
    border-color: rgba(255,214,90,.42);
    background:
      radial-gradient(74% 56% at 50% 22%, rgba(255,196,94,.14), transparent 72%),
      rgba(255,255,255,.16);
  }
  /* De Aandoen-knop op het wereldfeest: de enige knop op die laag, dus hij mag de
     gouden zijn -- maar niet groter dan de regel erboven waar hij bij hoort. */
  .wereld-feest .wf-aan {
    margin-top: 11px; padding: 9px 20px; font-size: 16px;
    background: var(--gold-accent); color: var(--ink-on-gold); border: 0;
    box-shadow: var(--goud-gloed);
  }
  .wereld-feest .wf-aan + .wf-verder { margin-top: 7px; }
  /* De actiebalk: naam + prijs + dé knop, altijd in beeld boven de navigatie.
     FASE 5B.1 -- hij hoort bij die navigatie en was van ander materiaal gemaakt:
     dekkender, minder waas, een échte rand in plaats van een ring, een andere
     schaduw. Twee zwevende balken van 8px uit elkaar die duidelijk niet uit
     hetzelfde blad geknipt zijn. Nu deelt hij alles met .main-nav (--nav-blur,
     --nav-ring, --nav-shadow, --nav-ink, dezelfde ronding en dezelfde breedte) en
     is alleen de vulling een slag dekkender -- dit vlak draagt letters over een
     scrollend rek, dat van de navigatie staat boven een rustige onderrand.
     Hij staat precies 12px boven de navigatiebalk -- geen los uitgerekend getal
     meer, maar de balk zelf (--balk-rand + --balk-h) plus die 12, veilige zone
     incl. Op een toestel zonder streepje is dat dezelfde 88 als hiervoor. */
  .dress-bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--balk-rand) + var(--balk-h) + 12px + var(--veilig-onder)); z-index: 39;
    display: none; align-items: center; gap: 10px; width: var(--balk-w); min-height: 52px;
    background: rgba(28, 6, 52, .82);
    backdrop-filter: blur(var(--nav-blur)) saturate(1.25);
    -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(1.25);
    border: 0; border-radius: var(--r-lg);
    padding: 10px 14px;
    box-shadow: var(--nav-shadow), inset 0 0 0 1px var(--nav-ring);
    text-shadow: var(--nav-ink);
  }
