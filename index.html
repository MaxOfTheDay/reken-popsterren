  /* Op de kaart heeft de kop géén eigen vlak: de tekening loopt er ongebroken
     onderdoor. Elke pixel balk is een pixel wereld die een kind niet ziet, en een
     dekkende band dwars over een geschilderde lucht is het duidelijkste teken dat
     je naar een app kijkt en niet naar een plek.

     De leesbaarheid komt nu van de drie groepjes zelf: elk draagt zijn eigen kleine
     pil met een beetje waas erachter. Dat is samen zo'n derde van de breedte in
     plaats van alles. */
  #screen-map .hub-sticky { width: 100%; margin-left: 0; margin-right: 0;
    background: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    border-bottom: 0; border-radius: 0; box-shadow: none; padding-bottom: 0; }
  #screen-map .screen-header { margin-bottom: 0; }
  /* Staat de ster op een halte zó hoog dat ze tegen de kop aan komt, dan stapt de
     kop opzij. Zij is op dat moment het onderwerp -- de wereldnaam en het aantal
     diamanten zijn dat niet, en ze weet allebei al.

     Dimmen en niet wegschuiven, en ook niet haar ervóór zetten: de drie koptekens
     blijven staan waar ze stonden en blijven aanraakbaar (opacity raakt het
     raakvlak niet), dus de ladder en de kleedkamer zijn ook vanaf de bovenste halte
     gewoon te bereiken. Op .18 is de pil nog een vindbare vorm en is zij er dwars
     doorheen te zien.

     Het scheelt 9 procentpunt bovenaan de veilige zone; zie ZONE. */
  #screen-map .screen-header { transition: opacity .3s ease; }
  #screen-map.ster-bij-kop .screen-header { opacity: .18; }
  @media (prefers-reduced-motion: reduce) {
    #screen-map .screen-header { transition: none; }
  }
  /* Drie dingen, drie gewichten. Het portretje draagt géén pil: het is al een
     rondje met een rand, en een rondje in een pil is een rondje in een rondje.
     De naam eronder is weg -- wie er speelt zie je aan haar gezicht, en zij is de
     enige die op dit toestel speelt. De wereldnaam en de diamanten houden wel een
     pil, want die dragen tekst die over elke tekening leesbaar moet blijven. */
  #screen-map .map-id-btn {
    padding: 4px;   /* onzichtbaar, maar maakt het raakvlak 48px */
    background: none; backdrop-filter: none; box-shadow: none;
  }
  /* Het portretje krijgt een ring van hetzelfde materiaal als de pillen -- geen pil
     eromheen, maar wel dezelfde stof. Daarmee horen de drie zones bij elkaar zonder
     dat links een blok tekst terugkomt. Iets groter (42px) zodat het gewicht van de
     linkerzone klopt tegen de twee pillen. */
  #screen-map .map-portrait {
    width: 42px; height: 42px; border: 2px solid rgba(255,255,255,.78);
    box-shadow: 0 2px 8px rgba(10,2,24,.45), 0 0 0 4px var(--hud-bg);
  }
  /* de twee pillen zijn letterlijk dezelfde regel: zelfde hoogte, zelfde vulling,
     zelfde randje, zelfde schaduw -- alleen de inhoud verschilt */
  #screen-map .world-pick, #screen-map .diamond-badge {
    height: var(--hud-h); padding: 0 11px; border-radius: var(--r-pill);
    background: var(--hud-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--hud-shadow), inset 0 0 0 1px var(--hud-ring);
    text-shadow: var(--hud-ink);
  }
  /* Op de kaart een maat kleiner dan op de andere schermen: de tekening eronder
     draagt het scherm, niet de tekst. De wereldpil stond op 19px en woog daarmee
     duidelijk zwaarder dan de twee ernaast; 17,5 tegen 17 zet ze op gelijke voet. */
  #screen-map .world-pick { font-size: 17.5px; gap: 5px; position: relative; }
  /* FASE 7A -- de pil is de ingang naar de hele tournee, en hij was 34px hoog: dat
     leest goed maar het is geen kindervinger. Het portretje ernaast lost dat al zo
     op (4px onzichtbare padding, raakvlak 48px), alleen kan dat hier niet: deze pil
     heeft een vaste hoogte, en padding zou die opeten in plaats van hem te
     vergroten. Dus een onzichtbaar vlakje eroverheen.

     Alleen naar bóven en onder. -8px maakt het raakvlak 50px -- precies de hoogte
     van de koprij zelf, dus hij blijft binnen de kop en pakt geen enkele tik van de
     kaart af (de haltes staan per ZONE onder de kop). Naar de zijkanten juist niet:
     op 320px staat de wereldnaam al bijna tegen de diamantpil aan, en daar zou een
     vlakje tikken van die pil afpakken. De pil zelf ziet er geen pixel anders uit.

     overflow: visible hoort erbij. Onder de 520px zet de gedeelde kopregel
     .header-title op overflow: hidden met een ellips -- bedoeld voor de kóppen van
     de andere schermen, die tekst zijn en af mogen knippen. Deze kop is een knop,
     de wereldnaam knipt hier sowieso niet meer af (de kolommen eromheen krimpen,
     zie de mediaregel hieronder) en die ellips werkt op een inline-flex-knop toch
     niet. Wat hij wél deed: het vlakje wegknippen, zodat hetzelfde knopje op een
     telefoon 33px hoog aanraakbaar was en op een tablet 49px. */
  #screen-map .world-pick { overflow: visible; }
  #screen-map .world-pick::before { content: ''; position: absolute; inset: -8px 0; }
  #screen-map .wp-route { width: 13px; height: 13px; }
  #screen-map .diamond-badge { font-size: 17px; gap: 5px; }
  /* Gelijke buitenkolommen, zodat de wereldnaam écht in het midden staat, en overal
     dezelfde tussenruimte. 80px is wat de diamantpil nodig heeft. */
  #screen-map .screen-header { grid-template-columns: minmax(80px, 1fr) auto minmax(80px, 1fr);
    gap: 10px; align-items: center; }
  /* Onder de 390 past de wereldnaam niet meer tussen die twee kolommen. Opgemeten:
     "Piratenwereld" is 177px breed en de middenkolom is (breedte - 204); op 375 is
     dat 171, op 360 nog 156 en op 320 maar 116. Er stond geen ellips (die werkt niet
     op een inline-flex-knop), dus het werd een harde snee: "Junglewer". En dat op
     het hoofdscherm, waar de naam het enige woord is dat er staat.

     Gelijke kolommen blijven -- de naam hoort écht in het midden. Wat kleiner wordt
     is alles eromheen: de ondergrens van de zijkolommen, de tussenruimte, de
     diamantpil en de naam zelf. Nagemeten op 320, 360, 375, 390, 412 en 768: geen
     enkele wereldnaam wordt nog afgeknipt, en vanaf 390 verandert er niets. */
  @media (max-width: 389px) {
    #screen-map .screen-header { grid-template-columns: minmax(52px, 1fr) auto minmax(52px, 1fr); gap: 8px; }
    /* alleen padding-inline, want de twee pillen delen hun hóógte en hun vulling
       (zie de regel hierboven) -- dat blijft één regel, ook hier */
    #screen-map .world-pick { font-size: 16px; gap: 4px; padding-inline: 6px; }
    #screen-map .wp-route { width: 11px; height: 11px; }
    #screen-map .diamond-badge { font-size: 15px; gap: 4px; padding-inline: 9px; }
  }
  /* 10 links, 14 rechts: het portretje draagt zelf 4px onzichtbare padding voor
     zijn raakvlak, dus met gelijke waarden stond het optisch 4px verder naar
     binnen dan de diamantpil. Zo liggen de zichtbare randen op dezelfde lijn. */
  #screen-map .hub-sticky { padding-left: 10px; padding-right: 14px; }
  /* Hier stond: @media (max-height: 620px) { .tour-map { padding-bottom: 48px } }.
     De redenering was dat de navigatiebalk op een laag scherm een grotere hap uit
     het beeld neemt (82 van 568 = 14%) dan de veilige zone onderaan de tekening
     overhoudt, en dat de onderste halte er dus onderuit geschoven moest kunnen
     worden. Nagemeten klopt die aanname niet: op 320x568 -- het kortste scherm dat
     er is -- staat de onderste halte van élke wereld al 23px bóven de balk zónder
     te schuiven, en op elk ander laag scherm is het kader sowieso hoger dan het
     venster en valt er al te schuiven.

     Wat de regel wél deed: 48px lege ruimte in het scrollvak zetten, ónder het
     kader. Schoof je naar beneden, dan schoof de wereld die 48px het beeld uit en
     stond daar de achtergrond van de app -- een egale roze-paarse band onderaan,
     met een kaarsrechte rand waar de tekening ophield. Opgemeten op 320x568: een
     sprong van 97 (RGB-som) op y=520, in élke wereld dezelfde kleur eronder, want
     die kleur was <body> en niet de wereld.

     Dus weg ermee. De afspraak die overblijft is er één en hij geldt overal:
     .world-frame is nooit lager dan het scrollvak (min-height: 100%) en er staat
     niets ónder het kader, dus op élke schuifstand is elke pixel van het scherm
     wereld. Zie de controle "de wereldtekening dekt het scherm" in
     test/profiles.test.js. */

  /* Het portretje is de link terug naar de spelerskeuze (de kleedkamer zit al in
     de ondernavigatie). Er stond haar naam naast; die is weg. Wie er speelt zie je
     aan haar gezicht, zij is de enige die op dit toestel speelt, en het scheelde de
     zwaarste van de drie koptekens -- de tekening mag het scherm dragen.

     Krimpt naar zijn inhoud in plaats van de kolom te vullen: met de naam erin was
     stretch nodig zodat een lange naam de gecentreerde titel niet wegduwde, maar
     een rondje in een uitgerekte cel is gewoon een rondje links. */
  #screen-map .header-left { justify-self: start; }
  .map-id-btn {
    display: flex; align-items: center; gap: 9px; min-width: 0;
    border: none; background: none; padding: 0; cursor: pointer; font-family: inherit;
    color: inherit; text-align: left; transition: transform .12s;
  }
  .map-id-btn:hover { transform: scale(1.02); }
  .map-id-btn:active { transform: scale(.96); }
  /* gedeeld rond portretkader: kaartkop (.map-portrait) en de kindkiezer in het
     ouderdeel (.who-portrait, zie daar) tonen allebei hetzelfde echte avatartje */
  .map-portrait, .who-portrait {
    position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; overflow: hidden;
    background: var(--glass-black-30); border: 2px solid rgba(255,255,255,.65);
    box-shadow: var(--e-1);
  }
  .map-portrait svg, .who-portrait svg { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); }

  /* ---- Carrière-ladder (ster-status) ---- */
  .career-overlay {
    position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center;
    background: rgba(20,4,40,.55); animation: popFade .25s ease; cursor: pointer; padding: 16px;
  }
  .career-overlay.closing { animation: popFade .25s ease reverse forwards; pointer-events: none; }
  /* Gedeelde schil voor élk feest-/statuspaneel (ster-status, trofee-onthulling).
     Er waren hiervoor twee losse, bijna identieke regels; alleen de breedte
     verschilt nog, en dat zet de gebruiker zelf via een modifier. */
  /* FASE 5E -- hetzelfde materiaal als de eindkaart (--paneel): diep aubergine glas
     met waas erachter. Het stond op vol --purple-deep (#7b1fa2) met een rand van 3px
     vol goud eromheen, en dat waren twee problemen tegelijk. Het violet was het
     lichtste, felste vlak van de hele app -- naast een wereldkaart en naast de
     eindkaart las het als een paneel uit een andere app. En de gouden rand was goud
     als ómlijsting: precies het gebruik waar §4 van deze fase vanaf wil, want zolang
     een heel paneel goud omrand is, is de gouden pil erin niets bijzonders meer.
     Het goud blijft, maar waar het iets zegt: op de rang waar je nú staat, op het
     doel erboven, op de "NU"-pil. Wat het paneel van het scherm losmaakt is
     voortaan hetzelfde als bij elk ander zwevend vlak: licht langs de bovenrand,
     een fijne ring, en een diepe schaduw eronder. */
  .pop-panel {
    position: relative; cursor: default; text-align: center;
    padding: 20px 18px 16px; border-radius: var(--r-lg);
    border: 1.5px solid var(--paneel-rand);
    background: var(--paneel);
    backdrop-filter: var(--paneel-waas); -webkit-backdrop-filter: var(--paneel-waas);
    box-shadow: var(--e-3), inset 0 1px 0 rgba(255,255,255,.12);
    animation: popIn .4s cubic-bezier(.2,1.3,.4,1);
  }
  .career-panel { width: min(92vw, 420px); max-height: 86vh; overflow-y: auto; }
  .career-close { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--glass-white-13); color: var(--c-white); font-size: 16px; font-weight: 700; }
  .career-title { font-size: 15px; font-weight: 700; color: var(--gold-light); letter-spacing: .04em; text-transform: uppercase; }
  /* Slanke ladder: één doorlopende lijst van laag naar hoog. Verleden gedimd met ✓,
     de huidige rung uitgeklapt met balk, de volgende als goud doel, de rest gedempt.
     Alleen bij 'nu' en 'volgende' staan getallen -- de rest blijft rustig. */
  .career-list { display: flex; flex-direction: column; gap: 5px; text-align: left; margin-top: 6px; }
  .ladder-row { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--glass-white-10); }
  .lr-emoji { font-size: 21px; flex: none; width: 26px; text-align: center; filter: var(--emoji-schaduw); }
  .lr-name { flex: 1; font-weight: 700; color: var(--c-white); font-size: 14.5px; }
  /* Behaald = goud, maar bewust een slag zachter dan .trophy-card.done: een trofee
     is een prijs die blijft staan, een gepasseerde rang is voorgeschiedenis -- hier
     moet 'nu' en 'volgende' de aandacht krijgen. Geen icoon; toekomst blijft kil/vaag. */
  .ladder-row.past { opacity: .85; background: var(--goud-tint-zacht); border-color: var(--goud-rand-zacht); }
  .ladder-row.future { opacity: .36; }
  /* Doel = de volgende status, nu de rijke rij: naam + beloning boven, balk eronder.
     De balk vult richting déze tier (de /100 is zijn drempel), dus hij hoort hier. */
  /* FASE 5E.1 -- de rand stond op vol --gold-accent en was daarmee de enige lijn in
     de app die als neon las: een felgele omtrek van 2px over de volle breedte van
     het paneel, met een eigen oranje gloed eromheen. Hij hoort op te vallen, maar
     in de taal van de rest -- dus dezelfde gouden rand die "hier moet je naar
     kijken" elders ook draagt, met de gedeelde vulling en de gedeelde zachte gloed.
     Vol goud blijft op dit paneel waar het al zat: de NU-pil, en de balk die naar
     deze rang toe loopt. */
  .ladder-row.goal { flex-direction: column; align-items: stretch; gap: 7px; padding: 11px 13px;
    border: 2px solid var(--goud-rand); background: var(--goud-tint); box-shadow: var(--goud-gloed-zacht); }
  .lr-top { display: flex; align-items: center; gap: 10px; }
  .ladder-row.goal .lr-emoji { font-size: 27px; width: 32px; }
  .ladder-row.goal .lr-name { font-size: 16px; }
  .lr-bonus { font-size: 12.5px; font-weight: 700; color: var(--gold-light); flex: none; margin-left: auto; }
  .lr-progress { display: flex; align-items: center; gap: 8px; }
  .lr-bar { flex: 1; height: 11px; border-radius: var(--r-pill); background: var(--glass-black-32); border: 1px solid var(--glass-white-14); overflow: hidden; }
  .lr-bar > span { display: block; height: 100%; border-radius: var(--r-pill); background: var(--gold-accent); }
  .lr-count { font-size: 12px; font-weight: 700; color: var(--c-white); flex: none; }
  /* Huidige status = slanke 'je bent hier'-markering (geen balk meer) */
  .ladder-row.current { background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.06)); border-color: var(--goud-rand-zacht); }
  .lr-now { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--ink-on-gold); flex: none;
    background: var(--gold-accent); padding: 3px 9px; border-radius: var(--r-pill); }
  @media (prefers-reduced-motion: reduce) { .career-overlay, .pop-panel { animation: none; } }
  /* .map-sky (buiten) doet alleen het knippen en blijft zelf altijd op zijn
     plek t.o.v. het scherm; .map-sky-inner (binnen) krijgt de scroll-
     parallax-transform. Ooit zat de transform op
     .map-sky zelf -- dan verschuift de knip-grens mee met de parallax, en
     ontstaat er een onzichtbare strook aan de kant van het scherm waar
     nooit meer een wolk kan verschijnen). */
  /* Voetlicht onder de reisroute.
     Hier stond eerst een skyline van herhalende rechthoeken. Die tilde bij één
     schermbreedte nog wel, maar op een breed scherm herhaalde het motief zeven
     keer en las het als een staafdiagram -- en een rij kantoorblokken zegt ook
     niets over een popsterrentournee. Nu licht de onderrand op alsof de route
     over een verlicht podium loopt: alleen zachte verlopen, geen enkele
     herhalende vorm, dus het kán niet tegelen of mechanisch ogen. */
  .map-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 300px; pointer-events: none; z-index: 0;
    background:
      /* het licht zelf: warm, breed, van de onderrand omhoog uitwaaierend */
      radial-gradient(118% 72% at 50% 114%, rgba(255,216,128,.40), rgba(255,150,26,.16) 38%, transparent 68%),
      /* twee zachte nevelbanken, versprongen, zodat de horizon niet één rechte lijn is */
      radial-gradient(58% 40% at 20% 96%, rgba(255,255,255,.07), transparent 72%),
      radial-gradient(50% 34% at 78% 101%, rgba(255,255,255,.055), transparent 72%),
      /* vignet: pas doordat de hoeken dimmen wórdt het midden licht. Zonder dit
         verdwijnt een warme gloed in de toch al felroze onderkant van de app. */
      radial-gradient(115% 86% at 50% 104%, transparent 34%, rgba(30,4,54,.40) 100%),
      /* de vloer: het beeld zakt naar onderen toe weg in het donker */
      linear-gradient(180deg, transparent 0, rgba(42,6,72,.16) 64%, rgba(32,4,56,.30) 100%);
    /* de laag zelf dooft naar boven uit: zonder dit tekent het vignet een harde
       horizontale rand dwars over het scherm waar het element begint */
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 52%);
    mask-image: linear-gradient(180deg, transparent 0, #000 52%);
  }
  @media (max-height: 700px) { .map-ground { height: 210px; } }
  .map-sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .map-sky-inner { position: absolute; inset: 0; }
  .map-sky-inner > span { position: absolute; left: 0; opacity: .28; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(calc(100vw + 80px)); } }
  /* een enkel vliegtuig de andere kant op, voor wat diepte -- gespiegeld
     zodat de neus ook echt de reisrichting op wijst */
  .map-sky-inner > span.rev { animation-name: driftReverse; }
  @keyframes driftReverse {
    from { transform: translateX(calc(100vw + 80px)) scaleX(-1); }
    to { transform: translateX(-80px) scaleX(-1); }
  }

  /* Één balk voor alle drie de schermen (Kaart, Kleedkamer, Trofeeënkast): hij staat
     vast onderin en wisselt niet mee, dus alleen het gekozen tabblad verandert.

     Was 78% dekkend met een rand van 1,5px en een zware slagschaduw -- op een vlak
     verloop viel dat niet op, maar over een geschilderde wereld las het als een
     plank die erop lag. Nu glas: minder vlak, meer waas, en het randje zit in de
     box-shadow (inset) in plaats van in een border, zodat het geen pixel breedte
     kost. Alle waarden staan als variabelen bovenaan. */
  .main-nav {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--balk-rand) + var(--veilig-onder)); z-index: 40;
    display: none; gap: 5px; padding: 6px; border-radius: var(--r-lg); width: var(--balk-w);
    background: var(--nav-bg);
    backdrop-filter: blur(var(--nav-blur)) saturate(1.25);
    -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(1.25);
    border: 0; box-shadow: var(--nav-shadow), inset 0 0 0 1px var(--nav-ring);
  }
  /* De veeg onder de balk. Hangt aan de bálk en niet aan een scherm, dus hij staat
     er op élk scherm waar de balk staat -- kaart, reis, kleedkamer, kast -- en hij
     kan niet vergeten worden als er ooit een vijfde bijkomt. Van schermrand tot
     schermrand en naar niets uitlopend, zodat het onderste stukje wereld er gewoon
     doorheen te zien blijft.

     Waarom hij toch bovenop de inhoud ligt terwijl hij z-index -1 draagt: .main-nav
     is zelf een stapelcontext (fixed + z-index 40), dus -1 blijft daarbínnen -- net
     achter de balk, maar ruim vóór elk scherm.

     FASE 5E.1 -- de vorm van het verloop is verzet, niet zijn hoogte. Hij liep
     rechtlijnig van niets naar .5 op 56%, en dat betekende dat het donker al ver
     bóven de balk begon: op de wereldkaart werd de onderste band strand en zee een
     donkere strook vóór je bij de balk was. Dat is precies één band te veel op het
     mooiste scherm van het spel.

     Nu ligt de knik veel lager. Tot ongeveer de bovenrand van de balk gebeurt er
     bijna niets (.05), daarná zakt hij snel weg naar .6 aan de schermrand. De
     tekening leeft dus door tot vlak boven de balk, terwijl er ónder de labels --
     waar het om gaat, want daar staan de witte letters -- juist méér donker zit dan
     in de rechte versie. Nagemeten op de kaart: op 84px van de onderrand ging de
     veeg van .36 naar .05, en op 30px van de onderrand van .58 naar .52 -- onder de
     labels dus vrijwel hetzelfde, erboven vier keer minder. Die ondergrens is de
     lastigste van de vier schermen: op de reis schuift de Snoepwereld in vól licht
     onder de balk door, en daar moet "Kleedkamer" nog steeds te lezen zijn.

     Vier stops en geen twee: met twee kun je "bijna niets" en "snel weg" niet
     tegelijk zeggen zonder er een rand van te maken.

     FASE 6B -- hij stond hier als position:fixed met left:0/right:0, en dat deed
     niet wat het zegt. .main-nav draagt zelf een transform (translateX) én een
     backdrop-filter, en allebei maken van de balk het inhoudsblok voor álles wat
     eronder fixed staat. "Van schermrand tot schermrand" werd daarmee "van
     balkrand tot balkrand": een donkere rechthoek van --balk-w breed die precies
     op de onderrand van de bálk ophield in plaats van op die van het scherm.
     Nagemeten op 412x915: 12,4 -> 399,6 in plaats van 0 -> 412, en 775 -> 905 in
     plaats van 785 -> 915. Op de kaart viel dat weg tegen een geschilderde wereld;
     op de kleedkamer en de trofeeënkast, waar de egale schil doorloopt, stond er
     een zichtbaar kader om de balk heen en hield de veeg tien pixels boven de
     schermrand op.

     Nu absolute, met de breedte van het vénster (100vw, uitgemeten vanaf het
     midden van de balk -- en de balk staat altijd gecentreerd) en een negatieve
     bottom die precies de zweefruimte van de balk terugneemt. Dezelfde plek als
     bedoeld, maar zonder van fixed af te hangen in een element dat dat woord
     afpakt. */
  .main-nav::before {
    content: ''; position: absolute; z-index: -1; pointer-events: none;
    left: 50%; width: 100vw; margin-left: -50vw;
    bottom: calc(0px - var(--balk-rand) - var(--veilig-onder));
    height: calc(var(--balk-ruimte) + 44px);
    background: linear-gradient(180deg,
      rgba(14,7,30,0) 0%,
      rgba(14,7,30,.05) 34%,
      rgba(14,7,30,.44) 70%,
      rgba(14,7,30,.62) 100%);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--c-white); opacity: .82;
    /* dezelfde donkere kern-plus-waas als de koppillen: draagt de letters ook als
       er een lichte lucht achter het glas staat */
    text-shadow: var(--nav-ink);
    /* 6/5 in plaats van 7/6: de balk wordt er 5px lager van (71 -> 66) zonder dat
       het raakvlak onder de 44px komt -- een knop blijft 55px hoog. */
    background: transparent; border: none; border-radius: var(--r-md); padding: 6px 4px 5px; cursor: pointer;
    transition: transform .1s, background .15s, opacity .15s;
  }
  .nav-item .nav-ico { font-size: 25px; line-height: 1.1; filter: var(--emoji-schaduw); }
  .nav-item:active { transform: scale(.94); }
  /* blauw = 'hier ben je / dit staat aan' (zelfde taal als .item-card.selected in
     de kleedkamer). Goud blijft voorbehouden aan spelen + verdiend (zie .btn,
     .tour-stop.next, .item-card.equipped): navigatie is geen beloning. */
  .nav-item.active { opacity: 1; background: var(--nav-sel); box-shadow: inset 0 0 0 2px var(--nav-sel-ring); }
  /* Schermen met de vaste navigatie eronder krijgen ruimte zodat niets erachter
     verdwijnt: de balk zelf (--balk-ruimte, veilige zone incl.) plus 14px lucht,
     zodat het laatste element er écht onderuit te scrollen is en niet net
     tegen de balk aan blijft plakken. Was 100px plat -- hetzelfde getal op een
     toestel zonder streepje, maar nu klopt het ook mét. */
  .screen.hub { padding-bottom: calc(var(--balk-ruimte) + 14px); }

  /* ---- Spel ----
     Zelfde donkerpaarse .hub-sticky-kop als Kaart/Kleedkamer/Trofeeënkast: ✕ stoppen ·
     wereld · 💎 op de eerste regel, hartjes + vraag-voortgang samen gecentreerd op de tweede.
     #screen-game heeft (anders dan de andere hub-schermen) overal gelijke 8px padding.
     Dat stond hier vroeger nog een keer als een eigen kop-regel met -8px/16px/10px erin
     uitgerekend; nu zet het scherm alleen --rand en --kop-gap om (zie .screen) en volgt
     de kop daaruit. */
  #screen-game { padding: 8px; justify-content: flex-start; }
  /* Levens en voortgang stonden hier als één rij van elf bijna gelijke rondjes:
     drie hartjes plus acht stippen, twee betekenissen in dezelfde vorm. Nu twee
     vormen: hartjes links (hoeveel fouten mag ik nog), één balk in vakjes rechts
     (hoe ver ben ik). Die balk (.segbar) is gedeeld met het memory-spel. */
  .game-progress-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .notes-left { font-size: 19px; letter-spacing: 1px; white-space: nowrap; }
  .segbar { display: flex; gap: 3px; width: min(48vw, 190px); }
  .segbar > span {
    flex: 1; height: 9px; border-radius: var(--r-pill);
    background: var(--glass-white-30); transition: background .25s ease;
  }
  /* goud = gehaald (zelfde betekenis als overal elders), wit = waar je nu bent */
  .segbar > span.done { background: var(--gold-accent); }
  .segbar > span.now { background: var(--c-white); box-shadow: 0 0 6px rgba(255,255,255,.55); }
  @media (max-width: 430px) {
    .notes-left { font-size: 17px; letter-spacing: 0; }
    .segbar { width: min(44vw, 150px); }
  }

  /* Arena: de show (avatar) en het rekenen. Stond op
     align-content:space-evenly, wat op een telefoon drie gaten van ~100px maakte
     (kop→paspop, paspop→som, antwoorden→onderrand: samen ~340px van 844). Nu
     één groep met een vast ritme, gecentreerd in wat er over is. */
  .game-arena {
    display: flex; gap: 16px; align-items: center; align-content: center; justify-content: center;
    width: 100%; max-width: var(--kolom); margin-top: 4px; flex-wrap: wrap; flex: 1 1 auto;
  }
  .show-panel { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  /* zelfde breedte/hoogte-verhouding als de spiegel in de kleedkamer (~1.19 : 1),
     ~15% groter dan de vorige maat (vooral op mobiel voelde de paspop nog te klein),
     en de paspop zelf op dezelfde 92%-verhouding als de kleedkamer (geen eigen
     override meer nodig -- de kaart is nu zelf groot genoeg). */
  .show-stage { width: 253px; height: 214px; }

  .math-panel { display: flex; flex-direction: column; align-items: center; }
  .question-card {
    position: relative; overflow: hidden;
    background: var(--c-white); color: var(--purple-shadow); border-radius: var(--r-lg);
    padding: 18px 32px 26px; margin: 0 0 8px; text-align: center;
    font-size: clamp(42px, 8.5vw, 62px); font-weight: 700; min-width: min(88vw, 400px);
    box-shadow: var(--e-2); border: 3px solid rgba(255,255,255,.7);
  }
  /* Het onbekende getal -- het antwoord ("3 + 4 = ▢") of het ontbrekende getal
     ("3 + ▢ = 7") -- als een duidelijk in-te-vullen vakje. Meteen zichtbaar wát
     er gevraagd wordt, en visueel gelijk voor beide vraagsoorten. */
  .q-blank {
    display: inline-block; min-width: .72em; padding: 0 .12em; border-radius: var(--r-sm); line-height: 1.02;
    border: 3px dashed rgba(126,87,194,.55); background: rgba(126,87,194,.08); color: var(--purple-shadow);
  }
  .q-blank.done { border-style: solid; border-color: var(--green-deep); background: rgba(102,187,106,.18); color: var(--green-deep); }
  /* de spotlight-bonus leeft ín de somkaart: een gouden randje dat langzaam dooft —
     geen aparte tijdbalk-rij die als "haast je!" leest */
  .spot-rail {
    position: absolute; left: 16px; right: 16px; bottom: 9px; height: 7px;
    border-radius: var(--r-pill); background: rgba(74, 20, 140, .10);
  }
  .spotlight-bar { height: 100%; width: 100%; border-radius: var(--r-pill); background: var(--gold-accent); transition: width .1s linear; }
  /* gouden vraag: gele balk op gele kaart is onzichtbaar → donkere baan + paarse balk */
  .question-card.golden .spot-rail { background: rgba(74, 20, 140, .28); }
  .question-card.golden .spotlight-bar { background: linear-gradient(90deg, var(--purple-light), var(--purple-golden-accent)); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(88vw, 400px); margin-top: 4px; }
  .choice-btn {
    font-family: inherit; font-size: 34px; font-weight: 700; color: var(--c-white); border: none; cursor: pointer;
    padding: 18px 8px; border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--purple-input-top), var(--purple-input-bottom)); box-shadow: 0 var(--btn-lip) 0 var(--purple-input-shadow), var(--btn-diep);
    /* de snelste trede van de bewegingstaal: een antwoordknop moet indrukken
       vóórdat een kind zich afvraagt of de tik aankwam */
    transition: transform var(--t-tik), box-shadow var(--t-tik);
  }
  .choice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-input-shadow); }
  .choice-btn.good { background: linear-gradient(180deg, var(--green-top), var(--green-deep)); box-shadow: 0 var(--btn-lip) 0 var(--green-shadow), var(--btn-diep); }
  .choice-btn.bad { background: linear-gradient(180deg, var(--red-500), var(--red-answer-600)); box-shadow: 0 var(--btn-lip) 0 var(--red-answer-shadow), var(--btn-diep); }

  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(78vw, 300px); margin-top: 4px; }
  .num-btn {
    font-family: inherit; font-size: 28px; font-weight: 700; color: var(--c-white); border: none; cursor: pointer;
    padding: 13px 0; border-radius: var(--r-md);
    background: linear-gradient(180deg, var(--purple-input-top), var(--purple-input-bottom)); box-shadow: 0 var(--btn-lip) 0 var(--purple-input-shadow), var(--btn-diep);
  }
  .num-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--purple-input-shadow); }
  .num-btn.ok { background: linear-gradient(180deg, var(--green-top), var(--green-deep)); box-shadow: 0 var(--btn-lip) 0 var(--green-shadow), var(--btn-diep); }
  /* wissen is neutraal (grijs), niet rood: rood = fout antwoord, dat verwarren we niet */
  .num-btn.del { background: linear-gradient(180deg, var(--gray-top), var(--gray-bottom)); box-shadow: 0 var(--btn-lip) 0 var(--gray-shadow), var(--btn-diep); font-size: 22px; }

  /* ================= De zaal (fase 3.3: élke wereld) =========================
     Een show speelt in een plek, niet op een verloop. Deze laag maakt van het
     spelscherm de binnenkant van de wereld die het kind net op de kaart aantikte.

     De volgorde van onder naar boven is de hele afspraak, en ze loopt precies
     omgekeerd aan hoe belangrijk iets is:

       .venue-sfeer   de wereldkleuren als één naadloos verloop -- de bodem
       .venue-art     de wereld, onscherp en weggemaskerd -- licht, geen vormen
       .venue-bundel  de lichtbundel die op de ster valt
       .venue-licht   het zaallicht, het vignet en -- het belangrijkste -- de
                      donkere vloer waar de som op staat
       .game-arena    de ster, de som, de antwoorden
       .hub-sticky    de kop (zweeft, net als op de kaart)

     Regel waar alles aan opgehangen is: alles onder ~52% van het scherm blijft
     een rustig donker vlak. Dáár staat het rekenwerk, en het rekenwerk is het
     scherpste, lichtste en grootste ding op dit scherm. De zaal mag alles erboven
     hebben. Zie docs/ART-DIRECTION.md §4.3.

     Geen enkele regel hieronder weet in wélke wereld hij staat: alles loopt via
     var(--w-*) (de wereldkleuren) en var(--venue-*) (de zaalinstelling). Dat is
     wat voorkomt dat hier ooit een `if (wereld === 'ijs')` komt te staan. */
  #screen-game, #screen-end { position: relative; }
  .venue { display: none; position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .venue-aan .venue { display: block; }
  /* Boven de zaal uit. .hub-sticky draagt zijn eigen z-index (5), dus alleen de
     arena en de eindkaart hebben hier iets te zeggen. */
  .venue-aan .game-arena, .venue-aan .result-card { position: relative; z-index: 1; }

  /* ---- De bodem: de wereld als sfeer ----
     Twee verlopen die het hele scherm naadloos vullen, in de kleuren van déze
     wereld. Dit is de laag die de belofte draagt dat er nooit een rand, een naad
     of een herhaald stuk tekening te zien is: er ís geen beeld, dus er is niets
     om af te knippen. Wat er ook boven deze laag gebeurt, het scherm is altijd
     dicht. Kost niets -- een verloop wordt één keer getekend en daarna niet meer.

     Komt er ooit een échte zaaltekening per wereld (venue.art), dan blijft deze
     laag gewoon staan en dekt hij precies af wat die tekening niet vult. */
  .venue-sfeer {
    position: absolute; inset: 0;
    background:
      radial-gradient(124% 56% at 50% 0%, rgba(var(--w-glow-rgb), .34), transparent 70%),
      linear-gradient(180deg, var(--w-sky, #3d1a63) 0%, var(--w-deep, #2a0c47) 64%, var(--w-deep, #2a0c47) 100%);
  }

  /* ---- De wereldtekening, als licht en niet als landschap ----
     Zolang er geen eigen zaaltekening is, leent de zaal de wereldkaart zelf: het
     kind stapt ín de plek die het net aantikte, en dat bestand staat al in het
     geheugen omdat de kaart het een tel geleden getoond heeft. Nul extra bytes.

     Dat leent alleen niet vanzelf. Een kaart is een staande tekening met een
     horizon, een kustlijn en gebouwen die aan de rand ophouden. Zoom je daarop in
     en laat je hem het scherm vullen, dan valt de snede precies dáár: op een breed
     venster liep er een kaarsrechte kustlijn dwars door het beeld en stond er een
     halve tent tegen de schermrand -- de tekening lag zichtbaar afgeknipt op het
     scherm in plaats van erachter.

     De oplossing is niet een grotere zoom of een andere uitsnede (elke uitsnede
     heeft randen), maar het omdraaien van de rol. Deze laag hoeft het scherm niet
     te vullen: .venue-sfeer doet dat al. Ze mag dus naar alle kanten wégvallen --
     en een rand die op nul staat is geen rand meer.

     Drie dingen doen dat samen:
       het masker een ovaal dat naar buiten toe uitdooft. Hij staat in procenten
                  van het element, dus hij past zich aan élke vensterverhouding
                  aan: de schermrand ligt altijd op dezelfde plek in het ovaal en
                  is daar altijd (bijna) doorzichtig. Waar de snede zit doet er
                  niet meer toe -- hij valt per definitie in het doorzichtige deel.
       de blur    genoeg om vorm in kleur te veranderen. Een gebouw dat je kunt
                  aanwijzen hoort op de kaart; hier hoort alleen zijn licht.
       de dekking net onder de één, zodat de sfeerlaag er doorheen blijft praten
                  en de tekening nooit als tweede achtergrond gaat lezen.

     Het blijft een noodoplossing, en een goedkope: één regel in de wereld
     (venue.art) hangt hier later een echte zaaltekening in, en dan mag zoom terug
     naar ~100, blur naar 0-4 en de dekking naar 1. Verder verandert er niets. */
  .venue-art {
    position: absolute; inset: -8%;
    background-image: var(--venue-art, none);
    /* Zoom op de breedte en niet 'cover', want cover perst de héle wereldkaart in
       het scherm en dan kijk je naar een landschap in plaats van naar een zaal.
       Op de breedte, omdat de tekening staand is: dan is de uitsnede horizontaal
       altijd hetzelfde stuk, op elk toestel. --venue-focus kiest wélk stuk. */
    background-size: var(--venue-zoom, 220%) auto;
    background-position: var(--venue-focus, 70% 14%);
    background-repeat: no-repeat;
    /* geen background-color: .venue-sfeer is de bodem. Stond die hier wél, dan
       zou dit element zijn eigen vlak meebrengen en was het masker zinloos. */
    filter: blur(var(--venue-blur, 11px)) brightness(var(--venue-dim, .62)) saturate(1.1);
    opacity: var(--venue-op, .96);
    -webkit-mask-image: radial-gradient(74% 86% at 50% 18%,
      #000 0 24%, rgba(0,0,0,.74) 48%, rgba(0,0,0,.30) 70%, transparent 92%);
    mask-image: radial-gradient(74% 86% at 50% 18%,
      #000 0 24%, rgba(0,0,0,.74) 48%, rgba(0,0,0,.30) 70%, transparent 92%);
  }
  /* Ligt het venster op zijn kant, dan zie je van een staande tekening een brede,
     lage strook -- en juist in zo'n strook komen kustlijnen en daken als rechte
     lijnen door het beeld. Verder inzoomen laat minder tekening zien, meer blur
     maakt van wat overblijft licht, en minder dekking laat de sfeerlaag winnen.
     Drie kleine draaien aan dezelfde knoppen; geen aparte laag, geen apart beeld. */
  @media (min-aspect-ratio: 1/1) {
    .venue-art {
      background-size: calc(var(--venue-zoom, 220%) * 1.75) auto;
      filter: blur(calc(var(--venue-blur, 11px) * 2.1)) brightness(var(--venue-dim, .62)) saturate(1.1);
      opacity: calc(var(--venue-op, .96) * .7);
    }
  }
  /* Zaallicht + vloer. Vier verlopen, één element: warm van boven (het is een
     show), de wereldkleur in de hoeken (het is een zaal), en daaronder de vloer
     die het onderste deel van het scherm terugbrengt naar rustig donker.

     De donkere kleur is hier niet meer het paars van de Muziekwereld maar
     --w-deep van de wereld waar je staat: in de IJswereld is de vloer donkerblauw,
     in de Snoepwereld donkerrood. Dezelfde zaal, ander licht -- precies het
     verschil dat een wereld hoort te maken. */
  .venue-licht {
    position: absolute; inset: 0;
    background:
      radial-gradient(112% 40% at 50% 2%, rgba(255,222,150,.30), transparent 64%),
      radial-gradient(86% 58% at 50% 26%, transparent 34%, rgba(var(--w-deep-rgb), .62) 100%),
      linear-gradient(180deg, transparent 26%, rgba(var(--w-deep-rgb), .50) 46%,
                      rgba(var(--w-deep-rgb), .82) 62%, rgba(var(--w-deep-rgb), .93) 100%);
  }
  /* Het voetlicht op de rand van het podium: een lijn licht, dwars over de vloer.

     Het ovaal stond hiervoor met zijn mídden op de ónderrand van zijn eigen doosje
     (at 50% 100%, height 26%). Precies daar is het licht op zijn felst -- en precies
     daar hield het element op. Wat je dus zag was niet een uitdovende gloed maar een
     kaarsrechte streep dwars over het scherm, op 70% hoogte (64% op een kort scherm,
     waar de regel hieronder top naar 38% zet). Opgemeten op alle zes de werelden en
     op 320x568, 390x844, 412x915 en 768x1024: dezelfde lijn, altijd op dezelfde
     breuk van de hoogte -- het licht wérd afgeknipt, de tekening niet.

     Hetzelfde ovaal, nu heel: het doosje is twee keer zo hoog en het middelpunt
     staat op de halve hoogte. Middelpunt (70%), horizontale straal (60% van 120%
     schermbreedte) en verticale straal (26% van de schermhoogte) zijn tot op de
     pixel wat ze waren -- alleen loopt de onderste helft nu ook echt uit, in plaats
     van tegen de rand van zijn eigen element te eindigen. De gloed dooft op 72% van
     de straal uit, dus ruim binnen de nieuwe onderrand (96%, of 90% op een kort
     scherm): er komt geen tweede rand voor terug. */
  .venue-licht::after {
    content: ''; position: absolute; left: -10%; right: -10%; top: 44%; height: 52%;
    background: radial-gradient(60% 50% at 50% 50%, rgba(255,206,128,.34), transparent 72%);
    opacity: .6; transition: opacity var(--t-snel) ease;
  }
  /* De warme golf die bij een goed antwoord door de zaal trekt. Staat bewust als
     eigen laag op opacity 0 klaar en wordt niet uit het beeld zelf gehaald: de
     helderheid van .venue-art opdraaien zou een filter-overgang zijn, en dan
     wordt die hele onscherpe tekening bij élk goed antwoord opnieuw berekend.
     Twee lagen die alleen van opacity veranderen kosten de samensteller niets. */
  .venue-licht::before {
    content: ''; position: absolute; inset: 0; opacity: 0;
    transition: opacity var(--t-snel) ease;
    background:
      radial-gradient(90% 44% at 50% 4%, rgba(255,226,158,.34), transparent 66%),
      radial-gradient(70% 34% at 50% 52%, rgba(255,198,120,.22), transparent 74%);
  }
  /* Goed antwoord: de zaal licht één tel op -- zie submitAnswer/zaalJuicht, dat de
     klasse 380ms zet. Meer dan dit doet de zaal niet; de knop, de diamanten en de
     dans van de ster zeggen de rest. */
  .venue.juist .venue-licht::after { opacity: 1; }
  .venue.juist .venue-licht::before { opacity: 1; }

  /* ---- De ster op het podium ----
     Buiten een zaal is .show-panel precies wat het was: een kader met de paspop
     erin. Ín een zaal valt dat kader weg -- een omlijst vakje is een etalage, en
     zij staat niet in een etalage maar op een podium. Wat ervoor in de plaats
     komt: een bundel van boven en een richel onder haar voeten. */
  .show-panel { position: relative; }
  .venue-bundel, .venue-vloer { display: none; pointer-events: none; }
  .venue-aan .venue-bundel, .venue-aan .venue-vloer { display: block; position: absolute; z-index: 0; }
  /* De bundel valt van boven het scherm op haar. Loopt bewust boven het paneel
     uit: overloop naar bóven maakt een scrollvak nooit scrollbaar (alleen naar
     onderen), dus dit kost geen schuifbalk en geen extra hoogte. */
  .venue-aan .venue-bundel {
    left: 50%; bottom: 8%; width: 210%; height: 260%; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(255,238,196,.42) 0%, rgba(255,208,132,.15) 54%, rgba(255,196,120,0) 86%);
    -webkit-clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    filter: blur(13px);
  }
  /* De richel waar ze op staat: een ellips onder haar voeten met een warme lip
     aan de voorkant. Dit is wat "zij staat ergens" van "zij zweeft" onderscheidt. */
  .venue-aan .venue-vloer {
    left: 50%; bottom: -5%; width: 132%; height: 30%; transform: translateX(-50%);
    border-radius: 50%;
    /* De warme lip is zaallicht en blijft dus in élke wereld hetzelfde goud; de
       schaduw eronder is de vloer van díe wereld en volgt --w-deep. */
    background:
      radial-gradient(52% 46% at 50% 14%, rgba(255,232,176,.70), rgba(255,190,104,.22) 56%, transparent 76%),
      radial-gradient(58% 64% at 50% 52%, rgba(var(--w-deep-rgb), .88), rgba(var(--w-deep-rgb), .36) 72%, transparent 88%);
    box-shadow: 0 0 40px rgba(255,196,116,.30), inset 0 2px 0 rgba(255,228,168,.35);
  }
  /* Op het eindscherm staat het podium ín een kaart. Het paneel moet dus precies
     zo breed zijn als de paspop, anders loopt de richel als een streep dwars over
     de hele kaart. De ruimte erboven is voor de slotchoreografie: die springt tot
     38px omhoog, en zonder kader is dat nu zichtbaar in plaats van weggeknipt. */
  .venue-aan .end-panel { width: 150px; margin: 24px auto 0; }
  .venue-aan .end-stage { margin: 0; }
  /* de kop van de kaart blijft bovenop, ook als ze op haar hoogste sprong zit */
  .venue-aan .result-card .title { position: relative; z-index: 2; }
  @media (max-height: 740px) {
    .venue-aan .end-panel { width: 104px; margin-top: 12px; }
  }
  /* Het kader zelf gaat weg, de maat blijft: alles eromheen (de arena, de
     smalle-schermregels) rekent op deze afmeting. */
  .venue-aan .show-stage, .venue-aan .end-stage {
    background: none !important; border: 0; box-shadow: none; overflow: visible;
    position: relative; z-index: 1;
  }
  /* de gekleurde lichtvlekken van het oude kader, en zijn drie hoek-emoji:
     het geschilderde licht van de zaal doet dit werk nu */
  .venue-aan .show-stage::after, .venue-aan .end-stage::after { display: none; }
  .venue-aan .show-stage .deco, .venue-aan .end-stage .deco { display: none; }
  /* zonder kader mag ze groter -- ze is nu zelf het onderwerp en niet de inhoud
     van een vakje. Een zachte schaduw onder haar houdt haar op de richel. */
  .venue-aan .show-stage .avatar-holder, .venue-aan .end-stage .avatar-holder {
    height: 104%; filter: drop-shadow(0 6px 10px rgba(14,2,30,.55));
  }

  /* ---- De kop van een show ----
     Op de kaart zweeft de kop: geen balk, drie kleine pillen, de tekening loopt
     er ongebroken onderdoor. In de zaal hoort dat net zo, en om precies dezelfde
     reden -- elke pixel dekkende balk is een pixel zaal die een kind niet ziet.
     Dezelfde stof (--hud-*), dus dit is letterlijk dezelfde kop, één scherm
     verder. */
  .venue-aan .hub-sticky {
    background: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    border-bottom: 0; border-radius: 0; box-shadow: none; padding-bottom: 2px;
  }
  .venue-aan .screen-header .header-title { text-shadow: var(--hud-ink); }
  .venue-aan .screen-header .icon-btn,
  .venue-aan .screen-header .diamond-badge {
    background: var(--hud-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--hud-shadow), inset 0 0 0 1px var(--hud-ring);
    text-shadow: var(--hud-ink);
  }
  /* De diamantenteller is hier een teller en geen knop: hij is het doel waar de
     verdiende diamanten naartoe vliegen. Een maat kleiner dan op de rustpunten,
     zodat hij niet met de som concurreert. */
  .venue-aan .screen-header .diamond-badge { font-size: 17px; padding: 6px 13px; }
  /* Hartjes en showvoortgang: samen één pilletje van dezelfde stof, zodat ze als
     één ding lezen ("hoe sta ik ervoor") in plaats van als twee meters. */
  .venue-aan .game-progress-row {
    padding: 5px 14px 6px; border-radius: var(--r-pill);
    background: var(--hud-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--hud-shadow), inset 0 0 0 1px var(--hud-ring);
  }
  /* de showvoortgang is hier de hoofdzaak, de hartjes de bijzin */
  .venue-aan .notes-left { font-size: 15px; opacity: .92; }
  .venue-aan .segbar > span { height: 8px; }

  /* De somkaart draagt in een zaal zijn eigen licht: een zachte gloed eromheen,
     zodat hij op de vloer staat en er niet op geplakt is. */
  .venue-aan .question-card { box-shadow: var(--e-2), 0 0 34px rgba(255,198,120,.18); }
  /* Elke nieuwe vraag komt binnen in plaats van te verspringen. Heel kort (140ms):
     dit is geen overgang maar een aankondiging. */
  .venue-aan .question-card.vers { animation: vraagIn .14s var(--ease-uit) both; }
  @keyframes vraagIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* ---- Kaart <-> zaal ----
     Twee klassen, en verder niets. Beide zetten alleen transform en opacity, dus
     er wordt nooit iets opnieuw ingedeeld.

     .wegvallend  het scherm dat vertrekt. Vast gepositioneerd, zodat het uit de
                  kolom stapt en het binnenkomende scherm meteen zijn volle maat
                  krijgt -- anders zouden er even twee schermen naast elkaar in
                  dezelfde flexkolom staan en springt de opmaak. Het ligt altijd
                  bovenop, want het is het enige dat doorzichtig wordt.
     .komt-op     het scherm dat aankomt. Doet niets anders dan de eigen fade van
                  .screen.active uitzetten, want die zou met de animatie vechten
                  -- en die fade is precies wat hier niet meer hoort te gebeuren.

     Hier stond ook .komt-boven: dan lag het aankomende scherm er juist bovenop.
     Dat kan niet meer bestaan naast de regel bij MOTION ("wie bovenop ligt, doet
     de doorzichtigheid"): een aankomend scherm is vanaf zijn eerste beeldje
     ondoorzichtig, en iets ondoorzichtigs bovenop leggen laat niets meer te
     onthullen over. De klasse is daarom weg, en niet alleen ongebruikt.

     De z-waarden zijn klein en gelden alleen tussen de schermen onderling: #app
     is zelf een stapelcontext (position:relative, z-index 1), dus geen enkel
     scherm kan ooit boven .main-nav uitkomen. Die balk staat búiten de schermen
     en wordt daarom apart meegenomen -- zie navMee.

     Waarom show() .komt-op weghaalt en de animatie zelf niet: 'animation: none'
     weghalen terwijl het scherm in beeld staat zet screenIn alsnog aan, en dan
     fade't het scherm voor de tweede keer in. Dat was een zichtbare knipper aan
     het eind van élke overgang -- gemeten: opacity viel op 330ms terug naar 0 en
     klom er opnieuw uit. */
  /* Eén id per scherm i.p.v. !important: #screen-map/#screen-game/#screen-end
     zetten zelf al een position, en een klasse verliest daar altijd van. */
  #screen-map.wegvallend, #screen-game.wegvallend, #screen-end.wegvallend,
  #screen-journey.wegvallend {
    display: flex; position: fixed; inset: 0; z-index: 2; pointer-events: none;
  }
  #screen-map.komt-op, #screen-game.komt-op, #screen-end.komt-op,
  #screen-journey.komt-op { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .venue-aan .question-card.vers { animation: none; }
    .venue-licht::after, .venue-licht::before { transition: none; }
  }
  /* Krap scherm: de zaal verliest hoogte, het rekenwerk niet. De bundel en de
     richel krimpen mee met de paspop; de vloer begint hoger zodat er onder de
     som nog evenveel rustig vlak overblijft. */
  @media (max-height: 700px) {
    .venue-licht { background:
      radial-gradient(112% 34% at 50% 0%, rgba(255,222,150,.26), transparent 62%),
      radial-gradient(86% 56% at 50% 22%, transparent 32%, rgba(var(--w-deep-rgb), .62) 100%),
      linear-gradient(180deg, transparent 18%, rgba(var(--w-deep-rgb), .54) 40%,
                      rgba(var(--w-deep-rgb), .84) 58%, rgba(var(--w-deep-rgb), .93) 100%); }
    .venue-licht::after { top: 38%; }
    /* minder hoogte = de vloer begint hoger, dus het ovaal moet ook hoger
       uitdoven; verder hetzelfde masker en dezelfde redenering */
    .venue-art { -webkit-mask-image: radial-gradient(74% 72% at 50% 12%,
        #000 0 20%, rgba(0,0,0,.70) 44%, rgba(0,0,0,.26) 66%, transparent 88%);
      mask-image: radial-gradient(74% 72% at 50% 12%,
        #000 0 20%, rgba(0,0,0,.70) 44%, rgba(0,0,0,.26) 66%, transparent 88%); }
  }

  /* ---- Telmodus (lees-vrij): hoeveelheden i.p.v. cijfers ---- */
  /* De vraagkaart toont in deze modus een groep objecten (of een opdracht-icoon)
     met een 🔊-knop om de gesproken opdracht te herhalen. */
  /* de 🔊-knop stond hier vroeger ín (absoluut, rechts); nu staat hij als echte
     knop ónder de kaart (zie .replay-btn), dus de kaart hoeft er geen 30px
     zijruimte meer voor vrij te houden en de som/groep krijgt die breedte terug */
  .count-q { position: relative; display: flex; align-items: center; justify-content: center; min-height: 84px; padding: 4px 14px; }
  .cq-groupwrap { display: flex; align-items: center; justify-content: center; }
  .cgroup { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; max-width: 260px; line-height: 1; }
  /* tot 3 objecten op een rij: netjes groepeerbaar in beeld (subitiseren) */
  .cgroup.n4, .cgroup.n5, .cgroup.n6 { max-width: 168px; }
  .cg-obj { font-size: 34px; }
  .cgroup.big .cg-obj { font-size: 46px; }
  .cg-dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--purple-input-top) 70%, var(--purple-input-bottom)); box-shadow: inset 0 -2px 3px rgba(0,0,0,.25); }
  .cgroup.big .cg-dot { width: 34px; height: 34px; }
  .cgroup.mini { gap: 2px 3px; max-width: 74px; margin-top: 4px; }
  .cgroup.mini .cg-dot { width: 9px; height: 9px; background: rgba(255,255,255,.9); box-shadow: none; }
  .cq-label { font-size: clamp(26px, 6vw, 40px); font-weight: 700; color: var(--purple-shadow); }
  .cq-listen { font-size: 56px; animation: earwiggle 1.4s ease-in-out infinite; }
  @keyframes earwiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  /* In de telmodus is de gesproken opdracht de héle vraag. "Nog eens voorlezen"
     was daarom precies het verkeerde element om weg te moffelen (26px, 45%
     doorzichtig, tegen de rand van de kaart). Nu een echte knop van 48px, vol
     zichtbaar, direct onder de somkaart: na de antwoordtegels de belangrijkste
     tik op het scherm. Gouden randje = "dit hoort bij de vraag"; verder de
     rustige glas-vulling van .btn.soft, zodat hij niet met de tegels concurreert. */
  .replay-btn {
    width: 48px; height: 48px; padding: 0; margin: 4px auto 2px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-family: inherit; font-size: 22px; line-height: 1; color: var(--c-white);
    /* FASE 5E -- de ring was vol --gold-accent. Dat is in deze app de kleur van
       "verdiend", en hij zat hier op een hulpknop: nog eens voorlezen. Op het
       telscherm was daarmee het luidsprekertje het enige gouden ding in beeld,
       luider dan de twee antwoorden eronder waar het om gaat. Cyaan is de kleur
       van bediening (dezelfde als de gekozen tab, de gekozen categorie en het
       kaartje waar je naar kijkt), en dat is precies wat deze knop is. Vindbaar
       blijft hij van zijn maat -- 48px, vol dekking -- en niet van zijn kleur. */
    border-radius: 50%; border: 2px solid var(--cyaan-rand);
    background: linear-gradient(180deg, var(--cyaan-tint), rgba(255,255,255,.07));
    box-shadow: 0 3px 0 var(--glass-black-28);
  }
  .replay-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--glass-black-28); }
  /* meetellen: elk object popt op maat op */
  .cg-obj.pre, .cg-dot.pre { opacity: .22; transform: scale(.7); }
  .cg-obj.pop, .cg-dot.pop { animation: cpop .4s ease; opacity: 1; }
  @keyframes cpop { 0% { transform: scale(.5); opacity: .3; } 60% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
  .cg-obj.fade-out, .cg-dot.fade-out { animation: cfade .5s ease forwards; }
  @keyframes cfade { to { opacity: .12; transform: scale(.5); } }

  /* Tienraam: 2 rijen van 5 vakjes — 6–10 in één oogopslag herkenbaar (subitiseren) */
  .cframe { display: inline-grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tf-cell { width: 28px; height: 28px; border-radius: var(--r-sm); border: 2px solid rgba(74,20,140,.22); display: flex; align-items: center; justify-content: center; }
  .tf-cell.on { border-color: rgba(74,20,140,.38); background: rgba(142,36,170,.08); }
  .tf-cell.hidden { background: rgba(74,20,140,.14); font-size: 15px; }
  .cframe.big .tf-cell { width: 34px; height: 34px; }
  .cframe .cg-obj { font-size: 20px; }
  .cframe.big .cg-obj { font-size: 24px; }
  .cframe .cg-dot { width: 16px; height: 16px; }
  /* tienraam in een antwoordknop: écht kleinere vakjes (geen transform-schaal —
     die verkleint alleen visueel, niet de layout, waardoor 3 tegels op smalle
     schermen buiten beeld liepen). De maten schalen mee met de tegel (cqw, zie
     .count-tile): bij 3 of 4 tegels naast elkaar is één tegel maar een derde of
     een kwart van de rij breed. De px-waarde ervoor is de bovengrens én de
     terugval voor browsers zonder containerquery's. */
  .count-tile .cframe { gap: 2px; gap: min(2px, 2cqw); }
  /* de mini-raampjes houden hun eigen kleine ronding: dat is de tekening van het
     reken-hulpmiddel, niet de UI-schaal -- --r-sm op een vakje van 10-15px maakt
     er een rondje van */
  .count-tile .cframe .tf-cell { width: 15px; height: 15px; width: min(15px, 17cqw); height: min(15px, 17cqw); border-width: 1.5px; border-radius: 4px; }
  .count-tile .cframe .cg-obj { font-size: 11px; font-size: min(11px, 12cqw); }
  .count-tile .cframe .cg-dot { width: 8px; height: 8px; width: min(8px, 9cqw); height: min(8px, 9cqw); }

  /* ---- Stippenraam (leer-aid): vijf-/tienraam met VASTE plekken ----
     Vaste vulvolgorde (bovenrij eerst, links→rechts); lege vakjes blijven zichtbaar,
     de rijen staan iets uit elkaar (5-anker), zodat je "5 en nog wat" en "hoeveel
     nog tot 10" in één oogopslag ziet, zonder elke stip te hertellen. */
  .dframe { display: inline-grid; grid-template-columns: repeat(5, auto); column-gap: 5px; row-gap: 8px; }
  .df-cell { width: 22px; height: 22px; border-radius: var(--r-sm); border: 1.5px solid rgba(74,20,140,.16); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
  .df-cell.on { border-color: rgba(74,20,140,.30); }
  .df-dot { width: 64%; height: 64%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b98be6, var(--purple-input-bottom) 78%); }
  .dframe.big .df-cell { width: 27px; height: 27px; }
  .dframe.faint .df-dot { opacity: .34; }
  /* kleine steunstipjes ónder een cijfer (antwoordknoppen + som-operanden) */
  .dframe.mini { column-gap: 2px; row-gap: 2px; }
  .dframe.mini .df-cell { width: 10px; height: 10px; border-radius: 3px; border-width: 1px; }
  /* Stippenraam in een antwoordknop: net als het tienraam hierboven kleiner, en
     meeschalend met de tegel. Zonder deze regel hield het raam zijn volle vakjes
     van 22px: vijf naast elkaar (130px) is breder dan een tegel als er 3 of 4
     naast elkaar staan, en dan liep de hele rij tegels buiten beeld -- de derde
     tegel was op een telefoon half weg. De steunstipjes onder een cijfer
     (.dframe.mini) houden hun eigen maat. */
  .count-tile .dframe:not(.mini) { column-gap: 4px; row-gap: 7px; column-gap: min(4px, 2cqw); row-gap: min(7px, 6cqw); }
  /* ronding in procenten i.p.v. --r-sm: het vakje is nu geen vaste 22px meer, en
     een vaste 10px ronding maakt van een geslonken vakje een rondje */
  .count-tile .dframe:not(.mini) .df-cell { width: 20px; height: 20px; width: min(20px, 18cqw); height: min(20px, 18cqw); border-radius: 45%; }
  /* op paarse knoppen: witte stippen + lichtere randjes (i.p.v. donker op wit) */
  .count-tile .df-cell { border-color: rgba(255,255,255,.3); }
  .count-tile .df-cell.on { border-color: rgba(255,255,255,.5); }
  .count-tile .df-dot { background: rgba(255,255,255,.95); }
  .df-dot.pre { opacity: .22; transform: scale(.6); }
  .df-dot.pop { animation: cpop .4s ease; }
  .df-dot.fade-out { animation: cfade .5s ease forwards; }
  /* Grote-cijferkaart (cijfer → hoeveelheid) */
  .cq-bignum { font-size: clamp(52px, 15vw, 84px); font-weight: 700; color: var(--purple-shadow); line-height: 1; }
  /* Één-meer/minder-badge naast de groep */
  .cq-delta { font-size: 30px; font-weight: 700; margin-left: 6px; }
  .cq-delta.add { color: var(--green-deep); }
  .cq-delta.rem { color: var(--red-500); }
  /* Twee groepjes samen */
  .cq-combine { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .cq-plus { font-size: 34px; font-weight: 700; color: var(--purple-shadow); }
  /* Vervaagde cijfersteun (fase 6, hogere rung) */
  .cgroup.mini.faint { opacity: .35; }
  /* Gesteunde sommen (fases 9–11): de vergelijking a ＋/➖ b ＝ ? */
  /* cijfers + tekens op één gemeenschappelijke onderlijn; de stippen hangen er los
     onder (absoluut), zodat ze de uitlijning van de som niet scheeftrekken */
  .sum-eq { display: flex; align-items: baseline; justify-content: center; gap: 4px 10px; flex-wrap: wrap; max-width: 100%; }
  .sum-op { font-size: clamp(26px, 6.5vw, 36px); font-weight: 700; color: var(--purple-shadow); }
  .sum-eq-q { font-size: clamp(34px, 9vw, 50px); font-weight: 700; color: var(--purple-input-bottom); align-self: baseline; }
  /* elke operand krijgt genoeg breedte om zijn eigen stippenraam eronder te dragen,
     zodat de raampjes van 7 en 3 elkaar niet overlappen */
  .sum-operand { position: relative; display: inline-block; min-width: 62px; padding-bottom: 30px; }
  .sum-num { font-size: clamp(30px, 8vw, 46px); font-weight: 700; color: var(--purple-shadow); line-height: 1; }
  .sum-eq .cgroup.big .cg-obj { font-size: clamp(22px, 6vw, 32px); }
  .sum-eq .cgroup.big { max-width: 128px; }   /* alleen de zichtbare voorwerp-groepjes (fase 9) breed */
  /* de cijfer-stippen (fase 10/11) staan als net rijtje ónder het cijfer, gecentreerd */
  .sum-operand .dframe.mini { position: absolute; top: 100%; left: 50%; transform: translate(-50%, -30px); }
  /* Wegstrepen bij aftrekken gebeurt per stuk binnen één startgroep (5 dingen,
     laatste 3 weg). Er stond hier ook een .cgroup.crossed dat een hele groep
     doorstreepte; die klasse werd nergens meer gezet. */
  .cg-obj.xed { opacity: .45; text-decoration: line-through; text-decoration-thickness: 2px; }
  .df-dot.xed { opacity: .5; filter: grayscale(1); position: relative; }
  .df-dot.xed::after { content: ''; position: absolute; left: -30%; right: -30%; top: calc(50% - 1.25px); height: 2.5px; background: var(--purple-shadow); transform: rotate(-15deg); border-radius: 2px; }

  /* minmax(0, 1fr) i.p.v. 1fr: een kolom mag nooit breder worden dan haar deel
     van de rij, ook niet als de inhoud (een raampje) van zichzelf breder is --
     anders groeit de rij tegels buiten het scherm. */
  .count-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(88vw, 400px); margin-top: 4px; }
  .count-tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .count-tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .count-tile {
    font-family: inherit; border: none; cursor: pointer; color: var(--c-white);
    min-height: 78px; padding: 12px 8px; border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--purple-input-top), var(--purple-input-bottom)); box-shadow: 0 var(--btn-lip) 0 var(--purple-input-shadow), var(--btn-diep);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .07s, box-shadow .07s;
    /* de tegel is de maatstok voor alles wat erin staat (cqw hierboven): hoeveel
       tegels er naast elkaar staan verschilt per vraag (2, 3 of 4), dus een
       vw-maat zou bij 2 tegels te klein en bij 4 te groot uitvallen */
    container-type: inline-size;
  }
  .count-tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-input-shadow); }
  .count-tile.good { background: linear-gradient(180deg, var(--green-top), var(--green-deep)); box-shadow: 0 var(--btn-lip) 0 var(--green-shadow), var(--btn-diep); }
  .count-tile.bad { background: linear-gradient(180deg, var(--red-500), var(--red-answer-600)); box-shadow: 0 var(--btn-lip) 0 var(--red-answer-shadow), var(--btn-diep); }
  .count-tile .cg-obj { font-size: 27px; }
  .count-tile .cg-dot { width: 20px; height: 20px; }
  .count-tile .ct-num { font-size: 40px; font-weight: 700; line-height: 1; }

  /* ---- Goed antwoord: de tegel viert zelf mee (veerpop + glow-ring + ✓-stempel) ---- */
  .choice-btn.good, .count-tile.good { position: relative; animation: goodPop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes goodPop { 0% { transform: scale(1); } 35% { transform: scale(1.11); } 70% { transform: scale(.98); } 100% { transform: scale(1); } }
  .choice-btn.good::before, .count-tile.good::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: 0 0 0 3px var(--green-top); opacity: 0; animation: goodRing .55s ease-out forwards;
  }
  @keyframes goodRing { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) {
    .choice-btn.good, .count-tile.good { animation: none; }
    .choice-btn.good::before, .count-tile.good::before { display: none; }
  }

  /* ---- Memory-spel (lees-vrij: zoek de gelijke hoeveelheden) ---- */
  /* Het memory-spel hangt als los knopje over de kaart, en dat is precies de plek
     waar het moet oppassen: rechtsonder, boven de navigatiebalk, in de hoek van
     de veilige zone waar een wereld een halte mág neerzetten (zie ZONE en
     docs/WORLD-ART-BRIEF.md).

     Het was een opgetild blokje van 78x86px met een harde 3px-lip eronder --
     een knop met hetzelfde gewicht als de dingen op de kaart zélf, terwijl het
     een zijspoor is. Nu compacter (62x66) en vlakker glas zonder lip: dezelfde
     plek, dezelfde inhoud, minder stem, en een kwart minder tekening afgedekt.

     Volledig vrij van die zonehoek krijg je het niet: op een telefoon van 320px
     is de veilige zone 198px breed en blijft er links en rechts maar 61px over,
     smaller dan welk bruikbaar knopje ook. Wat wél te garanderen is, is dat hij
     geen enkele échte halte afdekt -- test 7f meet dat na op alle werelden, zodat
     een nieuwe wereld die daar wél een halte neerzet opvalt vóór een kind erop
     tikt in plaats van erna. */
  .mem-fab {
    position: fixed; right: 14px; bottom: calc(var(--nav-h, 94px) - 12px); z-index: 30;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    font-family: inherit; font-size: 21px; font-weight: 700; color: var(--c-white);
    cursor: pointer; padding: 8px 11px 7px; border-radius: var(--r-md);
    border: 1px solid var(--glass-white-20);
    background: rgba(32,12,58,.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px var(--glass-black-32);
  }
  .mem-fab span { font-size: 11.5px; font-weight: 700; }
  /* wat het oplevert stáát er nu op: het was een knop zonder beloofde beloning */
  .mem-fab .mem-pay { font-size: 10.5px; font-weight: 700; opacity: .88; letter-spacing: .01em; }
  .mem-fab:active { transform: scale(.95); }
  /* ---- Op het kortste scherm: het woord eraf --------------------------------
     Op 320x568 is het knopje 67x70 en staat de onderste halte van de Piratenwereld
     er pal achter: het hárt van halte 26 viel binnen het knopje, dus een tik daarop
     startte het memoryspel in plaats van de show. Opgemeten met elementFromPoint,
     en het gold ook vóór deze fase -- de kaart stond er alleen net vaak genoeg
     geschoven dat controle 7f het niet zag (zie de opmerking bij die controle).

     Wat eraf gaat is het woord "Memory", niet de knop: het microfoontje en wat hij
     oplevert (💎 9) blijven staan. Daarmee wordt hij 50x56 in plaats van 67x70, en
     schuiven zijn linker- en bovenrand voorbij het hart van élke halte in élke
     wereld. Dezelfde ingreep als bij .saved-pill .sp-word op een smal scherm, en om
     dezelfde reden: het plaatje zegt het al, het woord kost de ruimte.

     .world-back gaat in dezelfde adem een maatje kleiner. Die pil staat middenonder
     en dat is precies waar de standaardslinger zijn eerste halte neerzet; kleiner
     maken brengt de overlap daar van 41% terug naar 27%, binnen de marge die
     controle 7f bewaakt. */
  @media (max-height: 620px) {
    /* > span, niet span: het bedrag zit als eigen <span> ín .mem-pay, en zonder de
       directe-kindselector verdween dát nummer mee -- dan stond er "💎" zonder
       getal, precies de knop-zonder-beloofde-beloning die hierboven is opgelost. */
    .mem-fab > span:not(.mem-pay) { display: none; }
  }
  /* de kaartjes stonden klein in het midden met ~430px lucht eromheen; ze mogen
     de ruimte gewoon gebruiken -- het is een spel dat je op afstand van tafel speelt */
  .mem-arena { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .mem-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); align-items: start; gap: 12px; width: min(96vw, var(--kolom)); }
  .mem-card {
    position: relative; aspect-ratio: 1 / 1; border: none; background: none; cursor: pointer; padding: 0;
    perspective: 600px;
    /* de inhoud schaalt mee met de kaart zelf (cqw hieronder), niet met het scherm:
       memFitCols kiest per situatie een ander aantal kolommen, dus een vw-maat zou
       bij 2 kolommen veel te groot en bij 4 veel te klein uitvallen */
    container-type: inline-size;
  }
  .mem-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .35s; }
  .mem-card.open .mem-inner, .mem-card.done .mem-inner { transform: rotateY(180deg); }
  .mem-back, .mem-face {
    position: absolute; inset: 0; border-radius: var(--r-md); backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .mem-back {
    font-size: clamp(26px, 8vw, 40px); font-size: 34cqw;
    background: linear-gradient(150deg, var(--purple-input-top), var(--purple-input-bottom));
    border: 2px solid rgba(255,255,255,.35);
  }
  .mem-face {
    transform: rotateY(180deg); background: var(--c-white);
    border: 2px solid rgba(255,255,255,.7); padding: 6px;
  }
  .mem-card.done .mem-face { background: var(--green-badge-bg); border-color: var(--green-deep); animation: cpop .4s ease; }
  /* mis: de twee kaarten schudden kort voor ze dichtklappen; match: ze 'klikken samen' */
  .mem-card.wrong { animation: memShake .4s ease; }
  @keyframes memShake { 0%,100% { transform: translateX(0); } 22% { transform: translateX(-5px); } 48% { transform: translateX(5px); } 74% { transform: translateX(-3px); } }
  .mem-card.snap { animation: memSnap .42s cubic-bezier(.2,1.4,.4,1); }
  @keyframes memSnap { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .mem-card.wrong, .mem-card.snap { animation: none; } }
  /* Memory-kaartjes zijn klein: elke weergave krijgt een eigen compacte maat die
     écht binnen de kaart past (geen transform:scale -- dan blijft de layout-box
     te groot en wordt de inhoud afgekapt). */
  .mem-face .cg-obj { font-size: clamp(12px, 3.6vw, 17px); font-size: 13cqw; }
  .mem-face .ct-num { font-size: clamp(26px, 10vw, 40px); font-size: 30cqw; font-weight: 700; color: var(--purple-shadow); }
  .mem-face .cgroup { gap: 2px 3px; max-width: 96%; }
  .mem-face .cframe { gap: 2.5px; }
  .mem-face .cframe .tf-cell { width: 12px; height: 12px; width: 12cqw; height: 12cqw; border-width: 1.5px; border-radius: 4px; }
  /* een voorwerp ín een raamvakje moet in dat vakje passen -- losse groepjes
     (.cgroup, hierboven) mogen juist groter */
  .mem-face .cframe .cg-obj { font-size: 8cqw; }
  .mem-face .dframe { column-gap: 2.5px; row-gap: 3px; }
  .mem-face .dframe .df-cell { width: 10px; height: 10px; width: 10cqw; height: 10cqw; border-width: 1px; border-radius: 3px; }
  .mem-done { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(24,6,44,.55); z-index: 40; }
  .mem-done-card { background: var(--c-white); border-radius: var(--r-lg); padding: 22px 26px; text-align: center; box-shadow: var(--e-3); }
  .mem-done-title { font-size: 54px; line-height: 1; }
  .mem-done-earn { margin: 12px auto 4px; }
  .mem-done-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  /* op smalle schermen: show compacter zodat het rekenen prominent blijft */
  @media (max-width: 720px) {
    .game-arena { gap: 10px; }
    .show-stage { width: 175px; height: 147px; }
    .question-card { font-size: clamp(38px, 12vw, 56px); padding: 14px 22px 24px; }
  }
  /* op lage schermen alles compacter: som + alle antwoorden moeten ALTIJD
     zonder scrollen in beeld staan */
  @media (max-height: 700px) {
    .show-stage { width: 145px; height: 122px; }
    .game-arena { gap: 6px; margin-top: 2px; }
    .question-card { font-size: clamp(30px, 9vw, 44px); padding: 11px 18px 21px; margin-bottom: 5px; }
    .gold-banner { height: 18px; font-size: 14.5px; margin-top: 2px; }
    .replay-btn { width: 40px; height: 40px; font-size: 19px; margin: 2px auto 0; }
    .choice-btn { padding: 12px 8px; font-size: 27px; }
    .choices { gap: 10px; }
    .num-btn { padding: 9px 0; font-size: 23px; }
    .numpad { gap: 8px; }
    .count-tile { min-height: 62px; padding: 8px 6px; }
    .count-tiles { gap: 9px; }
    .count-tiles.three { gap: 7px; }
    .cgroup.big .cg-obj { font-size: 38px; }
    .count-tile .cg-obj { font-size: 23px; }
    .count-q { min-height: 66px; }
    .cframe.big .tf-cell { width: 29px; height: 29px; }
    .cq-bignum { font-size: clamp(44px, 13vw, 68px); }
    .sum-num { font-size: clamp(26px, 7vw, 38px); }
    .sum-eq .cgroup.big .cg-obj { font-size: clamp(19px, 5vw, 26px); }
  }
  /* Ruimte over? Dan groeit de sóm, niet de paspop. De paspop is decor; de
     vraagkaart is waar het kind naar moet kijken -- en die was op een telefoon
     (99px hoog) juist kleiner dan het decor ernaast (147px). */
  @media (min-height: 780px) {
    .question-card { font-size: clamp(46px, 13vw, 62px); padding: 22px 30px 30px; }
  }
  @media (min-width: 900px) and (min-height: 760px) {
    .show-stage { width: 240px; height: 202px; }
    .question-card { font-size: clamp(50px, 6vw, 68px); }
  }

  /* feedback-kaarten (praise/toast): kregen vroeger een vaste viewport-%
     positie, wat ze op elk formaat over de paspop/avatar heen liet vallen
     zodra de tekst iets langer was. Tijdens het spel ("docked", zie JS)
     hangen ze nu vlak onder de vaste kop, altijd vrij van de paspop; op de
     andere schermen (kaart, kleedkamer, trofeeën, winkel, instellingen)
     blijft de bestaande losse positie -- daar was geen overlap-probleem. */
  .praise {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(.7);
    z-index: 60; opacity: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: rgba(48,10,80,.94);
    border: 1.5px solid rgba(255,224,130,.5); border-radius: var(--r-md); padding: 12px 22px 14px;
    box-shadow: var(--e-2), 0 0 22px rgba(255,193,7,.25);
    max-width: min(84vw, 320px);
  }
  /* gedockte kaart is compacter dan de losse variant (kleiner pilletje,
     minder padding) -- moet altijd tussen kop en paspop passen, ook op
     smallere formaten waar de paspop hoger in het scherm begint */
  .praise.docked {
    top: 98px; transform: translateX(-50%) scale(.7); gap: 5px; padding: 9px 18px 11px;
  }
  .praise.docked .earn-chip { font-size: 14px; padding: 5px 12px; }
  .praise-headline {
    font-size: clamp(19px, 5.4vw, 25px); font-weight: 700; color: var(--gold-light);
    text-shadow: 0 0 12px var(--gold-cta-bottom), 0 2px 0 var(--glass-black-40);
    text-align: center; text-wrap: balance; line-height: 1.15;
  }
  .praise.pop { animation: praisePop .9s cubic-bezier(.22,1.1,.4,1) forwards; }
  .praise.docked.pop { animation-name: praisePopDocked; }
  @keyframes praisePop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); }
    55% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
    80% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-64%) scale(1); }
  }
  @keyframes praisePopDocked {
    0% { opacity: 0; transform: translateX(-50%) scale(.7) translateY(-6px); }
    55% { opacity: 1; transform: translateX(-50%) scale(1.05) translateY(0); }
    80% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-10px); }
  }
  .toast {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%) translateY(-8px);
    z-index: 60; display: none; opacity: 0;
    flex-direction: column; align-items: center; gap: 2px; text-align: center;
    background: rgba(43,7,71,.94);
    border: 1.5px solid var(--glass-white-16); border-radius: var(--r-md); padding: 11px 20px 12px;
    box-shadow: var(--e-2);
    max-width: min(88vw, 360px);
    pointer-events: none;
  }
  .toast.docked { top: 98px; }
  .toast.show { display: flex; animation: toastIn .3s ease forwards; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .toast-main { font-size: clamp(16px, 4.6vw, 19px); font-weight: 700; color: var(--c-white); line-height: 1.3; text-wrap: balance; }
  .toast-sub { font-size: 13px; font-weight: 600; color: var(--c-white); opacity: .75; margin-top: 1px; }
  /* op lage schermen zit de paspop al vlak onder de kop (zie .show-stage
     hierboven) -- de gedockte kaart moet dan even compact zijn om de
     ruimte ertussen niet te overschrijden */
  @media (max-height: 700px) {
    .praise.docked, .toast.docked { top: 94px; padding: 5px 13px 6px; gap: 2px; }
    .praise.docked .praise-headline { font-size: 13px; }
    .praise.docked .earn-chip { font-size: 10px; padding: 2px 7px; }
    .toast.docked .toast-main { font-size: 14px; }
    .toast.docked .toast-sub { font-size: 10px; margin-top: 0; }
  }
  /* "tik om verder te gaan": een onzichtbare, schermvullende laag ónder de
     toast (die zelf pointer-events:none heeft, dus een tik daarop valt door
     naar deze laag) zodat een kind overal mag tikken, niet precies op de
     kleine bubbel zelf moet mikken. */
  .tap-veil { position: fixed; inset: 0; z-index: 59; display: none; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(7px); }
  }
  /* Zachte "foute noot": een korte kanteling, geen schud. Duurde .7s en dat is
     lang genoeg om als straf te lezen; op .42s is het een hoofdschudden en is de
     som daarna meteen weer gewoon leesbaar. */
  .wobble { animation: wobble .42s ease; }
  @keyframes wobble {
    0%,100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-2.4deg) scale(.985); }
    60% { transform: rotate(2deg) scale(.995); }
    85% { transform: rotate(-1deg); }
  }
  @media (prefers-reduced-motion: reduce) { .wobble { animation: none; } }
  .slip-note {
    position: fixed; left: 50%; top: 34%; transform: translateX(-50%);
    font-size: 52px; z-index: 60; pointer-events: none; opacity: 0;
  }
  .slip-note.go { animation: slipNote 1.6s ease forwards; }
  @keyframes slipNote {
    0% { opacity: 0; transform: translate(-50%, 0) rotate(0); }
    20% { opacity: 1; transform: translate(-50%, 6px) rotate(-8deg); }
    100% { opacity: 0; transform: translate(-50%, 90px) rotate(30deg); }
  }

  /* ---- Gouden vraag ---- */
  .question-card.golden {
    background: var(--gold-accent);
    color: var(--ink-on-gold-card); box-shadow: 0 0 26px rgba(255,193,7,.9), 0 8px 20px var(--glass-black-30);
    animation: goldGlow 1s ease-in-out infinite alternate;
  }
  @keyframes goldGlow { from { box-shadow: 0 0 18px rgba(255,193,7,.7), 0 8px 20px var(--glass-black-30); } to { box-shadow: 0 0 34px rgba(255,193,7,1), 0 8px 20px var(--glass-black-30); } }
  .gold-banner { font-size: 18px; font-weight: 700; color: var(--gold-light); text-shadow: 0 0 10px var(--gold-cta-bottom); margin-top: 6px; height: 22px; }

  /* ---- Wereldtournee: één wereld per scherm, volledig in beeld ----
     Er valt niets te scrollen. Het kader (.world-frame) heeft de beeldverhouding
     van de wereldtekening en wordt met container-query-eenheden precies ingepast
     in de ruimte die er is -- de CSS-versie van object-fit:contain, zonder een
     regel JavaScript. Wat overblijft aan de zijkanten is geen leegte maar de
     lucht van de wereld zelf (zie .tour-map).

     Alles bínnen het kader staat op percentages: de tekening, de weg (een SVG met
     exact dezelfde viewBox-verhouding) en de haltes. Daarom valt de weg op élk
     toestel precies op de haltes en op de tekening -- het klopt per constructie,
     niet per afstelling, en draaien of resizen vraagt geen herberekening. */
  .tour-map {
    position: absolute; inset: 0; z-index: 0; container-type: size;
    /* Verticaal safe center: staat het kader hóger dan het vak, dan zou gewoon center
       de bovenkant buiten het scrollbereik duwen en was halte 8 onbereikbaar.
       Horizontaal júist gewoon center: daar valt niets te scrollen (overflow-x is
