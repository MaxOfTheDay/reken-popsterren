        </div>
      </details>
    </div>
    <div class="set-card">
      <div class="set-card-head"><div class="ico">🧹</div><div><h2>Opnieuw beginnen</h2><div class="sub">Alleen voor ${esc(p.name)}</div></div></div>
      <div class="note">De instellingen hierboven (modus, bereik, fases) blijven gewoon staan — alleen de voortgang verdwijnt.</div>
      <!-- rode vlak bestaat pas als een ouder er zelf om vraagt; een permanent
           zichtbare wisknop hoort niet tussen gewone instellingen te staan -->
      <details class="danger-reveal" id="set-danger">
        <summary>Voortgang wissen…</summary>
        <div class="danger-zone">
          <div><div class="t">⚠️ Voortgang wissen</div><div class="d">Verwijdert alle diamanten, sterren en spulletjes van ${esc(p.name)}. Kan niet ongedaan gemaakt worden.</div></div>
          <button class="danger-btn" id="set-reset">Wissen</button>
        </div>
      </details>
    </div>
    <div class="sheet-rule"><span>Voor alle sterren</span></div>
    ${appWideCardsHtml(true)}
  </div>`;
}

// Feedback wanneer een meerkeuze-chip niet uit mag (de laatste blijft altijd aan).
function blockedMinOne(el) {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  showToast('Kies er minstens 1 👆');
  setTimeout(hideToast, 1500);
}
// gewone instellingen slaan meteen op -- geen aparte "Opslaan"-knop nodig,
// alleen een kort, subtiel pilletje in de kop dat het bevestigt
// Bij een wissel van onderdeel bovenaan beginnen: van een lang paneel naar een
// kort paneel landde je anders halverwege. Twee keer, want de nieuwe inhoud staat
// er pas na de hertekening.
function settingsToTop() {
  const el = $('screen-settings');
  if (!el) return;
  el.scrollTop = 0;
  requestAnimationFrame(() => { el.scrollTop = 0; });
}
let savedPillTimer = null;
function saveAndFlash() {
  save();
  const el = $('settings-saved');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(savedPillTimer);
  savedPillTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
// De drie onderdelen van het ouderdeel. Waarde = staat, label = wat er staat.
const SET_TABS = [['voortgang', 'Voortgang'], ['oefenen', 'Oefenen'], ['beheer', 'Beheer']];
// Alleen naar boven springen als het ónderdeel wisselt, niet bij elke chip-tik.
let lastWhoRendered = null;

/* Niveau 1 -- wíé: open rij portretten, geen omsloten spoor. Dit is dezelfde
   scrollende pil-rij als de kleedkamer (.tab-btn + hscroll-fade + updateFades),
   met het echte avatar-portret erin i.p.v. voor elk kind hetzelfde sterretje.
   Niveau 2 (het onderdeel) blijft een .segmented-spoor; twee vormen, twee
   betekenissen -- hiervoor stonden er twee identieke sporen op elkaar. */
function renderWhoRow() {
  const row = $('settings-profiles');
  const keep = row.scrollLeft;          // niet terugspringen bij elke hertekening
  row.innerHTML = '';
  let active = null;
  for (const key of profileKeys()) {
    const pr = db.profiles[key];
    const on = key === setKey;
    const b = document.createElement('button');
    b.className = 'tab-btn who-btn' + (on ? ' active' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = `<span class="who-portrait" aria-hidden="true">${avatarSVG(pr, 65)}</span>`
      + `<span class="tab-label">${esc(pr.name)}</span>`;
    b.onclick = () => { sndClick(); setKey = key; renderSettings(); };
    row.appendChild(b);
    if (on) active = b;
  }
  row.onscroll = () => updateFades(row);
  row.scrollLeft = keep;
  updateFades(row);
  // alleen bij een échte wissel het gekozen kind in beeld trekken
  if (active && lastWhoRendered !== setKey) requestAnimationFrame(() => {
    if (!active.isConnected) return;
    active.scrollIntoView({ block: 'nearest', inline: 'center' });
    updateFades(row);
  });
  lastWhoRendered = setKey;
}

/* Niveau 2 -- wát: Voortgang | Oefenen | Beheer. Bewust zonder emoji: drie
   labels mét icoon passen niet in het 460px-spoor op een 320px-telefoon (~333px
   nodig, 288px beschikbaar), en zonder is het bovendien rustiger. De iconen
   blijven wél op de kaartkoppen staan, waar ze iets betekenen. */
function renderSectionTabs() {
  const t = $('settings-subtabs');
  t.innerHTML = SET_TABS.map(([v, label]) =>
    `<button class="${setTab === v ? 'on' : ''}" role="tab" aria-selected="${setTab === v}" data-t="${v}">${label}</button>`).join('');
  t.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.t === setTab) return;
    sndClick(); setTab = b.dataset.t; renderSettings(); settingsToTop();
  });
}

function renderSettings() {
  // De selectie kan naar een verdwenen ster wijzen (net verwijderd, of een import
  // met andere sleutels): altijd eerst terugvallen op wie er wél is.
  if (!setKey || !db.profiles[setKey]) setKey = profileKeys()[0] || null;
  const p = setKey ? db.profiles[setKey] : null;
  // Zonder ster is er niets om "wiens" of "wat daarover" mee te kiezen; die twee
  // rijen verdwijnen dan in plaats van leeg te blijven staan.
  $('settings-profiles').style.display = p ? '' : 'none';
  $('settings-subtabs').style.display = p ? '' : 'none';
  if (!p) {
    setTab = 'beheer';
    $('settings-profiles').innerHTML = '';
    $('settings-subtabs').innerHTML = '';
    $('settings-body').innerHTML = beheerEmptyHtml();
    bindSettings(null, null);
    return;
  }
  renderWhoRow();
  renderSectionTabs();
  const s = p.settings;
  $('settings-body').innerHTML =
      setTab === 'oefenen' ? oefenenPanelHtml(p, s)
    : setTab === 'beheer'  ? beheerPanelHtml(p)
    :                        statsPanelHtml(p);
  bindSettings(p, s);
}

/* Elk onderdeel toont maar een déél van de bedieningen, dus alles wordt alleen
   gebonden als het er ook echt staat. Vijf regels deden dat hiervoor niet
   ($('set-name') e.d. zonder controle) -- die wierpen meteen een TypeError zodra
   een paneel ze niet bevat, waarna de rest van de bindingen stilletjes wegviel. */
/* De bediening bij oefenGroups, gedeeld door het ouderdeel en het maakformulier.

   p mag null zijn: bij het maken bestáát er nog geen ster om countTrack op bij
   te stellen (defaultProfile leidt die straks zelf af uit opts.stage).
   done(id) is wat er ná een geslaagde wijziging moet gebeuren -- opslaan +
   hertekenen in het ouderdeel, alleen hertekenen op het maakformulier -- en
   krijgt de groep mee, zodat de aanroeper kan zien wát er veranderde.
   Een handler die de wijziging wéigert geeft false terug; dan volgt er geen
   done() (de "kies er minstens 1"-schud sloeg het opslaan hiervoor ook over). */
function bindOefenChips(s, p, pfx, done) {
  const bind = (id, fn) => {
    const el = $((pfx || '') + id);
    if (el) el.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (fn(c) !== false) done(id); });
  };
  // meerkeuze-chips (aan/uit) -- de laatst overgebleven mag niet uit (er moet altijd
  // iets geoefend worden); dat blokkeren gebeurde eerst stilletjes, nu met een
  // duidelijke schud + tekstje zodat het niet als "kapot" aanvoelt
  bind('set-ops', c => {
    const v = c.dataset.v;
    if (s.ops.includes(v)) {
      if (s.ops.length > 1) s.ops = s.ops.filter(o => o !== v);
      else return blockedMinOne(c), false;
    } else s.ops.push(v);
  });
  bind('set-tables', c => {
    const v = parseInt(c.dataset.v, 10);
    if (s.tables.includes(v)) {
      if (s.tables.length > 1) s.tables = s.tables.filter(t => t !== v);
      else return blockedMinOne(c), false;
    } else s.tables.push(v);
  });
  // enkelkeuze-chips
  bind('set-max', c => { s.max = parseInt(c.dataset.v, 10); });
  bind('set-mode', c => { s.mode = c.dataset.v; });
  bind('set-perlevel', c => { s.perLevel = parseInt(c.dataset.v, 10); });
  // los aan/uit-schakelbare extra uitdagingen (elk onafhankelijk, standaard aan)
  bind('set-extra', c => {
    const k = c.dataset.v;
    s[k] = (s[k] === false);   // was aan (≠ false) → uit; was uit → aan
  });
  // telmodus-instellingen
  bind('set-stage', c => {
    const v = parseInt(c.dataset.v, 10);
    s.stage = v;
    if (s.stageMax < v) s.stageMax = v;                 // plafond mag niet onder de start
    if (p) {
      if (!p.countTrack) p.countTrack = { stage: v, rung: 0, streak: 0, seen: 0, acc: 0.5 };
      p.countTrack.stage = Math.min(Math.max(p.countTrack.stage, v), countMaxStage(s)); // live-stand binnen bereik
    }
  });
  bind('set-stagemax', c => {
    const v = parseInt(c.dataset.v, 10);
    s.stageMax = v;
    if (s.stage > v) s.stage = v;                       // start mag niet boven het plafond
    if (p && p.countTrack) p.countTrack.stage = Math.min(p.countTrack.stage, countMaxStage(s));
  });
  bind('set-numerals', c => {
    // Alleen de vlag omzetten -- de bovengrens (cijfers-uit → fase 5) wordt niet-
    // destructief afgedwongen via countMaxStage (chip-weergave + countLiveStage),
    // zodat het weer aanzetten de fase-instelling volledig terugbrengt.
    s.numerals = (c.dataset.v === 'on');
  });
  bind('set-qmax', c => { s.qmax = parseInt(c.dataset.v, 10); });
  bind('set-memory', c => { s.memory = (c.dataset.v === 'on'); });
  bind('set-repr', c => { s.repr = c.dataset.v; });
}
function bindSettings(p, s) {
  const bind = (id, fn) => { const el = $(id); if (el) el.querySelectorAll('.chip').forEach(c => c.onclick = () => fn(c)); };
  const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };
  on('set-name', 'oninput', e => {
    p.name = e.target.value.trim() || p.name;
    saveAndFlash();
    // de naam staat ook in de kiezer hierboven: die meteen laten meelopen, zonder
    // hertekenen (dat zou de focus uit het invulveld halen)
    const lbl = $('settings-profiles').querySelector('.active .tab-label');
    if (lbl) lbl.textContent = p.name;
  });
  // het rode vlak openklappen mag ook hoorbaar zijn, net als elke andere tik
  // (er zijn er twee: voortgang wissen en de ster verwijderen)
  document.querySelectorAll('#settings-body .danger-reveal').forEach(dg => {
    dg.ontoggle = () => { if (dg.open) sndClick(); };
  });
  // modus: wisselen tussen de rekenshow en de lees-vrije telmodus. Blijft hier:
  // de moduskaart hoort bij het ouderdeel (het maakformulier heeft zijn eigen
  // #newstar-track vlak boven de openklapper).
  bind('set-track', c => { s.track = c.dataset.v; if (s.track === 'count' && !p.countTrack) p.countTrack = { stage: s.stage, rung: 0, streak: 0, seen: 0, acc: 0.5 }; saveAndFlash(); renderSettings(); });
  // De velden zelf staan óók op het maakformulier; de bediening is gedeeld.
  // Het maakformulier heeft niets op te slaan, dus wat er ná een wijziging
  // gebeurt komt van de aanroeper (hier: opslaan + hertekenen).
  bindOefenChips(s, p, '', () => { saveAndFlash(); renderSettings(); });
  on('set-reset', 'onclick', () => {
    showConfirm(
      '⚠️ Weet je het zeker?',
      `Alle voortgang, diamanten en spulletjes van ${p.name} wissen? Dit kan niet ongedaan gemaakt worden.`,
      'Ja, wissen',
      () => {
        // Wissen raakt de voortgang, niet wie ze is en niet hoe ze oefent: haar
        // startoutfit, plek in de rij én álle instellingen gaan mee. Dat gold
        // eerder alleen voor de telmodus -- in de rekenmodus vielen bewerkingen,
        // bereik, tafels, antwoordmethode en de extra uitdagingen stilletjes terug
        // op de standaardwaarden, terwijl de waarschuwing dat niet zei.
        const dress = p.startDress || p.equipped.dress || 'dress_roze';
        // settings kent geen haar en geen basisfiguur, dus zonder dit werd een
        // bruinharige ster blond en een jongen een meisje
        const opts = { ...p.settings, hair: p.startHair || 'hair_blond', base: p.base };
        const order = p.order;
        db.profiles[setKey] = defaultProfile(p.name, dress, opts);
        db.profiles[setKey].order = order;   // plek in de rij behouden na een reset
        save(); renderSettings();
        showToast('✅ Voortgang gewist.');
        setTimeout(hideToast, 1800);
      }
    );
  });
  on('set-newstar', 'onclick', () => openNewStar('settings'));
  on('set-delete', 'onclick', () => {
    showConfirm(
      '⚠️ Ster verwijderen?',
      `${p.name} helemaal verwijderen, met alle voortgang, diamanten en spulletjes? Dit kan niet ongedaan gemaakt worden.`,
      'Ja, verwijderen',
      () => {
        const naam = p.name;
        delete db.profiles[setKey];
        if (cur === setKey) cur = null;      // niet met een verdwenen ster verder spelen
        setKey = profileKeys()[0] || null;
        lastWhoRendered = null;              // de kiezer moet opnieuw naar de nieuwe keuze scrollen
        save();
        if (setKey) renderSettings();
        else closeSettings();                // laatste ster weg -> terug naar het welkomscherm
        showToast(`✅ ${esc(naam)} is verwijderd.`);
        setTimeout(hideToast, 1800);
      }
    );
  });
  on('set-export', 'onclick', exportData);
  on('set-import', 'onclick', () => { const f = $('set-import-file'); if (f) f.click(); });
  on('set-import-file', 'onchange', e => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';   // zelfde bestand opnieuw kunnen kiezen
  });
}

// Alle profielen + instellingen als JSON-bestand downloaden.
function exportData() {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  // tot op de seconde: met alleen een datum overschreef een tweede back-up op
  // dezelfde dag de eerste in de downloadmap
  const stamp = new Date().toISOString().slice(0, 19).replace('T', '-').replace(/:/g, '');
  a.href = url;
  a.download = `reken-popsterren-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Een eerder opgeslagen back-upbestand inlezen en terugzetten. Overschrijft
// ALLE huidige profielen, dus (net als bij wissen) eerst een bevestiging --
// pas ná "ja" wordt de huidige voortgang echt vervangen.
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
      // Hiervoor stond hier "heeft p1 én p2". Die sleutels zijn niet meer heilig:
      // een familie kan één ster hebben, of vijf, of er net eentje verwijderd
      // hebben. Dus kijken we naar de vórm van elk profiel in plaats van naar de
      // namen van de sleutels -- en meteen streng genoeg dat migrate() er verderop
      // niet op stukloopt. Een lege back-up (familie wiste iedereen) mag ook;
      // data.sound is dan het merkteken dat dit een bestand van óns is.
      const profs = data && typeof data === 'object' ? data.profiles : null;
      const okShape = p => !!p && typeof p === 'object' && typeof p.name === 'string'
        && Array.isArray(p.owned) && !!p.stars && typeof p.stars === 'object'
        && !!p.equipped && typeof p.equipped === 'object';
      const ok = profs && typeof profs === 'object' && !Array.isArray(profs)
        && Object.values(profs).every(okShape)
        && (Object.keys(profs).length > 0 || typeof data.sound === 'boolean');
      if (!ok) throw new Error('ongeldig back-upbestand');
    } catch (e) {
      showNotice('Oeps!', 'Kon dit bestand niet lezen. Kies een geldig back-upbestand.');
      return;
    }
    showConfirm(
      '📂 Back-up terugzetten?',
      'Dit vervangt de huidige diamanten, sterren en spulletjes van alle profielen door de inhoud van dit back-upbestand. Dit kan niet ongedaan gemaakt worden.',
      'Ja, terugzetten',
      () => {
        // Eerst in een lokale kopie bijwerken en pas daarna de echte db vervangen:
        // migrate() kan op een beschadigd profiel gooien, en dat gebeurde hiervoor
        // ná "db = data" -- dan was de app dood terwijl de opslag nog goed was.
        const next = data;
        if (typeof next.sound !== 'boolean') next.sound = true;
        if (typeof next.haptics !== 'boolean') next.haptics = true;
        try { Object.values(next.profiles).forEach(migrate); }
        catch (e) { showNotice('Oeps!', 'Dit back-upbestand is beschadigd; er is niets veranderd.'); return; }
        db = next;             // normalizeProfiles leest de globale db
        normalizeProfiles();
        cur = null;
        setKey = profileKeys()[0] || null;   // selectie kan naar een verdwenen sleutel wijzen
        lastWhoRendered = null;
        save();
        showNotice('🎉 Gelukt!', 'Back-up geladen!');
        renderSettings();
      }
    );
  };
  reader.onerror = () => showNotice('Oeps!', 'Kon dit bestand niet lezen.');
  reader.readAsText(file);
}

/* ================= Terug-navigatie (Android back / browser back) =================
   Er is maar één URL, dus normaal ook maar één history-entry: zonder deze laag
   zou de systeem-terugknop de app altijd meteen verlaten, ook middenin een show
   of met een overlay open. Schermen zelf in de history coderen kan niet zomaar:
   de spel-toestand (G/M) leeft alleen in het geheugen en wordt bij afsluiten op
   null gezet, dus een teruggehaald "spel"-scherm zou een kapotte staat tonen.
   In plaats daarvan is history hier puur een signaal: één wachtpost-entry, enkel
   aanwezig zolang terug ook echt iets betekent. Wát die druk betekent, wordt bij
   elke druk opnieuw afgelezen uit de bestaande app-status -- dezelfde variabelen
   die de zichtbare ✕/←-knoppen ook gebruiken, dus geen aparte "stack" die uit de
   pas kan lopen met wat er werkelijk op het scherm staat. */

// Kleedkamer-teruggids: zelfde bestemming voor het zichtbare kopje als voor Android-terug.
function dressBack() { (dressReturnTo === 'trophies' ? openTrophies : goMap)(); }

function backTarget() {
  // 1) een open modal/overlay/menu sluiten -- de onderliggende schermstatus blijft ongemoeid.
  //    (":not(.closing)" want de drie hieronder faden al enkele honderden ms uit; een druk
  //    tijdens die overgang moet niet nogmaals "sluiten", maar meteen de vólgende laag raken.)
  const modal = document.querySelector('.modal-bg.open');
  if (modal) return modal.id === 'quit-modal' ? closeQuitModal : closeConfirmModal;
  const rankup = document.querySelector('.rankup-overlay:not(.closing)');
  if (rankup) return rankup._close;
  const career = document.querySelector('.career-overlay:not(.closing)');
  if (career) return career._close;
  const pop = document.querySelector('.trophy-pop-overlay:not(.closing)');
  if (pop) return pop._close;
  if ($('gear-menu').classList.contains('open')) return closeGearMenu;
  if ($('mem-done').style.display === 'flex') return exitMemory;
  // 2) één stap terug binnen hetzelfde scherm -- het enige echt geneste geval:
  //    een los stuk vanuit Looks openen keert terug naar diezelfde Looks-lijst.
  if ($('screen-dress').classList.contains('active') && shopBackToLooks) {
    return () => {
      shopBackToLooks = false; shopView = 'looks'; shopSelectedId = null; renderShop();
      requestAnimationFrame(() => { $('screen-dress').scrollTop = looksScroll; });
    };
  }
  // 3) het huidige scherm verlaten naar zijn eigen ouder -- exact dezelfde bestemming
  //    als de zichtbare ✕/←/tab-knop op dat scherm (nooit twee betekenissen van "terug").
  if ($('screen-game').classList.contains('active')) return askQuit;
  if ($('screen-end').classList.contains('active')) return goMap;
  if ($('screen-memory').classList.contains('active')) return exitMemory;
  if ($('screen-settings').classList.contains('active')) return closeSettings;
  if ($('screen-newstar').classList.contains('active')) return closeNewStar;
  if ($('screen-dress').classList.contains('active')) return dressBack;
  if ($('screen-trophies').classList.contains('active')) return goMap;
  if ($('screen-map').classList.contains('active')) return goProfiles;
  return null;   // screen-profile, niets open: dit ís de bodem -- browser/PWA handelt terug zelf verder af
}

let backGuardArmed = false, syncingBackGuard = false, backSyncQueued = false;
// Zorgt dat er precies dan een "wachtpost"-entry op de history staat als backTarget()
// iets teruggeeft. Eén tussenstap (bv. openSettings() dat eerst closeGearMenu() aanroept
// en pas dáárna show() naar het echte scherm) kan tussentijds heel even "niks" laten
// lijken; history.back() is bovendien async terwijl pushState synchroon is, dus een
// directe her-bewapening zou daarmee kunnen botsen. Daarom pas ná de huidige batch
// synchrone DOM-wijzigingen checken (via microtask): alle syncBackGuard()-aanroepen
// in dezelfde beurt smelten zo samen tot één beslissing op de uiteindelijke status.
// Microtasks legen zich altijd vóór de vólgende popstate-taak, dus twee snelle
// druk-op-druk-keren kunnen elkaar hierdoor nooit inhalen.
function syncBackGuard() {
  if (backSyncQueued) return;
  backSyncQueued = true;
  queueMicrotask(() => {
    backSyncQueued = false;
    const want = !!backTarget();
    if (want === backGuardArmed) return;
    if (want) { history.pushState({ rpGuard: 1 }, ''); backGuardArmed = true; }
    else { syncingBackGuard = true; history.back(); }
  });
}
window.addEventListener('popstate', () => {
  backGuardArmed = false;                                       // onze entry is net verbruikt
  if (syncingBackGuard) { syncingBackGuard = false; return; }    // wíj stuurden dit terug, niet de speler
  const act = backTarget();
  if (act) { act(); syncBackGuard(); }
});
// Na terugkeer uit de bfcache (bv. via Recents) kan de wachtpost-entry intussen
// alweer weg zijn -- lees de status dan opnieuw af i.p.v. hem zomaar aan te nemen.
window.addEventListener('pageshow', () => { backGuardArmed = !!(history.state && history.state.rpGuard); syncBackGuard(); });
// Escape is dezelfde intentie als terug, ook zonder touchscherm.
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const act = backTarget(); if (act) act(); } });

/* ================= Start ================= */
load();
renderProfiles();
syncBackGuard();
/* ---- Ontwikkelaarsschakelaars (alleen met ?debug in de URL) ----
   Bestaat om twee redenen: de geautomatiseerde tests kijken via __game() in de
   lopende show mee, en wie aan het uiterlijk werkt moet élk scherm kunnen zien
   zonder eerst een half uur te spelen. In het gewone spel bestaat dit blok niet.

   ?debug            -- zet de schakelaars aan
   &demo             -- vult twee voorbeeldsterren (Lotte: rekenen, stad 6 ·
                        Sem: tellen, stad 2). ALLEEN in het geheugen: er wordt
                        niets opgeslagen, dus een echte familie-opslag op
                        hetzelfde toestel blijft ongemoeid.
   &star=p1|p2       -- welke voorbeeldster meteen geselecteerd wordt
   &stage=<item-id>  -- forceer een podium (bv. stage_vulkaan)
   &screen=<naam>    -- spring meteen naar map | dress | tro | game | end
   &mapedit          -- wereldstudio: haltes verslepen over de kaart, een
                        kandidaat-tekening laden en de punten kopieren naar
                        WORLDS (zie startMapEdit hieronder)                    */
if (location.search.indexOf('debug') !== -1) {
  const dbg = new URLSearchParams(location.search);
  if (loadWorldDraft()) console.log('wereldconcept uit localStorage geladen (' + WORLDS.length + ' werelden)');
  window.__game = () => G;
  window.__db = () => db;
  if (dbg.has('demo')) {
    // Geen save(): dit is een kijk-opstelling, geen opslag. Bij herladen wordt
    // ze gewoon opnieuw uit de URL opgebouwd.
    db.sound = false; db.haptics = false;
    const a = defaultProfile('Lotte', 'dress_roze', { hair: 'hair_blond' });
    a.order = 0; a.level = 6; a.diamonds = 240;
    a.stars = { 1: 3, 2: 3, 3: 2, 4: 3, 5: 2 };
    ['hair_regenboog', 'dress_disco', 'shoes_goud', 'mic_roze', 'stage_kasteel',
     'acc_kroon', 'pet_eenhoorn', 'instr_gitaar', 'stage_ruimte', 'stage_vulkaan',
     'dress_sterren', 'shoes_zwart', 'mic_goud'].forEach(id => a.owned.push(id));
    a.equipped = { hair: 'hair_regenboog', dress: 'dress_disco', shoes: 'shoes_goud',
      mic: 'mic_roze', stage: 'stage_kasteel', acc: 'acc_kroon',
      pet: 'pet_eenhoorn', instrument: 'instr_gitaar' };
    a.trophies = ['first', 'rookie3', 'city5', 'sums25', 'perfect1'];
    a.readyTrophies = ['perfect3'];
    a.goldHits = 7; a.encores = 3; a.rankSeen = 2;
    a.stats = { correct: 180, wrong: 22 };
    const c = defaultProfile('Sem', 'dress_blauw',
      { hair: 'hair_bruin', base: 'jongen', track: 'count', stage: 3 });
    c.order = 1; c.level = 2; c.diamonds = 35; c.stars = { 1: 2 };
    c.owned.push('mic_zilver'); c.equipped.mic = 'mic_zilver';
    c.trophies = ['first']; c.stats = { correct: 12, wrong: 4 };
    db.profiles = { p1: a, p2: c };
    renderProfiles();
  }
  const star = dbg.get('star');
  if (star && db.profiles[star]) {
    cur = star;
    const forced = dbg.get('stage');
    if (forced && item(forced)) {
      if (!P().owned.includes(forced)) P().owned.push(forced);
      P().equipped.stage = forced;
    }
    const go = { map: goMap, dress: openKleedkamer, tro: openTrophies,
                 game: () => startLevel(P().level),
                 end: () => { startLevel(P().level); endLevel(true); } };
    (go[dbg.get('screen')] || goMap)();
  }
  if (dbg.get('fit')) fitVenster(dbg.get('fit'));
  if (dbg.has('mapedit') && cur) startMapEdit();
}
/* Een voorbeeldvenster op ware toestelmaat. window.open zet de BUITENmaat, en een
   browser mag daar een minimum op leggen -- dan kijk je naar een venster dat breder
   is dan de telefoon die je wilde zien, en dus naar de verkeerde opmaak. Hier
   corrigeert het venster zichzelf met het verschil tussen buiten en binnen, en zegt
   een balkje onderaan wat de binnenmaat écht geworden is. */
function fitVenster(spec) {
  const w = Number(spec.split('x')[0]), h = Number(spec.split('x')[1]);
  if (!w || !h) return;
  const meld = () => {
    const klopt = innerWidth === w && innerHeight === h;
    let el = document.getElementById('fit-badge');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fit-badge';
      el.style.cssText = 'position:fixed;left:50%;bottom:6px;transform:translateX(-50%);'
        + 'z-index:99999;padding:3px 9px;border-radius:99px;pointer-events:none;'
        + 'font:600 11px ui-monospace,monospace;';
      document.body.appendChild(el);
    }
    el.style.background = klopt ? 'rgba(20,80,45,.85)' : 'rgba(120,30,20,.9)';
    el.style.color = klopt ? '#b6ffd6' : '#ffd0c4';
    el.textContent = klopt ? innerWidth + ' x ' + innerHeight
      : 'gevraagd ' + w + 'x' + h + ' — werkelijk ' + innerWidth + 'x' + innerHeight;
  };
  try { resizeTo(w + (outerWidth - innerWidth), h + (outerHeight - innerHeight)); } catch (_) {}
  setTimeout(meld, 120);
  addEventListener('resize', () => setTimeout(meld, 60));
}

/* ---- Wereldstudio (?debug&mapedit) ------------------------------------------
   Werelden maken en bijwerken óp de echte kaart, op ware grootte.

   Drie dingen die je in de code niet fatsoenlijk kunt doen:
     - haltes op de richels van een tekening zetten (percentages schatten lukt niet)
     - de weg dáár langs laten lopen: elk stuk heeft een eigen stuurpunt, dus je
       kunt om een rots heen buigen in plaats van eroverheen
     - zien wat er nog níét in het spel staat, en het er in één tik in zetten

   Een concept leeft in localStorage en wordt ALLEEN met ?debug ingelezen: het
   gewone spel draait altijd op WORLDS uit index.html, dus een half afgemaakte
   wereld kan nooit bij een kind terechtkomen.                                  */
function startMapEdit() {
  const map = $('tour-map');
  const F = id => document.getElementById(id);
  /* Hoeveel er onderaan werkelijk wordt afgedekt: de navigatiebalk plus alles wat
     eronder zit (de 10px marge, en op een toestel met een thuisbalk ook
     env(safe-area-inset-bottom) -- dat zit al in de positie van de balk verwerkt).
     Méten en niet narekenen, en wél vóór de studio de balk verbergt. */
  const navRect = $('main-nav').getBoundingClientRect();
  const ONDER_PX = navRect.height ? (innerHeight - navRect.top) + 8 : 100;
  document.body.classList.add('mapedit');

  /* De voorvertoningsserver zet rechtsonder zijn eigen paneeltje neer met links
     naar de schermen. Die links dragen ?debug&demo&star=p1&screen=... en dus géén
     &mapedit -- één tik erop en de studio was weg zonder weg terug. */
  document.querySelectorAll('#kandidaat nav a').forEach(a => {
    if (a.getAttribute('href').indexOf('mapedit') < 0) a.href = a.getAttribute('href') + '&mapedit';
  });

  const st = document.createElement('style');
  st.textContent = `
    /* De ster staat in de studio uit -- ze dekt precies de richel af waar je een halte
       op probeert te zetten. Met "ster overal" komt ze terug, op élke halte, doorzichtig:
       dan zie je in één blik of ze overal past en of er overal lucht boven is. */
    body.mapedit .mem-fab, body.mapedit .tour-hero { display: none !important; }
    body.mapedit.sterren .tour-hero { display: block !important; }
    /* Het kandidaat-vak van de voorvertoningsserver (incoming/ + schermlinks) doet
       in de studio niets meer: beelden gaan via het Beelden-tabblad en schermen via
       Voorbeeld. Buiten de studio blijft het gewoon staan. */
    body.mapedit #kandidaat { display: none !important; }
    /* In de studio krijgt de kaart telefoon-verhoudingen. Op een breed scherm zou
       hij anders in de kolom-noodstand vallen, en dan zet je haltes neer op een
       vorm die geen enkel kind ooit ziet. */
    body.mapedit #screen-map { padding-right: var(--studio-w, 0px); }
    /* Een toestelmaat in de studio: het vak krijgt de échte pixelmaat van dat
       toestel en wordt daarna alleen visueel verkleind. De container-queries in de
       kaart rekenen met de onverkleinde maat, dus wat je ziet klopt met het toestel
       -- ook als je monitor geen 844 pixels hoog is.

       De doos staat in het midden van de ruimte die het paneel overlaat (--doos-x),
       niet meer tegen de linkerrand geplakt. */
    body.mapedit #tour-map { left: var(--doos-x, 24px); right: auto;
      width: var(--doos-w, min(430px, 60vw)); height: var(--doos-h, 100%);
      transform: scale(var(--doos-s, 1)); transform-origin: top left;
      box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 10px 40px rgba(0,0,0,.45); }
    /* De kop hoort óp het toestel te liggen, niet erboven te zweven: in het spel
       ligt hij over de tekening heen. Dus dezelfde plek, dezelfde breedte en
       dezelfde schaal als de doos. */
    body.mapedit #screen-map .hub-sticky { position: absolute; z-index: 7;
      left: var(--doos-x, 24px); top: 0; width: var(--doos-w, 430px);
      transform: scale(var(--doos-s, 1)); transform-origin: top left;
      align-self: auto; margin: 0; }
    /* En de navigatiebalk ook: in het spel staat hij onderaan hét scherm, hier
       onderaan de doos. */
    body.mapedit .main-nav { display: flex !important;
      position: absolute; left: var(--doos-x, 24px); bottom: auto; z-index: 7;
      top: calc(var(--doos-h, 100%) * var(--doos-s, 1) - 77px * var(--doos-s, 1));
      width: calc(var(--doos-w, 430px) - 24px); margin-left: calc(12px * var(--doos-s, 1));
      transform: scale(var(--doos-s, 1)); transform-origin: top left; pointer-events: none; }
    body.mapedit.geen-kop #screen-map .hub-sticky,
    body.mapedit.geen-balk .main-nav { display: none !important; }
    /* De kolom-noodstand kijkt naar het vénster, niet naar dit vak -- op een breed
       bureaublad zou hij dus altijd aanslaan. Hier staat hij uit: het vak heeft al
       telefoon-verhoudingen, dus full-bleed is precies wat een kind straks ziet. */
    body.mapedit #tour-map { overflow: hidden; align-items: safe center; padding: 0; }

    /* De kop ligt nu absoluut op de doos (zie de regel hierboven), dus hij hoeft niet

    @media (max-width: 820px) {

    /* Stuurpunt van één stuk weg: klein, ruitvormig, duidelijk iets ánders dan een

    .me-ctrl { position: absolute; width: 5.4cqw; height: 5.4cqw; margin: -2.7cqw 0 0 -2.7cqw;

    const art = F('mf-art').value.trim();

      const kanon = 'assets/world/' + oudId + '-map.webp';

  function redrawRoad() {
    const frame = map.querySelector('.world-frame');
    if (!frame) return;
    const pts = leesNodes().map(n => ({ x: vbx(n.x), y: vby(n.y) }));
    const c = leesCurve();
    const bg = frame.querySelector('.tour-road-bg'), fg = frame.querySelector('.tour-road-fg');
    const un = frame.querySelector('.tour-road-under');
    const svg = frame.querySelector('.tour-road-svg');

    if (bg) { bg.setAttribute('d', roadD(pts, pts.length, c));

    if (fg) { fg.setAttribute('d', roadD(pts, tot, c));

  function decorate() {
    const frame = map.querySelector('.world-frame');
    if (!frame) return;
    /* De veilige zone staat standaard aan: dat is de één regel die je nodig hebt
       terwijl je haltes neerzet. Het raster van 10% is er los bij, voor wie een
       tekening wil uitmeten. */
    if (zoneOn) {
      const d = document.createElement('div');
      d.className = 'me-safe';
      d.style.left = ZONE.x0 + '%';
      d.style.right = (100 - ZONE.x1) + '%';
      d.style.top = ZONE.y0 + '%';
      d.style.bottom = (100 - ZONE.y1) + '%';
      frame.appendChild(d);
      /* de snede van de langste telefoon: 11,9% per kant (gemeten op 412x961) */
      const sn = document.createElement('div');
      sn.className = 'me-snee';
      sn.style.left = '11.9%';
      sn.style.right = '11.9%';
      sn.innerHTML = '<span>zichtbaar op elk toestel</span>';
      frame.appendChild(sn);
      /* de strook waar een halte mag staan maar de bovenbalk voor de ster opzij gaat */
      const kb = document.createElement('div');
      kb.className = 'me-kopband';
      kb.style.left = ZONE.x0 + '%';
      kb.style.right = (100 - ZONE.x1) + '%';
      kb.style.top = ZONE.y0 + '%';
      kb.style.height = (ZONE.y0kop - ZONE.y0) + '%';
      kb.innerHTML = '<span>hier dimt de bovenbalk</span>';
      frame.appendChild(kb);
      toonOnderrand(frame);
    }
    if (gridOn) { const d = document.createElement('div'); d.className = 'me-grid'; frame.appendChild(d); }
    /* De ster staat in het spel op één halte. Met deze knop op allemaal, doorzichtig:
       zo zie je in één blik of ze overal past -- of ze nergens met haar hoofd in een
       rots staat en of er overal lucht boven de richel is. */
    if (sterrenOn) {
      const bron = frame.querySelector('.tour-hero');
      if (bron) frame.querySelectorAll('.tour-stop').forEach(st => {
        if (st.querySelector('.tour-hero')) return;
        const k = bron.cloneNode(true);
        k.classList.add('me-spook');
        st.appendChild(k);
      });
    }
    leesCurve().forEach((c, i) => {
      const h = document.createElement('div');
      h.className = 'me-ctrl';
      h.dataset.ctrl = i;
      h.style.left = c.x + '%';
      h.style.top = c.y + '%';
      h.title = 'weg tussen halte ' + (i + 1) + ' en ' + (i + 2);
      frame.appendChild(h);
    });
  }
  /* De strook die de navigatiebalk afdekt, en een waarschuwing per halte die erin
     valt. Bewust alleen kijken en zeggen: de haltes staan met de hand neergezet, en
     een editor die ze stiekem verschuift is een editor die je niet meer vertrouwt. */
  function toonOnderrand(frame) {
    const fr = frame.getBoundingClientRect();
    const mr = map.getBoundingClientRect();
    if (!fr.height || !mr.height) return;
    const sch = Number(getComputedStyle(R).getPropertyValue('--doos-s')) || 1;
    const lijn = mr.bottom - ONDER_PX * sch;          // in schermcoördinaten
    const top = (lijn - fr.top) / fr.height * 100;
    if (top >= 100 || top <= 0) return;
    const d = document.createElement('div');
    d.className = 'me-onder';
    d.style.top = top.toFixed(2) + '%';
    d.innerHTML = '<span>navigatiebalk — ' + Math.round(ONDER_PX) + 'px</span>';
    frame.appendChild(d);
    /* Buiten de zone? De stippellijn alleen is te makkelijk over het hoofd te zien,
       zeker op een drukke tekening. Elke halte die eruit valt krijgt een rode rand en
       komt met naam in het paneel te staan -- en er wordt niets automatisch verschoven,
       want de haltes zet jíj neer. */
    const zone = frame.querySelector('.me-safe');
    const zr = zone ? zone.getBoundingClientRect() : null;
    const uit = [];
    frame.querySelectorAll('.tour-stop').forEach(st => {
      const r = st.getBoundingClientRect();
      const d = st.querySelector('.dot').getBoundingClientRect();
      const cx = d.left + d.width / 2, cy = d.top + d.height / 2;
      const redenen = [];
      // 1,5px speling: de standaardslinger raakt de zone précies, en een halve pixel
      // afrondingsverschil hoort geen waarschuwing te zijn
      const sp = 1.5;
      if (r.bottom > lijn + sp) redenen.push('balk');
      if (zr) {
        if (cx < zr.left - sp) redenen.push('links');
        if (cx > zr.right + sp) redenen.push('rechts');
        if (cy < zr.top - sp) redenen.push('boven');
        if (cy > zr.bottom + sp) redenen.push('onder');
      }
      st.classList.toggle('te-laag', redenen.length > 0);
      if (redenen.length) uit.push(st.dataset.lvl - shown().first + 1 + ' (' + redenen.join('+') + ')');
    });
    /* Botsen de sterrengroepjes met elkaar of met een ander rondje? Het ritme is
       krapper dan een haltblokje hoog is (182 tegen 194 tekenpixels), dus de slinger
       naar links en rechts moet het werk doen -- en met de hand neergezette haltes
       kunnen dat per ongeluk opgeven. Alleen kijken en zeggen: er wordt niets
       verschoven, want de haltes zet jíj neer. */
    const botst = [];
    const stops = [...frame.querySelectorAll('.tour-stop')];
    stops.forEach((a, i) => {
      const sa = a.querySelector('.cstars');
      if (!sa) return;
      const ra = sa.getBoundingClientRect();
      // de sterrenrij is breed maar grotendeels leeg; alleen de middelste helft telt
      const kern = { l: ra.left + ra.width * .25, r: ra.right - ra.width * .25, t: ra.top, b: ra.bottom };
      stops.forEach((c, j) => {
        if (j <= i) return;
        const dot = c.querySelector('.dot').getBoundingClientRect();
        const sc = c.querySelector('.cstars');
        const rc = sc ? sc.getBoundingClientRect() : null;
        const kernC = rc ? { l: rc.left + rc.width * .25, r: rc.right - rc.width * .25, t: rc.top, b: rc.bottom } : null;
        const raakt = (p1, p2) => p1.l < p2.r && p1.r > p2.l && p1.t < p2.b && p1.b > p2.t;
        if (raakt(kern, { l: dot.left, r: dot.right, t: dot.top, b: dot.bottom })
            || (kernC && raakt(kern, kernC))) {
          botst.push((i + 1) + '\u2194' + (j + 1));
        }
      });
    });
    stops.forEach((st, i) => st.classList.toggle('botst',
      botst.some(x => x.split('\u2194').indexOf(String(i + 1)) >= 0)));

    const chip = F('st-onder');
    if (chip) {
      const regels = [];
      if (uit.length) regels.push('\u26a0 buiten de veilige zone: halte ' + uit.join(', '));
      if (botst.length) regels.push('\u00b7 sterren lopen in elkaar of over een halte: ' + botst.join(', '));
      chip.hidden = !regels.length;
      chip.innerHTML = regels.join('<br>');
    }
  }

  function zetStand(stand) {
    const q = P(), w = shown();
    for (let l = w.first; l < w.first + w.levels; l++) delete q.stars[l];
    if (stand === 'vers') q.level = w.first;
    else if (stand === 'uit' || stand === 'perfect') {

      q.level = w.first + w.levels;

  function laadBeeld(src) {
    return new Promise((ok, fout) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => fout(new Error('kan dit beeld niet lezen'));
      i.src = src;
    });
  }
  async function naarWebp(src, bw, bh, kwal) {
    const img = await laadBeeld(src);
    const c = document.createElement('canvas');
    c.width = bw; c.height = bh;
    const g = c.getContext('2d');
    const sch = Math.max(bw / img.naturalWidth, bh / img.naturalHeight);
    const w = img.naturalWidth * sch, h = img.naturalHeight * sch;
    g.drawImage(img, (bw - w) / 2, (bh - h) / 2, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', kwal));
    if (!blob) throw new Error('omzetten naar webp lukte niet');
    return { blob, bron: img.naturalWidth + 'x' + img.naturalHeight };
  }
  async function verwerkBeeld(f, key) {
    const d = SLOTS[key], pad = slotPad(key), w = shown().world;
    if (!pad) { setOut(d.label + ' staat nog niet in het spel'); return; }
    const url = URL.createObjectURL(f);
    setOut('omzetten…');
    try {
      const { blob, bron } = await naarWebp(url, d.lever[0], d.lever[1], Number(F('st-kwal').value));
      const r = await fetch('/asset?to=' + encodeURIComponent(pad), { method: 'POST', body: blob });
      const txt = await r.text();
      if (!r.ok) { setOut('mislukt: ' + txt); return; }
      OP_SCHIJF[pad] = Math.round(blob.size / 1024);
      if (key === 'world') { w.art = pad; }
      commit('');
      setOut(f.name + '  ' + bron + ' → ' + txt);
    } catch (err) {
      // geen server: laat 'm dan tenminste tijdelijk zien
      if (key === 'world') { w.art = url; commit(''); }
      setOut(String(err.message) + ' — vastzetten kan alleen via npm run preview');
      return;
    }
    URL.revokeObjectURL(url);
  }
  F('st-new').onclick = () => {
    const n = WORLDS.length + 1;
    WORLDS.push({ id: 'wereld' + n, name: 'Wereld ' + n, icon: '✨', levels: 8 });
    rebuildWorldStarts();
    goWorld(WORLDS.length - 1);
    setOut('wereld ' + n + ' erbij');
  };
  F('st-revert').onclick = () => {
    const ship = shippedFor(shown().world.id);
    if (!ship) { setOut('deze wereld staat nog niet in het spel'); return; }
    WORLDS[viewWorldIdx] = JSON.parse(JSON.stringify(ship));
    rebuildWorldStarts();
    commit('teruggezet naar het spel');
  };
  F('st-pull').onclick = () => {
    localStorage.removeItem(WORLD_DRAFT_KEY);
    applyWorldDraft(JSON.parse(JSON.stringify(WORLDS_SHIPPED)));
    viewWorldIdx = Math.min(viewWorldIdx, WORLDS.length - 1);
    commit('concept weg — dit is wat er in het spel staat');
  };
  F('st-push').onclick = () => {
    toonControle(controleer(), true);   // stil bij enkel 'let op', luid bij een fout
    saveWorldDraft();
    fetch('/werelden', { method: 'POST', body: worldsSource() })
      .then(r => r.text().then(t => {
        if (!r.ok) return setOut('mislukt: ' + t);
        WORLDS_SHIPPED.length = 0;
        JSON.parse(JSON.stringify(WORLDS)).forEach(w => WORLDS_SHIPPED.push(w));
        refreshList();
        setOut('in index.html gezet — nu npm test, committen, pushen');
      }))
      .catch(() => setOut('alleen via npm run preview — gebruik anders Kopieer'));
  };
  /* ------------------------------------------------------------ contrast
     De regel die bepaalt of een tekening wérkt stond tot nu toe als advies in de
     briefing: houd de corridor waar de route loopt mid-tot-donker. Dat is een
     oordeel, en je moet het zes keer vellen. De studio heeft de tekening in handen
     en weet waar elke halte staat, dus hij kan het gewoon méten.

     Wat er gemeten wordt: de gemiddelde helderheid van de tekening in precies het
     schijfje waar het rondje komt, en langs de weg. Daar tegenover de kleur van wat
     er óverheen komt. Een halte gaat door drie standen (op slot grijs, gedaan paars,
     nu goud) en moet in alle drie te zien blijven, dus de slechtste telt.

     De verhouding is de gebruikelijke (L1+0,05)/(L2+0,05); onder de 2,0 valt iets
     weg, tussen 2 en 3 is het krap. Een doorzichtige wegkleur wordt eerst over de
     tekening gemengd, want dat is wat je werkelijk ziet. */
  const HERKEN = document.createElement('canvas').getContext('2d');
  function naarRgb(kleur) {
    HERKEN.clearRect(0, 0, 1, 1);
    HERKEN.fillStyle = '#000';
    HERKEN.fillStyle = kleur;
    const v = HERKEN.fillStyle;
    if (v.charAt(0) === '#') {
      const h = v.length === 4
        ? v.slice(1).split('').map(c => parseInt(c + c, 16))
        : [1, 3, 5].map(i => parseInt(v.substr(i, 2), 16));
      return { r: h[0], g: h[1], b: h[2], a: 1 };
    }
    const m = v.match(/[\d.]+/g) || [0, 0, 0];
    return { r: +m[0], g: +m[1], b: +m[2], a: m[3] === undefined ? 1 : +m[3] };
  }
  function lum(c) {
    const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * f(c.r) + .7152 * f(c.g) + .0722 * f(c.b);
  }
  function meng(voor, achter) {
    const a = voor.a;
    return { r: voor.r * a + achter.r * (1 - a), g: voor.g * a + achter.g * (1 - a),
             b: voor.b * a + achter.b * (1 - a), a: 1 };
  }
  function verhouding(a, b) {
    const l1 = Math.max(a, b), l2 = Math.min(a, b);
    return (l1 + .05) / (l2 + .05);
  }
  // gemiddelde kleur van een schijfje in de tekening, in procenten van de tekening
  function schijf(data, br, ho, x, y, straal) {
    const cx = x / 100 * br, cy = y / 100 * ho, r = straal / 100 * br;
    let R = 0, G = 0, B = 0, n = 0;
    for (let dy = -r; dy <= r; dy += 1.5) {
      for (let dx = -r; dx <= r; dx += 1.5) {
        if (dx * dx + dy * dy > r * r) continue;
        const px = Math.round(cx + dx), py = Math.round(cy + dy);
        if (px < 0 || py < 0 || px >= br || py >= ho) continue;
        const i = (py * br + px) * 4;
        R += data[i]; G += data[i + 1]; B += data[i + 2]; n++;
      }
    }
    return n ? { r: R / n, g: G / n, b: B / n, a: 1 } : null;
  }
  async function meetContrast() {
    const w = shown().world;
    if (!w.art) return { fout: 'deze wereld heeft nog geen tekening om te meten' };
    const img = await laadBeeld(w.art + '?m=' + Date.now());
    const br = 304, ho = Math.round(br * ART_H / ART_W);
    const c = document.createElement('canvas');
    c.width = br; c.height = ho;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, br, ho);
    const data = g.getImageData(0, 0, br, ho).data;

    const frame = map.querySelector('.world-frame');
    const dotStraal = 5.15;   // halve .dot, in procenten van de kaderbreedte
    const kleur = naam => {
      const v = getComputedStyle(frame).getPropertyValue(naam).trim();
      return naarRgb(v || '#fff');
    };
    const goud = kleur('--gold-cta-bottom'), paars = kleur('--purple-shadow');
    const grijs = kleur('--gray-bottom');
    const wegKleur = naarRgb(getComputedStyle(frame).getPropertyValue('--w-road').trim() || 'rgba(255,255,255,.42)');

    /* Wát meten we eigenlijk? Mijn eerste versie zette de vulling van het rondje
       tegen de tekening af, en die vlagde elke tekening af -- terecht op papier,
       onzin in de praktijk. Een halte is een dekkende schijf met een lichte ring
       én een schaduw: op een lichte ondergrond draagt de donkere vulling hem, op
       een donkere de lichte ring. Eén van de twee werkt altijd, en daarom houdt
       die halte zich overal staande. Alleen als ze allebei zwak zijn -- een
       middentoon rond de 35 -- wordt het krap.

       Wat wél stil kan mislukken, en wat je bovendien zélf instelt, is de weg: een
       dunne doorzichtige lijn in een kleur per wereld.

       De sterrenrij heb ik gemeten en er weer uit gehaald. Die vlagde op élke
       ondergrond af, en terecht: gedimde grijze sterretjes zíjn stil, dat is de
       bedoeling -- ze zeggen "hier valt nog iets te halen" en horen niet te
       concurreren met de halte. Een meter die bij elke tekening iets roept, leer je
       negeren, en dan is hij minder waard dan geen meter. */
    const uit = { haltes: [], weg: [], fout: null };
    const ring = naarRgb(getComputedStyle(frame).getPropertyValue('--glass-white-30').trim() || 'rgba(255,255,255,.3)');

    leesNodes().forEach((n, i) => {
      const bg = schijf(data, br, ho, n.x, n.y, dotStraal);
      if (!bg) return;
      const L = lum(bg);
      // de vulling óf de ring mag het dragen -- de beste van de twee telt
      const vulling = Math.max(verhouding(L, lum(paars)), verhouding(L, lum(goud)), verhouding(L, lum(grijs)));
      const opRing = ring.a < 1 ? meng(ring, bg) : ring;
      const beste = Math.max(vulling, verhouding(L, lum(opRing)));
      uit.haltes.push({ nr: i + 1, licht: Math.round(L * 100), v: beste });
    });
    // de weg: halverwege elk stuk, waar het stuurpunt hem heen trekt
    leesCurve().forEach((pt, i) => {
      const bg = schijf(data, br, ho, pt.x, pt.y, 2.5);
      if (!bg) return;
      const opDeWeg = wegKleur.a < 1 ? meng(wegKleur, bg) : wegKleur;
      uit.weg.push({ nr: (i + 1) + '–' + (i + 2), licht: Math.round(lum(bg) * 100),
                     v: verhouding(lum(bg), lum(opDeWeg)) });
    });
    return uit;
  }
  function toonContrast(m) {
    const vak = F('st-contrast');
    vak.hidden = false;
    if (m.fout) { vak.className = 'st-check'; vak.textContent = m.fout; return; }
    /* Drempels verschillen per ding, want ze falen anders. Een halte heeft de beste
       van vulling en ring, en die zakt alleen in een smalle middentoonband; de weg en
       de sterretjes zijn dún en doorzichtig en hebben meer nodig. */
    const zwak = { halte: 1.8, weg: 2.5 };
    const merk = (v, g) => v < g ? 'ct-fout' : v < g * 1.3 ? 'ct-let' : 'ct-goed';
    const teken = (v, g) => v < g ? '⚠' : v < g * 1.3 ? '·' : '✓';
    const regel = (naam, o, g) => '<span class="' + merk(o.v, g) + '">' + teken(o.v, g) + ' ' + naam
      + '</span> licht ' + o.licht + ' · contrast ' + o.v.toFixed(1);

    const slechtH = m.haltes.filter(o => o.v < zwak.halte * 1.3);
    const slechtW = m.weg.filter(o => o.v < zwak.weg * 1.3);
    if (!slechtH.length && !slechtW.length) {
      vak.className = 'st-check schoon';
      const alles = m.haltes.concat(m.weg);
      vak.innerHTML = '✓ alles blijft te zien — laagste contrast '
        + Math.min.apply(null, alles.map(o => o.v)).toFixed(1);
      return;
    }
    vak.className = 'st-check';
    const stukken = [];
    if (slechtH.length) stukken.push(slechtH.map(o => regel('halte ' + o.nr, o, zwak.halte)).join('<br>'));
    if (slechtW.length) {
      stukken.push(slechtW.map(o => regel('weg ' + o.nr, o, zwak.weg)).join('<br>'));
      // het advies volgt uit de stukken die fálen, niet uit het eerste stuk
      const gem = slechtW.reduce((n, o) => n + o.licht, 0) / slechtW.length;
      stukken.push('<span class="ct-let">·</span> zet <b>weg</b> '
        + (gem > 45 ? 'donkerder' : 'lichter') + ' voor deze wereld');
    }
    vak.innerHTML = stukken.join('<br>');
  }
  F('st-contrast-knop').onclick = async () => {
    F('st-contrast').hidden = false;
    F('st-contrast').className = 'st-check';
    F('st-contrast').textContent = 'meten\u2026';
    try { toonContrast(await meetContrast()); }
    catch (e) { F('st-contrast').textContent = 'meten lukte niet: ' + e.message; }
  };

  /* ------------------------------------------------------- controle vooraf
     Kijkt álle werelden na, niet alleen die op je scherm. De rode rand op de kaart
     werkt per wereld; schuif je in wereld 3 een halte mis en ga je door naar wereld
     5, dan ziet niemand het meer. En een wereld die naar een ontbrekend bestand
     wijst valt stil terug op de kleurversie -- dat merk je anders pas op een
     telefoon.

     Blokkeert niets. Halverwege een wereld wíl je kunnen vastleggen; de controle
     zegt alleen wat er staat. */
  function controleer() {
    const punten = [];
    const fout = (w, t) => punten.push({ ernst: 'fout', w, t });
    const let_op = (w, t) => punten.push({ ernst: 'let op', w, t });
    const gezien = {};
    WORLDS.forEach((w, i) => {
      const wl = worldForIndex(i);
      const naam = (w.icon || '') + ' ' + (w.name || w.id);
      const pad = 'assets/world/' + w.id + '-map.webp';

      if (!/^[a-z0-9-]+$/.test(w.id || '')) fout(naam, 'het id "' + w.id + '" mag alleen kleine letters, cijfers en streepjes bevatten');
      if (gezien[w.id]) fout(naam, 'het id "' + w.id + '" komt twee keer voor');
      gezien[w.id] = true;

      if (!w.art) let_op(naam, 'nog geen tekening — speelt op de kleuren van de wereld');
      else if (w.art.indexOf('blob:') === 0) let_op(naam, 'de tekening staat alleen in dit tabblad, nog niet op schijf');
      else if (!OP_SCHIJF[w.art]) fout(naam, 'wijst naar ' + w.art + ', maar dat bestand staat er niet');
      else if (w.art !== pad) let_op(naam, 'gebruikt ' + w.art + ' terwijl het id ' + pad + ' zegt');

      if (w.nodes && w.nodes.length !== wl.levels) fout(naam, w.nodes.length + ' haltes voor ' + wl.levels + ' levels — valt terug op de standaardslinger');
      if (w.curve && w.curve.length !== wl.levels - 1) fout(naam, w.curve.length + ' stuurpunten voor ' + (wl.levels - 1) + ' stukken weg');

      const buiten = [];
      (w.nodes || worldNodes(wl)).forEach((n, k) => {
        const r = [];
        if (n.x < ZONE.x0) r.push('links'); if (n.x > ZONE.x1) r.push('rechts');
        if (n.y < ZONE.y0) r.push('boven'); if (n.y > ZONE.y1) r.push('onder');
        if (r.length) buiten.push((k + 1) + ' (' + r.join('+') + ')');
      });
      if (buiten.length) fout(naam, 'buiten de veilige zone: halte ' + buiten.join(', '));

      if (OP_SCHIJF[pad] && w.art && w.art !== pad) let_op(naam, pad + ' ligt er ook nog — opruimen of gebruiken');
      const kb = OP_SCHIJF[w.art];
      if (kb && kb > 200) let_op(naam, 'de tekening is ' + kb + ' kB; de begroting is ~125 — zes zware werelden maken de app traag op mobiele data');
    });

    /* Twee dingen die over de lijst als géheel gaan, en die stil verkeerd aflopen:
       een wereld die van plaats wisselt of verdwijnt hernummert elk level erna, en
       de sterren van een kind hangen aan levelnummers. Wie al speelt verhuist dan
       naar een andere wereld zonder dat er iets kapot lijkt. */
    /* Wat hernummert wel en wat niet? De levels lopen door de lijst heen, dus alleen
       de vólgorde en het aántal doen ertoe. Een wereld op plek 3 hernoemen verandert
       niets aan welk level waar valt; een wereld ertussen schuiven of verplaatsen
       verschuift alles erna, en de sterren van een kind hangen aan levelnummers.
       Daarom op positie vergelijken en niet op verzameling -- anders leest een
       hernoeming als een verwijdering. */
    const nuL = WORLDS.map(w => w.id), wasL = WORLDS_SHIPPED.map(w => w.id);
    if (nuL.length !== wasL.length) {
      // achteraan een wereld erbij hernummert niets; ertussen of eruit wel
      const achteraan = nuL.length > wasL.length && nuL.slice(0, wasL.length).join(',') === wasL.join(',');
      (achteraan ? let_op : fout)('de wereldlijst',
        'stond op ' + wasL.length + ' werelden en nu op ' + nuL.length
        + (achteraan ? ' — er komt er één achteraan, dat hernummert niets'
           : ' — elk level na de wijziging schuift op, en de sterren van een kind hangen aan levelnummers'));
    } else {
      const zelfdeSet = nuL.slice().sort().join(',') === wasL.slice().sort().join(',');
      if (zelfdeSet && wasL.some((id, i) => nuL[i] !== id))
        fout('de wereldlijst', 'de volgorde is veranderd — elk level schuift mee, en de sterren van een kind hangen aan levelnummers');
      else {
        const hernoemd = wasL.map((id, i) => id !== nuL[i] ? id + ' → ' + nuL[i] : null).filter(Boolean);
        if (hernoemd.length) let_op('de wereldlijst', 'hernoemd: ' + hernoemd.join(', ')
          + ' — de levels blijven waar ze zijn; alleen een al behaalde wereldbadge heet anders');
      }
    }
    WORLDS.forEach((w, i) => {
      const ship = WORLDS_SHIPPED[i];
      if (ship && ship.levels !== w.levels)
        fout((w.icon || '') + ' ' + w.name, 'stond op ' + ship.levels + ' levels en nu op ' + w.levels + ' — alles daarna hernummert');
    });
    return punten;
  }
  function toonControle(punten, stil) {
    const vak = F('st-check');
    if (!vak) return;
    if (!punten.length) {
      vak.className = 'st-check schoon';
      vak.hidden = false;
      vak.innerHTML = '✓ ' + WORLDS.length + ' werelden nagekeken, niets aan de hand';
      return;
    }
    if (stil && !punten.some(x => x.ernst === 'fout')) { vak.hidden = true; return; }
    vak.className = 'st-check';
    vak.hidden = false;
    /* Fouten eerst, opmerkingen daarna -- door elkaar op wereldvolgorde verdronk het
       ene in het andere. En "nog geen tekening" bij drie of meer werelden is in het
       begin gewoon de stand van zaken, dus dat wordt een regel in plaats van zes. */
    const zonder = punten.filter(x => /nog geen tekening/.test(x.t));
    let lijst = punten;
    if (zonder.length > 2) {
      lijst = punten.filter(x => !/nog geen tekening/.test(x.t));
      lijst.push({ ernst: 'let op', w: zonder.length + ' werelden', t: 'hebben nog geen tekening' });
    }
    lijst = lijst.slice().sort((a, c) => (a.ernst === 'fout' ? 0 : 1) - (c.ernst === 'fout' ? 0 : 1));
    vak.innerHTML = lijst.map(x =>
      '<span class="' + (x.ernst === 'fout' ? 'ct-fout' : 'ct-let') + '">'
      + (x.ernst === 'fout' ? '⚠' : '·') + ' ' + esc(x.w) + '</span> ' + esc(x.t)).join('<br>');
  }
  F('st-check-knop').onclick = () => toonControle(controleer(), false);

  /* ------------------------------------------------------------- voorbeeld
     Een écht venster op die maat, niet een iframe. De noodstand voor liggend en
     lage schermen kijkt naar het vénster, dus alleen een echt venster laat zien
     wat er werkelijk gebeurt -- en een iframe vecht bovendien met de servicewerker
     en met het lettertype dat het laden ophoudt. Het concept komt vanzelf mee: het
     staat in localStorage en het venster draait ?debug.

     Vinkjes in plaats van vaste knoppen: je wilt een set naast elkaar kunnen zetten
     (staand én liggend, telefoon én tablet) en niet elk venster los openen. */
  const matenVak = F('st-maten');
  MATEN.forEach(m => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" data-maat="' + m.id + '"' + (m.aan ? ' checked' : '') + '>'
      + '<span>' + m.naam + '</span><em>' + m.id.replace('x', '×') + '</em>';
    matenVak.appendChild(l);
  });
  const gekozenMaten = () =>
    [...matenVak.querySelectorAll('input:checked')].map(i => i.dataset.maat);
  F('st-geenmaat').onclick = () =>
    matenVak.querySelectorAll('input').forEach(i => { i.checked = false; });

  function toonVoorbeeld(maten) {
    if (!maten.length) { setOut('vink eerst een maat aan'); return; }
    saveWorldDraft();
    const scherm = F('st-vscherm').value;
    let x = 60;
    maten.forEach(m => {
      const w = Number(m.split('x')[0]), h = Number(m.split('x')[1]);
      /* fit= zegt het venster wélke binnenmaat het hoort te hebben. Nodig omdat
         width/height van window.open de BUITENmaat zetten -- en een browser mag
         daar bovendien een minimum op leggen (op Windows ~500px breed). Dan krijg
         je stiekem een breder venster, valt de kaart in de kolomstand en zie je
         gekleurde randen die op een telefoon niet bestaan. Het venster corrigeert
         zichzelf en zegt eronder wat het écht is. */
      const url = location.pathname + '?debug&demo&star=p1&screen=' + scherm + '&fit=' + w + 'x' + h;
      const win = open(url, 'wsvoorbeeld' + w + 'x' + h,
        `popup=1,width=${w},height=${h},left=${x},top=80`);
      if (!win) { setOut('het venster werd geblokkeerd — sta pop-ups toe'); return; }
      x += Math.min(w, 520) + 20;
    });
    setOut(maten.length + ' venster(s) geopend — ververs ze na een wijziging');
  }
  F('st-openset').onclick = () => toonVoorbeeld(gekozenMaten());

  F('st-commit').onclick = () => {
    const bericht = F('st-msg').value.trim();
    if (bericht.length < 8) { setOut('geef eerst een bericht'); F('st-msg').focus(); return; }
    const knop = F('st-commit');
    knop.disabled = true;
    setOut('testen draaien… dit duurt een minuut of twee');
    fetch('/commit', { method: 'POST', body: bericht })
      .then(r => r.text().then(t => {
        setOut(t);
        if (r.ok) F('st-msg').value = '';
      }))
      .catch(() => setOut('alleen via npm run preview'))
      .then(() => { knop.disabled = false; });
  };
  /* Publiceren in twee stappen: eerst kijken wát er zou landen, dan pas doen. */
  let publishKlaar = false;
  F('st-publish').onclick = () => {
    const knop = F('st-publish');
    const fase = publishKlaar ? 'go' : 'kijk';
    knop.disabled = true;
    setOut(fase === 'go' ? 'testen draaien, daarna samenvoegen…' : 'kijken wat er zou landen…');
    fetch('/publish', { method: 'POST', body: fase })
      .then(r => r.text().then(txt => {
        if (!r.ok) { setOut(txt); publishKlaar = false; knop.textContent = '🚀 publiceer naar main'; return; }
        if (fase === 'go') {
          setOut(txt);
          publishKlaar = false;
          knop.textContent = '🚀 publiceer naar main';
          knop.classList.remove('prim');
          return;
        }
        const m = /^KLAAR:(\d+)\n([\s\S]*)$/.exec(txt);
        setOut(m ? m[2] : txt);
        publishKlaar = true;
        knop.textContent = '🚀 bevestig — ' + (m ? m[1] : '?') + ' naar main';
        knop.classList.add('prim');
      }))
      .catch(() => setOut('alleen via npm run preview'))
      .then(() => { knop.disabled = false; });
  };

  F('st-copy').onclick = () => {
    const txt = worldsSource();
    dump.textContent = txt + '\n\n(tik om te sluiten)';
    dump.style.display = 'block';
    try { navigator.clipboard.writeText(txt); setOut('gekopieerd'); }
    catch (_) { setOut('zie het venster'); }
    console.log(txt);
  };
  F('st-paste').onclick = () => {
    const txt = prompt('Plak een WORLDS-blok of de JSON-lijst:');
    if (!txt) return;
    try {
      const m = /\[[\s\S]*\]/.exec(txt);
      if (!m) throw new Error('geen lijst gevonden');
      const list = (new Function('return (' + m[0] + ')'))();
      if (!Array.isArray(list) || !list.every(w => w && w.id && w.levels > 0)) throw new Error('geen geldige werelden');
      applyWorldDraft(list);
      viewWorldIdx = 0;
      goWorld(0);
      setOut(list.length + ' werelden ingelezen');
    } catch (e) { setOut('niet gelukt: ' + e.message); }
  };

  /* ---------------------------------------------------------------- kiezen
     De geselecteerde halte of stuurpunt: krijgt een ring, zijn x en y komen in twee
     invoervelden, en de pijltjes verschuiven 'm. 0,2% per tik, 1% met Shift -- dat is
     op een tekening van 2160 hoog ruim 4 respectievelijk 21 pixels. */
  const STAP = 0.2;
  function kies(nieuw) {
    sel = nieuw;
    markeerSelectie();
    vulXY();
  }
  function markeerSelectie() {
    const frame = map.querySelector('.world-frame');
    if (!frame) return;
    frame.querySelectorAll('.gekozen').forEach(e => e.classList.remove('gekozen'));
    const el = selEl(frame);
    if (el) el.classList.add('gekozen');
  }
  function selEl(frame) {
    if (!sel) return null;
    return sel.wat === 'weg'
      ? frame.querySelector('.me-ctrl[data-ctrl="' + sel.i + '"]')
      : frame.querySelector('.tour-stop[data-lvl="' + (shown().first + sel.i) + '"]');
  }
  function selLijst() { return sel && sel.wat === 'weg' ? ownCurve() : ownNodes(); }
  function vulXY() {
    const vak = F('st-xy');
    if (!vak) return;
    vak.hidden = !sel;
    if (!sel) return;
    const punt = selLijst()[sel.i];
    if (!punt) return;
    F('st-wat').textContent = (sel.wat === 'weg' ? 'weg ' : 'halte ') + (sel.i + 1);
    F('st-x').value = punt.x.toFixed(1);
    F('st-y').value = punt.y.toFixed(1);
  }
  function zetXY(x, y) {
    if (!sel) return;
    const punt = selLijst()[sel.i];
    if (!punt) return;
    punt.x = Math.max(0, Math.min(100, x));
    punt.y = Math.max(0, Math.min(100, y));
    commit('');
    markeerSelectie();
    vulXY();
  }
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('mapedit')) return;
    const inVeld = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ''));
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault(); stapTerug(); return;
    }
    if (inVeld || !sel) return;
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const stap = STAP * (e.shiftKey ? 5 : 1);
    const punt = selLijst()[sel.i];
    if (!punt) return;
    if (!e.repeat) bewaarStap('verschuiven met de pijltjes');
    zetXY(punt.x + d[0] * stap, punt.y + d[1] * stap);
  });

  // ---------------------------------------------------------------- slepen
  let drag = null;
  map.addEventListener('pointerdown', e => {
    const frame = map.querySelector('.world-frame');
    if (!frame || !e.target.closest) return;
    const ctrl = e.target.closest('.me-ctrl');
    const stop = ctrl ? null : e.target.closest('.tour-stop');
    if (!ctrl && !stop) return;
    bewaarStap(ctrl ? 'weg verslepen' : 'halte verslepen');
    drag = ctrl
      ? { el: ctrl, frame, list: ownCurve(), i: Number(ctrl.dataset.ctrl), wat: 'weg' }
      : { el: stop, frame, list: ownNodes(), i: Number(stop.dataset.lvl) - shown().first, wat: 'halte' };
    kies({ wat: drag.wat, i: drag.i });
    drag.el.classList.add('dragging');
    try { drag.el.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault(); e.stopPropagation();
  }, true);
  map.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = drag.frame.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100));
    const y = Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100));
    const p = drag.list[drag.i];
    if (!p) return;
    p.x = x; p.y = y;
    drag.el.style.left = x + '%';
    drag.el.style.top = y + '%';
    redrawRoad();
    setOut(`${drag.wat} ${drag.i + 1}   x ${x.toFixed(1)}   y ${y.toFixed(1)}`);
    e.preventDefault(); e.stopPropagation();
  }, true);
  const endDrag = () => {
    if (!drag) return;
    drag.el.classList.remove('dragging');
    map.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); },
      { capture: true, once: true });
    drag = null;
    saveWorldDraft();
    refreshList();
  };
  map.addEventListener('pointerup', endDrag, true);
  map.addEventListener('pointercancel', endDrag, true);

  viewWorldIdx = Math.min(worldFor(P().level).index, WORLDS.length - 1);
  goWorld(viewWorldIdx);
  zetToestel(toestelKiezer.value);
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
