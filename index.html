const BACKUP_OUD_DAGEN = 28;
function backupDagen(nu) {
  const t = db.backupAt ? Date.parse(db.backupAt) : NaN;
  return isNaN(t) ? null : Math.max(0, Math.floor(((nu || Date.now()) - t) / 86400000));
}
function backupOud(nu) {
  const dagen = backupDagen(nu);
  return dagen === null || dagen > BACKUP_OUD_DAGEN;
}
function backupStandHtml(nu) {
  const dagen = backupDagen(nu);
  const wanneer = dagen === null ? null
    : dagen === 0 ? 'vandaag'
    : dagen === 1 ? 'gisteren'
    : dagen < 14 ? `${dagen} dagen geleden`
    : dagen < 60 ? `${Math.floor(dagen / 7)} weken geleden`
    : `${Math.floor(dagen / 30)} maanden geleden`;
  const oud = backupOud(nu);
  const tekst = wanneer ? `Laatste back-up: ${wanneer}` : 'Nog nooit een back-up gemaakt';
  return `<div class="backup-stand${oud ? ' oud' : ''}" id="set-backup-stand">`
    + `<span aria-hidden="true">${oud ? '⚠️' : '✓'}</span> ${tekst}</div>`;

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);






      const profs = data && typeof data === 'object' ? data.profiles : null;
      const okShape = p => !!p && typeof p === 'object' && typeof p.name === 'string'
        && Array.isArray(p.owned) && !!p.stars && typeof p.stars === 'object'
        && !!p.equipped && typeof p.equipped === 'object';
      const ok = profs && typeof profs === 'object' && !Array.isArray(profs)
        && Object.values(profs).every(okShape)
        && (Object.keys(profs).length > 0 || typeof data.sound === 'boolean');
      if (!ok) throw new Error('ongeldig back-upbestand');
    } catch (e) {
      showNotice('Oeps!', 'Kon dit bestand niet lezen. Kies een geldig back-upbestand.');
      return;
    }
    showConfirm(
      '📂 Back-up terugzetten?',
      'Dit vervangt de huidige diamanten, sterren en spulletjes van alle profielen door de inhoud van dit back-upbestand. Dit kan niet ongedaan gemaakt worden.',
      'Ja, terugzetten',
      () => {



        const next = data;
        if (typeof next.sound !== 'boolean') next.sound = true;
        if (typeof next.haptics !== 'boolean') next.haptics = true;
        try { Object.values(next.profiles).forEach(migrate); }
        catch (e) { showNotice('Oeps!', 'Dit back-upbestand is beschadigd; er is niets veranderd.'); return; }
        db = next;
        normalizeProfiles();
        cur = null;
        setKey = null;
        save();
        renderSettings();

        showToast('✓ Back-up geladen');
        toastWeg(2200);
      }
    );
  };
  reader.onerror = () => showNotice('Oeps!', 'Kon dit bestand niet lezen.');
  reader.readAsText(file);
}

function beginschermSoort(nav) {
  nav = nav || navigator;
  const ua = String(nav.userAgent || '');
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|Snapchat|Pinterest|LinkedInApp|musical_ly|TikTok|GSA\/|; wv\)/.test(ua);
  const ipadAlsMac = /Macintosh/.test(ua) && (nav.maxTouchPoints || 0) > 1;
  if (/iPhone|iPad|iPod/.test(ua) || ipadAlsMac) {
    const safari = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|YaBrowser|DuckDuckGo/.test(ua) && !inApp;
    return safari ? 'ios' : 'ios-elders';
  }
  if (inApp) return 'inapp';
  if (/Android/.test(ua)) {
    return /Chrome\//.test(ua) && !/SamsungBrowser|OPR\/|Firefox|EdgA|YaBrowser|UCBrowser/.test(ua) ? 'android' : 'anders';
  }
  if (/Mobi/.test(ua)) return 'anders';
  return /Chrome\/|Edg\//.test(ua) && !/OPR\//.test(ua) ? 'desktop' : 'anders';
}

function beginschermUitleg(soort, hasStars) {

    case 'ios': return ['Tik in Safari op Deel en kies ‘Zet op beginscherm’.', redden('Safari')];
    case 'ios-elders': return ['Open deze pagina in Safari. Tik daar op Deel en kies ‘Zet op beginscherm’.',
      redden('deze browser')];
    case 'desktop': return ['Klik op het installeer-icoon in de adresbalk, of kies ‘App installeren’ in het menu van je browser.'];
    case 'inapp': return ['Je bekijkt deze pagina in een andere app. Open hem in Chrome om Rekensterren als app te installeren.'];

  }
}

const APPKNOP_KEY = 'rekenPopsterren_appknop';
const APPKNOP = { vanafBezoek: 2, rustDagen: 14, maxNee: 3 };
let installVoorstel = null;
addEventListener('beforeinstallprompt', e => { installVoorstel = e; });
function appKnopLees() {
  try {
    const s = JSON.parse(localStorage.getItem(APPKNOP_KEY) || 'null');
    return s && typeof s === 'object' ? s : {};
  } catch (e) { return {}; }
}
function appKnopSchrijf(s) {
  try { localStorage.setItem(APPKNOP_KEY, JSON.stringify(s)); } catch (e) { }
}

(function () {
  if (speeltAlsApp()) return;
  const s = appKnopLees();
  s.bezoek = (s.bezoek | 0) + 1;
  appKnopSchrijf(s);
})();

function appUitlegNodig() { return !beginschermNetErop && !speeltAlsApp(); }
function appKnopTonen(nu) {
  if (!appUitlegNodig()) return false;
  const zoek = location.search || '';
  if (zoek.indexOf('debug') !== -1 && zoek.indexOf('appknop') === -1) return false;
  const s = appKnopLees();
  if ((s.bezoek | 0) < APPKNOP.vanafBezoek) return false;
  if ((s.nee | 0) >= APPKNOP.maxNee) return false;
  return !(s.rustTot > (nu || Date.now()));
}

function appKnopZet() {
  const k = $('app-knop');
  if (!k) return;
  const opLanding = $('screen-profile').classList.contains('active');
  k.style.display = opLanding && appKnopTonen() ? '' : 'none';
}
function appKnopNietNu() {
  const s = appKnopLees();
  s.nee = (s.nee | 0) + 1;
  s.rustTot = Date.now() + APPKNOP.rustDagen * 24 * 3600 * 1000;
  appKnopSchrijf(s);
  closeConfirmModal();
  appKnopZet();
}

  if ($('screen-newstar').classList.contains('active')) return closeNewStar;

  if ($('screen-map').classList.contains('active') && !$('world-back').hidden
      && $('world-back').onclick) return $('world-back').onclick;

let backGuardArmed = false, syncingBackGuard = false, backSyncQueued = false, guardVooruit = false;









function syncBackGuard() {
  if (backSyncQueued) return;
  backSyncQueued = true;
  queueMicrotask(() => {
    backSyncQueued = false;
    const want = !!backTarget();
    syncTerugWachter(want);
    if (want === backGuardArmed) return;
    if (want) {



      const ua = navigator.userActivation;
      if (!guardVooruit && ua && !ua.hasBeenActive) return;
      if (guardVooruit) history.forward();
      else history.pushState({ rpGuard: 1 }, '');
      backGuardArmed = true;
    }
    else { syncingBackGuard = true; history.back(); }
  });
}
window.addEventListener('popstate', () => {


  if (history.state && history.state.rpGuard) { backGuardArmed = true; return; }
  backGuardArmed = false;
  guardVooruit = true;
  if (syncingBackGuard) { syncingBackGuard = false; return; }
  const act = backTarget();
  if (act) { act(); syncBackGuard(); }
});


window.addEventListener('pageshow', () => { backGuardArmed = !!(history.state && history.state.rpGuard); syncBackGuard(); });



















let terugWachter = null;
const kanTerugWachter = typeof CloseWatcher === 'function' && matchMedia('(pointer: coarse)').matches;
function syncTerugWachter(want) {
  if (!kanTerugWachter) return;
  if (!want) { if (terugWachter) { terugWachter.destroy(); terugWachter = null; } return; }
  if (terugWachter) return;
  try { terugWachter = new CloseWatcher(); } catch (e) { terugWachter = null; return; }
  terugWachter.onclose = () => {
    terugWachter = null;
    const act = backTarget();
    if (act) act();
    syncBackGuard();
  };
}


document.addEventListener('click', syncBackGuard, true);



document.addEventListener('keydown', e => { if (e.key === 'Escape' && !terugWachter) { const act = backTarget(); if (act && act !== toonStopKaart) act(); } });

function zetKijkstand(wereld, stand) {
  demoStand = true;
  const p = P();
  const laatste = WORLD_AVAIL - 1;
  const n = Math.max(0, Math.min(Math.round(wereld) - 1, laatste));
  p.stars = {};
  p.worldsSeen = [];
  const vul = (i, ster) => {
    for (let l = WORLD_START[i]; l < WORLD_START[i] + WORLDS[i].levels; l++) p.stars[l] = ster;
  };


  if (stand === 'alles') {
    for (let i = 0; i <= laatste; i++) { vul(i, 3); p.worldsSeen.push(WORLDS[i].id); }
    p.level = WORLD_LAST + 1;
    viewWorldIdx = null;
    return;
  }


  if (stand === 'slot' && n > 0) {
    for (let i = 0; i < n - 1; i++) vul(i, 3);
    const vorige = n - 1;
    for (let l = WORLD_START[vorige]; l < WORLD_START[vorige] + WORLDS[vorige].levels - 1; l++) p.stars[l] = 3;
    p.level = WORLD_START[vorige] + WORLDS[vorige].levels - 1;
    for (let i = 0; i <= vorige; i++) p.worldsSeen.push(WORLDS[i].id);
    viewWorldIdx = null;
    reisDoel = n;
    return;
  }

  for (let i = 0; i < n; i++) vul(i, 3);
  for (let i = 0; i <= n; i++) p.worldsSeen.push(WORLDS[i].id);
  const eerste = WORLD_START[n], len = WORLDS[n].levels;
  if (stand === 'perfect' || stand === 'uit') {
    vul(n, stand === 'perfect' ? 3 : 2);
    p.level = eerste + len;
    reisDoel = n;
  } else if (stand === 'bijna') {
    for (let l = eerste; l < eerste + len - 1; l++) p.stars[l] = 3;
    p.level = eerste + len - 1;
  } else if (stand === 'halverwege') {
    const tot = Math.min(3, len - 1);
    for (let l = eerste; l < eerste + tot; l++) p.stars[l] = 2 + (l % 2);
    p.level = eerste + tot;
  } else {
    p.level = eerste;
  }
  viewWorldIdx = null;
}






function fitVenster(spec) {
  const w = Number(spec.split('x')[0]), h = Number(spec.split('x')[1]);
  if (!w || !h) return;
  const meld = () => {
    const klopt = innerWidth === w && innerHeight === h;
    let el = document.getElementById('fit-badge');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fit-badge';
      el.style.cssText = 'position:fixed;left:50%;bottom:6px;transform:translateX(-50%);'
        + 'z-index:99999;padding:3px 9px;border-radius:99px;pointer-events:none;'
        + 'font:600 11px ui-monospace,monospace;';
      document.body.appendChild(el);
    }
    el.style.background = klopt ? 'rgba(20,80,45,.85)' : 'rgba(120,30,20,.9)';
    el.style.color = klopt ? '#b6ffd6' : '#ffd0c4';
    el.textContent = klopt ? innerWidth + ' x ' + innerHeight
      : 'gevraagd ' + w + 'x' + h + ' — werkelijk ' + innerWidth + 'x' + innerHeight;
  };
  try { resizeTo(w + (outerWidth - innerWidth), h + (outerHeight - innerHeight)); } catch (_) {}
  setTimeout(meld, 120);
  addEventListener('resize', () => setTimeout(meld, 60));
}
