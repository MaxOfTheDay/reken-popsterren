  }
  /* Ruimte over? Dan groeit de sóm, niet de paspop. De paspop is decor; de
     vraagkaart is waar het kind naar moet kijken -- en die was op een telefoon
     (99px hoog) juist kleiner dan het decor ernaast (147px). */
  @media (min-height: 780px) {
    .question-card { font-size: clamp(46px, 13vw, 62px); padding: 22px 30px 30px; }
  }
  @media (min-width: 900px) and (min-height: 760px) {
    .show-stage { width: 240px; height: 202px; }
    .question-card { font-size: clamp(50px, 6vw, 68px); }
  }

  /* feedback-kaarten (praise/toast): kregen vroeger een vaste viewport-%
     positie, wat ze op elk formaat over de paspop/avatar heen liet vallen
     zodra de tekst iets langer was. Tijdens het spel ("docked", zie JS)
     hangen ze nu vlak onder de vaste kop, altijd vrij van de paspop; op de
     andere schermen (kaart, kleedkamer, trofeeën, winkel, instellingen)
     blijft de bestaande losse positie -- daar was geen overlap-probleem. */
  .praise {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(.7);
    z-index: 60; opacity: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: rgba(48,10,80,.94);
    border: 1.5px solid rgba(255,224,130,.5); border-radius: var(--r-md); padding: 12px 22px 14px;
    box-shadow: var(--e-2), 0 0 22px rgba(255,193,7,.25);
    max-width: min(84vw, 320px);
  }
  /* gedockte kaart is compacter dan de losse variant (kleiner pilletje,
     minder padding) -- moet altijd tussen kop en paspop passen, ook op
     smallere formaten waar de paspop hoger in het scherm begint */
  .praise.docked {
    top: 98px; transform: translateX(-50%) scale(.7); gap: 5px; padding: 9px 18px 11px;
  }
  .praise.docked .earn-chip { font-size: 14px; padding: 5px 12px; }
  .praise-headline {
    font-size: clamp(19px, 5.4vw, 25px); font-weight: 800; color: var(--gold-light);
    text-shadow: 0 0 12px var(--gold-cta-bottom), 0 2px 0 var(--glass-black-40);
    text-align: center; text-wrap: balance; line-height: 1.15;
  }
  .praise.pop { animation: praisePop .9s cubic-bezier(.22,1.1,.4,1) forwards; }
  .praise.docked.pop { animation-name: praisePopDocked; }
  @keyframes praisePop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); }
    55% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
    80% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-64%) scale(1); }
  }
  @keyframes praisePopDocked {
    0% { opacity: 0; transform: translateX(-50%) scale(.7) translateY(-6px); }
    55% { opacity: 1; transform: translateX(-50%) scale(1.05) translateY(0); }
    80% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-10px); }
  }
  .toast {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%) translateY(-8px);
    z-index: 60; display: none; opacity: 0;
    flex-direction: column; align-items: center; gap: 2px; text-align: center;
    background: rgba(43,7,71,.94);
    border: 1.5px solid var(--glass-white-16); border-radius: var(--r-md); padding: 11px 20px 12px;
    box-shadow: var(--e-2);
    max-width: min(88vw, 360px);
    pointer-events: none;
  }
  .toast.docked { top: 98px; }
  .toast.show { display: flex; animation: toastIn .3s ease forwards; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .toast-main { font-size: clamp(16px, 4.6vw, 19px); font-weight: 700; color: var(--c-white); line-height: 1.3; text-wrap: balance; }
  .toast-sub { font-size: 13px; font-weight: 600; color: var(--c-white); opacity: .75; margin-top: 1px; }
  /* op lage schermen zit de paspop al vlak onder de kop (zie .show-stage
     hierboven) -- de gedockte kaart moet dan even compact zijn om de
     ruimte ertussen niet te overschrijden */
  @media (max-height: 700px) {
    .praise.docked, .toast.docked { top: 94px; padding: 5px 13px 6px; gap: 2px; }
    .praise.docked .praise-headline { font-size: 13px; }
    .praise.docked .earn-chip { font-size: 10px; padding: 2px 7px; }
    .toast.docked .toast-main { font-size: 14px; }
    .toast.docked .toast-sub { font-size: 10px; margin-top: 0; }
  }
  /* "tik om verder te gaan": een onzichtbare, schermvullende laag ónder de
     toast (die zelf pointer-events:none heeft, dus een tik daarop valt door
     naar deze laag) zodat een kind overal mag tikken, niet precies op de
     kleine bubbel zelf moet mikken. */
  .tap-veil { position: fixed; inset: 0; z-index: 59; display: none; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(7px); }
  }
  /* zachte "foute noot" animatie */
  .wobble { animation: wobble .7s ease; }
  @keyframes wobble {
    0%,100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-3deg) scale(.98); }
    45% { transform: rotate(2.5deg) scale(.99); }
    70% { transform: rotate(-1.5deg); }
  }
  .slip-note {
    position: fixed; left: 50%; top: 34%; transform: translateX(-50%);
    font-size: 52px; z-index: 60; pointer-events: none; opacity: 0;
  }
  .slip-note.go { animation: slipNote 1.6s ease forwards; }
  @keyframes slipNote {
    0% { opacity: 0; transform: translate(-50%, 0) rotate(0); }
    20% { opacity: 1; transform: translate(-50%, 6px) rotate(-8deg); }
    100% { opacity: 0; transform: translate(-50%, 90px) rotate(30deg); }
  }

  /* ---- Gouden vraag ---- */
  .question-card.golden {
    background: var(--gold-accent);
    color: var(--ink-on-gold-card); box-shadow: 0 0 26px rgba(255,193,7,.9), 0 8px 20px var(--glass-black-30);
    animation: goldGlow 1s ease-in-out infinite alternate;
  }
  @keyframes goldGlow { from { box-shadow: 0 0 18px rgba(255,193,7,.7), 0 8px 20px var(--glass-black-30); } to { box-shadow: 0 0 34px rgba(255,193,7,1), 0 8px 20px var(--glass-black-30); } }
  .gold-banner { font-size: 18px; font-weight: bold; color: var(--gold-light); text-shadow: 0 0 10px var(--gold-cta-bottom); margin-top: 6px; height: 22px; }

  /* ---- Wereldtournee: één wereld per scherm, volledig in beeld ----
     Er valt niets te scrollen. Het kader (.world-frame) heeft de beeldverhouding
     van de wereldtekening en wordt met container-query-eenheden precies ingepast
     in de ruimte die er is -- de CSS-versie van object-fit:contain, zonder een
     regel JavaScript. Wat overblijft aan de zijkanten is geen leegte maar de
     lucht van de wereld zelf (zie .tour-map).

     Alles bínnen het kader staat op percentages: de tekening, de weg (een SVG met
     exact dezelfde viewBox-verhouding) en de haltes. Daarom valt de weg op élk
     toestel precies op de haltes en op de tekening -- het klopt per constructie,
     niet per afstelling, en draaien of resizen vraagt geen herberekening. */
  .tour-map {
    position: absolute; inset: 0; z-index: 0; container-type: size;
    /* Verticaal safe center: staat het kader hóger dan het vak, dan zou gewoon center
       de bovenkant buiten het scrollbereik duwen en was halte 8 onbereikbaar.
       Horizontaal júist gewoon center: daar valt niets te scrollen (overflow-x is
       hidden), en "safe" viel bij overloop terug op links uitlijnen -- dan werd de
       hele rechterkant van de tekening weggeknipt in plaats van een beetje aan
       beide kanten. */
    display: flex; align-items: safe center; justify-content: center;
    /* Horizontaal wordt geknipt -- dat is de cover-snede. Verticaal mag je schuiven:
       een staande tekening past niet in elke vensterverhouding, en schuiven is beter
       dan de tekening kleiner maken. Kleiner maken laat de app-achtergrond als
       gekleurde banden om de kaart heen staan, en dat las als een fout. */
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .tour-map::-webkit-scrollbar { display: none; }
  /* COVER, niet contain: de tekening vult het hele scherm, zoals in de mockup.
     Daarvoor staat hier max() waar bij contain min() zou staan -- het kader wordt
     dus juist groter dan het scherm en wat eroverheen steekt wordt weggeknipt.

     Cruciaal: de haltes zitten ín ditzelfde kader. Ze schuiven dus exact met de
     tekening mee en kunnen er nooit vanaf glijden. Wat het wél betekent: aan de
     randen wordt geknipt (op een telefoon ~4-6% per kant), dus haltes horen in de
     veilige zone -- zie docs/PROGRESSION-REVIEW.md §E8. */
  /* De maat van een wereldtekening. Staat híer als terugval voor het eerste
     beeldje; ART_W/ART_H in de JS is de bron en zet ze bij elke tekening opnieuw.
     Dat moet één getal zijn, want de weg-SVG gebruikt dezelfde verhouding als
     viewBox -- liepen ze uiteen, dan viel de weg naast de haltes (zie VB_W). */
  .tour-map { --art-w: 1215; --art-h: 2160; }
  .world-frame {
    position: relative; flex: none;
    /* min-width + min-height + aspect-ratio = cover. Gemeten tegen de variant met
       max(100cqw, 100cqh * ...): die liet op 390x844 een gat van 64px onderaan.
       container-type staat er voor de cqw-eenheden van de haltes, niet voor de maat. */
    min-width: 100%; min-height: 100%;
    aspect-ratio: var(--art-w) / var(--art-h);
    container-type: size;
    background-size: cover; background-position: 50% 50%;
  }
  /* Nog geen tekening? Dan draagt de wereld zichzelf met zijn eigen kleuren, zodat
     een wereld speelbaar is vóórdat hij getekend is (en een ontbrekend bestand
     nooit een leeg vlak oplevert). */
  .world-frame.no-art {
    background-image:
      radial-gradient(120% 40% at 50% 103%, var(--w-glow, rgba(255,216,128,.34)), transparent 66%),
      linear-gradient(180deg, var(--w-sky, #3d1a63) 0%, var(--w-deep, #2a0c47) 100%);
  }
  /* Heeft een wereld een eigen tekening, dan brengt die zijn eigen lucht en grond
     mee: de gedeelde wolkjes en het voetlicht van de app zouden er dan dwars
     doorheen lopen. */
  #screen-map:has(.world-frame:not(.no-art)) .map-sky,
  #screen-map:has(.world-frame:not(.no-art)) .map-ground { display: none; }
  /* Liggend vult de kaart gewoon het scherm en schuif je verticaal -- precies zoals
     staand, alleen is er meer te schuiven. Dat was eerder een kolom van 340px met
     banden ernaast, omdat schuiven als een noodgreep gold; maar een volle tekening
     met een beetje schuiven leest beter dan een postzegel in het midden.

     Tot waar? Tot de tekening er nog góéd uitziet. Hij is 1215 pixels breed, dus
     bij een venster tot 1215 CSS-pixels blijft er minstens één tekenpixel per
     schermpixel over en is er niets te zien. Daarboven zou hij uitgerekt worden, en
     dán pas wordt het een podium: de kaart zo groot als de hoogte toelaat, met een
     zachte rand, en ernaast dezelfde tekening nog een keer -- uitvergroot, onscherp
     en donker, zodat de randen de wereld zelf zijn en geen leegte.

     (1215 = ART_W. Wordt de tekening ooit groter, dan mag deze grens mee.) */
  @media (min-aspect-ratio: 1/1) and (min-width: 1216px) {
    /* De onscherpe wereld ligt op #screen-map en niet op .tour-map: dat laatste is
       een scrollvak, en een laagje daarin zou met de kaart mee wegschuiven. */
    #screen-map { isolation: isolate; }
    #screen-map::before { content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, var(--w-sky, #3d1a63) 0%, var(--w-deep, #2a0c47) 100%); }
    #screen-map::after { content: ''; position: absolute; inset: -6%; z-index: -1;
      background-image: var(--art, none); background-size: cover; background-position: 50% 50%;
      filter: blur(36px) brightness(.46) saturate(.8); pointer-events: none; }
    /* Het podium is zo groot als de hóógte toelaat, en niet kleiner.
       Hier stond padding: var(--kop-h) 0 var(--nav-h) -- het podium werd dus vrij
       gehouden van de kop en de balk. Dat is precies andersom dan op een telefoon,
       waar die twee juist óver de kaart zweven: daar is de doorzichtige kop voor
       bedacht en daar gaat de veilige zone van uit. Het kostte 14 tot 17% van het
       podium (443 in plaats van 519 breed op 1780x950) zonder dat er iets mee
       gewonnen werd. Nu alleen nog een randje lucht, zodat de ronde hoek en de
       schaduw niet tegen de vensterrand aan liggen -- anders leest het niet meer
       als een toestel op een achtergrond. */
    .tour-map { align-items: center; padding: 14px 0; }
    .world-frame { min-width: 0; min-height: 0;
      width: clamp(min(340px, 100cqw), 100cqh * var(--art-w) / var(--art-h), 100cqw);
      border-radius: 16px; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 20px 70px rgba(0,0,0,.6); }
    /* De kop hoort bij het podium, niet bij het venster. Over de volle breedte
       stond het portretje links en de diamanten rechts ergens in de onscherpe
       rand, terwijl de navigatiebalk eronder wél op podiumbreedte staat -- dan
       lijken de twee balken bij twee verschillende schermen te horen. Dezelfde
       maat als .main-nav, zodat ze samen één toestel vormen. */
    #screen-map .hub-sticky { width: min(94vw, 430px); margin-left: auto; margin-right: auto; }
  }
  /* zachte fade-randen op horizontale scrollers (tabbladen, kindkiezer):
     verschijnen alleen aan de kant waar nog meer te scrollen valt */
  .hscroll-fade.can-right { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent 100%); }
  .hscroll-fade.can-left { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 34px);
    mask-image: linear-gradient(90deg, transparent 0, #000 34px); }
  .hscroll-fade.can-left.can-right { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%); }
  /* De weg: twee lagen over de volle tekening. Het hele pad dof ("nog te
     ontdekken"), het afgelegde stuk daar bovenop vol goud ("al gehaald") --
     dezelfde taal als de haltes zelf. Gestippeld, zodat het als een route leest
     en niet als een muur. */
  .fly-badge { position: fixed; z-index: 90; font-size: 40px; pointer-events: none;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
  .tour-road-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  /* De 26/34 hieronder is de terugval. Normaal zet renderTourMap er een patroon
     overheen dat per stuk weg precies past, zodat er op elke halte een streepje
     ligt -- zie roadDashArray. */
  .tour-road-bg, .tour-road-fg, .tour-road-under { fill: none; stroke-linecap: round; stroke-dasharray: 26 34; }
  /* Een donkere onderlaag onder de hele weg: iets breder, flink doorzichtig en
     onscherp. Daarmee blijft het goud leesbaar op een lichte lucht én op een
     donkere rots, zonder dat de weg zelf van kleur verandert. */
  /* Iets smaller en zachter dan eerst (22/50% -> 18/42%): hij hoeft de weg alleen te
     dragen, niet te verdubbelen. Weghalen is geen optie -- op een lichte lucht is hij
     het enige dat het goud nog vasthoudt. */
  .tour-road-under { stroke: rgba(22,6,42,.42); stroke-width: 18; filter: blur(2px); }
  .tour-road-bg { stroke: var(--w-road, rgba(255,255,255,.42)); stroke-width: 13; }
  .tour-road-fg { stroke: var(--gold-accent); stroke-width: 13; }
  /* Terug naar een eerdere wereld (of vooruit, tot waar ze zelf al was). Bewust
     glas en klein: goud is voor spelen en verdiend, en dit mag nooit met Speel!
     concurreren. */
  /* De wereldnaam in de kop is de ingang naar alle werelden. Twee zwevende pijlen
     (één wereld per tik) waren daarvoor de navigatie; met zes werelden is dat vijf
     tikken van de laatste naar de eerste, en ze lagen bovendien over de tekening.
     De naam is toch al de plek waar je kijkt om te weten wáár je bent. */
  .world-pick { display: inline-flex; align-items: center; gap: 6px;
    border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
    padding: 2px 6px; border-radius: var(--r-pill); }
  .world-pick:active { transform: scale(.96); }
  .wp-chev { font-size: 15px; opacity: .55; }
  /* De weg terug. Goud, want dit is de enige knop op dit scherm die je ergens
     naartoe bréngt; en laag genoeg om niet met een halte te concurreren. */
  .world-back {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 6;
    bottom: var(--nav-h, 96px);
    display: flex; align-items: center; gap: 6px; padding: 8px 16px;
    font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1;
    white-space: nowrap; max-width: calc(100% - 24px);
    color: var(--ink-on-gold-card); cursor: pointer;
    background: linear-gradient(180deg, var(--gold-cta-top), var(--gold-cta-bottom));
    border: 0; border-radius: var(--r-pill); box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .world-back:active { transform: translateX(-50%) scale(.95); }
  /* Het ankerpunt is het midden van het róndje, niet van het hele blokje. Het
     blokje is rondje + sterrenrij, en het midden daarvan ligt ruim 9px láger --
     de weg liep dus net onder het hart van elke halte door. 5,15cqw is de halve
     hoogte van .dot (10,3cqw). */
  /* Het raakvlak van een halte: onzichtbaar, en groter dan het rondje zelf. */
  .tour-stop::before { content: ''; position: absolute; left: 50%; top: 5.15cqw;
    width: 12.5cqw; height: 12.5cqw; margin: -6.25cqw 0 0 -6.25cqw; border-radius: 50%; }
  .tour-stop.locked::before { display: none; }
  .tour-stop {
    position: absolute; transform: translate(-50%, -5.15cqw);
    width: 26cqw; border: none; cursor: pointer; font-family: inherit; color: var(--c-white);
    background: transparent; padding: 0; text-align: center; z-index: 1;
  }
  /* Minimale medaillon-stijl i.p.v. een 3D-knop: plat rondje, dunne rand,
     geen drop-shadow-lip. Een halte is een plek op een kaart, geen knop --
     de "tik me in" actie zit al in de losse Speel!-knop hieronder.
     Alle tegels zelfde maat, ongeacht staat -- alleen kleur/opaciteit
     vertelt het verhaal. "Gedaan" en "nu speelbaar" deelden hier bewust
     dezelfde volle goud-tint, omdat je op allebei kunt tikken. Maar op een
     route van zes haltes zijn er dan vijf even luide gouden schijven en één
     die net iets pulseert, en "waar speel ik nu" moet je erbij zoeken. Nu:
     vol goud = hier spelen, gouden randje = al gedaan (dezelfde
     "verzameld"-taal als .trophy-card.done). Op slot = ontkleurd. */
  /* Volledig ondoorzichtige vulling (geen glass-tint meer) -- anders schijnt
     de reisweg erdoorheen. */
  /* 10,3cqw: 6% kleiner dan de 11cqw hiervoor, zodat de tekening meer lucht krijgt.
     Het raakvlak blijft wél 11cqw -- .tour-stop::before hieronder legt er een
     onzichtbare schijf overheen, dus een vinger heeft nog steeds 52px. Kleiner
     maken zonder dat zou het mikken voor een vijfjarige moeilijker maken, en dat
     is geen ruil die je wil. */
  .tour-stop .dot { position: relative; width: 10.3cqw; height: 10.3cqw; margin: 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 6cqw; font-weight: 800; border: 0.55cqw solid var(--glass-white-30); background: var(--purple-shadow); }
  /* Een zachte schaduw onder het rondje in plaats van eromheen: net genoeg om de
     halte op de tekening te laten rústen in plaats van erboven te zweven. Bewust
     ingetogen -- een echte slagschaduw zou van de halte weer een knop maken. */
  .tour-stop .dot { box-shadow: 0 0.9cqw 1.6cqw rgba(12,2,26,.45); }
  /* het slotje hangt aan de rand van de halte i.p.v. het nummer te vervangen --
     zo blijft ook op een halte op slot te zien de hoeveelste show het is */
  .stop-lock { position: absolute; top: -0.5cqw; right: -0.5cqw; font-size: 4.6cqw; line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .tour-stop:active .dot { transform: scale(.92); }
  .tour-stop.locked { cursor: default; }
  /* een grayscale(1) filter over de paarse basiskleur oogde bijna zwart --
     gewoon de bestaande "uitgeschakeld/nog niet beschikbaar"-grijstint
     hergebruiken (dezelfde tokens als vroeger de knop-variant .btn.gray) */
  /* Op slot = nog niet aan de beurt, en dus rustiger: minder dekkend, een zachtere
     schaduw en een kleiner slotje. Niet grijzer of vager -- het moet een halte
     blijven die je herkent, alleen niet een die om aandacht vraagt. */
  .tour-stop.locked { opacity: .72; }
  .tour-stop.locked .dot { background: linear-gradient(180deg, var(--gray-top), var(--gray-bottom));
    border-color: rgba(255,255,255,.2); box-shadow: 0 0.6cqw 1.1cqw rgba(12,2,26,.3); }
  .tour-stop.locked .cstars { opacity: .62; }
  .tour-stop.locked .stop-lock { font-size: 3.8cqw; opacity: .9; }
  /* Hier speel je. Het brandpunt van de kaart, maar rustig: een warme gloed die
     langzaam ademt en een haartje schaal. Geen springende animatie -- een kind
     moet er náár kijken, niet van schrikken. */
  .tour-stop.next .dot { border-color: var(--gold-accent);
    background: linear-gradient(180deg, var(--gold-cta-top), var(--gold-cta-bottom));
    transform: scale(1.06);
    box-shadow: 0 0.9cqw 1.6cqw rgba(12,2,26,.5), 0 0 3.2cqw rgba(255,196,61,.5);
    animation: stopBreathe 2.8s ease-in-out infinite; }
  /* De huidige halte blijft het brandpunt: haar gloed is nu ook absoluut de sterkste,
     want die van de afgemaakte haltes is een derde zachter geworden. */
  @keyframes stopBreathe {
    0%, 100% { box-shadow: 0 0.9cqw 1.6cqw rgba(12,2,26,.5), 0 0 3.2cqw rgba(255,196,61,.45); }
    50%      { box-shadow: 0 0.9cqw 1.6cqw rgba(12,2,26,.5), 0 0 5.2cqw rgba(255,196,61,.72); }
  }
  .tour-stop.next:active .dot { transform: scale(.98); }
  .tour-stop.done .dot { border-color: var(--gold-accent); background: linear-gradient(180deg, rgba(255,214,90,.18), rgba(255,214,90,.06)), var(--purple-shadow); }
  /* pulseBtn animeert zelf al transform (scale) -- een :active transform
     zou dat gewoon overschrijven zolang de animatie loopt, dus tikfeedback
     op "next" gaat via filter (dat de animatie niet aanraakt) i.p.v. transform.
     Zelfde aanpak voor "done" erbij, voor identieke tikrespons in beide staten. */
  /* Een halte op drie sterren is áf: warm goud, met af en toe een glans die
     eroverheen glijdt -- dezelfde veeg als een klare trofee (shineSweep), alleen
     trager en zachter. Bewust géén schaalpuls: .next (waar je nú speelt) moet het
     luidste ding op de kaart blijven. Dit is het hele "ooh, die kan ik ook nog
     perfect maken"-duwtje: geen rood, geen uitroepteken, alleen verschil.
     Alleen op .done, zodat het nooit kan botsen met het goud van .next. */
  /* Een gouden lijst, geen gouden vulling: een volle warme tint over het paars
     wordt modderig bruin én slikt het stadsicoon op. De ring + de gloed eromheen
     dragen dus het signaal, en de vulling krijgt alleen een lichte warme waas.
     box-sizing is border-box, dus de dikkere rand verschuift niets. */
  .tour-stop.done.perfect .dot {
    overflow: hidden;
    border-width: 1.1cqw;
    background: linear-gradient(180deg, rgba(255,214,90,.22), rgba(255,193,61,.06)), var(--purple-shadow);
    /* De gloed eromheen was 5cqw op 55%; dat legde een tweede, veel grotere schijf
       over de tekening dan de halte zelf is. Op 3,3cqw / 38% (ongeveer een derde
       minder) houdt hij nog genoeg af tegen een drukke ondergrond zonder dat hij met
       de huidige halte concurreert. */
    box-shadow: 0 0 0 0.8cqw rgba(255,213,79,.16), 0 0 3.3cqw rgba(255,205,80,.38);
  }
  .tour-stop.done.perfect .dot::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-18deg);
    animation: shineSweep 4.5s ease-in-out infinite var(--shine-delay, 0s);
  }
  .tour-stop.done:active .dot, .tour-stop.next:active .dot { filter: brightness(.85); }
  /* De gloed en de ademhaling van de huidige halte staan hierboven (stopBreathe).
     Hier stond pulseBtn: een sprongetje van 9% elke 1,2s. Dat trok de aandacht wel,
     maar het bewoog ook constant in je ooghoek terwijl je de kaart bekijkt. */
  .tour-stop .cname { font-size: 14px; font-weight: bold; margin-top: 7px; }
  .tour-stop.next .cname { color: var(--gold-light); }
  .tour-stop.locked .cname { opacity: .6; }
  /* sterren als gewone tekstregel onder de naam i.p.v. een badge óp de tegel --
     geen aparte positionering/overlap meer nodig, past vanzelf altijd netjes */
  /* De sterrenrij is het zwakste element op een getekende kaart: gedimde grijze
     emoji op een lichte lucht verdwijnen gewoon. Een zachte donkere schaduw eronder
     kost niets en houdt ze leesbaar op elke ondergrond. */
  /* Kleiner (3,0 i.p.v. 3,3cqw) en strakker op elkaar, zodat het als één groepje
     onder de halte leest in plaats van als drie losse tekens. De donkere schaduw
     blijft -- die houdt ze leesbaar op elke ondergrond.

     Niet-behaalde sterren waren donkergrijs op halve dekking. Dat is stil bedoeld
     maar leest als vuil: drie grijze vlekken die net zoveel aandacht vragen als de
     gouden. Nu een spookster -- bijna wit en veel doorzichtiger. Hij zegt nog steeds
     "hier valt iets te halen" en verder niets. */
  .tour-stop .cstars { font-size: 3cqw; letter-spacing: -0.55cqw; opacity: .95;
    margin-top: 0.1cqw; text-align: center;
    filter: drop-shadow(0 0.22cqw 0.45cqw rgba(12,2,26,.55)); }
  .tour-stop .cstars .star-miss { opacity: .28; filter: grayscale(1) brightness(2.4); }
  /* de eigen ster staat vol in beeld, bovenop de huidige halte -- het
     stadsicoon blijft gewoon zichtbaar in de tegel eronder. Voeten landen
     net op de bovenrand van de tegel (klein overlapje voor het "staat erop"-
     gevoel + contactschaduw), niet halverwege: dieper zakken zou het
     gecentreerde stadsicoon onder haar voeten bedekken. Zelfde element voor
     de reisanimatie (zie runTravel): tijdens het huppelen staat ze op de
     vorige halte. */
  /* 21cqw was 2,1x de halte: op de bovenste halte van een wereld stak haar hoofd
     dan 19px buiten beeld (gemeten op 390x844). Op 13,1cqw is ze 1,3x de halte en
     past ze binnen de veilige zone -- zie docs/WORLD-ART-BRIEF.md. */
  .tour-hero { position: absolute; left: 50%; bottom: calc(100% - 2cqw); transform: translateX(-50%);
    width: 13.1cqw; pointer-events: none; z-index: 2; }
  .tour-hero svg { width: 100%; height: auto; display: block; }
  /* contactschaduw bij de voeten -- verkoopt het "staat ÓP de tegel" effect,
     zonder dit oogt ze net zo goed los zwevend erboven. Iets breder en zachter dan
     eerst, zodat ze op een getekende ondergrond ook echt ergens op staat. */
  .tour-hero::after { content: ""; position: absolute; left: 50%; bottom: 0.2cqw; transform: translateX(-50%);
    width: 9cqw; height: 2.4cqw; border-radius: 50%; background: rgba(12,2,26,.42); filter: blur(3px); }
  /* De Speel-knop is van de kaart verdwenen. Met acht haltes samen in beeld is de
     halte waar ze nú staat al het enige volgouden, pulserende medaillon mét de pop
     erbovenop -- een tweede gouden ding ernaast voegde niets toe, dekte de vorige
     halte af en ving zelfs de tikken die daarvoor bedoeld waren. De tegel is de
     knop. (Zie docs/PROGRESSION-REVIEW.md: "één duidelijke volgende actie".) */
  /* Hoge schermen: de route claimt de leegte in plaats van als smalle strook in
     het midden te zweven. Gemeten op 390x844 stond er 121px lucht boven en 127px
     onder de route; grotere haltes, ster en speelknop halen dat terug. De drempel
     staat op 760 (was 800) zodat ook de wat kortere telefoons meedoen. */

  /* heel smalle toestellen: topbalk compacter zodat naam + tellers samen passen */
  @media (max-width: 390px) {
    .chip-badge { font-size: 14px; padding: 5px 10px; }
    #screen-map .diamond-badge { font-size: 17px; padding: 6px 13px; }
    .map-portrait { width: 38px; height: 38px; }
    .map-portrait svg { top: -5px; width: 65px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .map-sky span, .tour-stop.next .dot, .avatar-holder.idle { animation: none; }
    /* het goud van een perfecte halte blijft staan; alleen de veeg verdwijnt */
    .tour-stop.done.perfect .dot::after { animation: none; opacity: 0; }
    .cq-listen, .cg-obj.pop, .cg-dot.pop { animation: none; }
    .cg-obj.pre, .cg-dot.pre { opacity: 1; transform: none; }
    .cg-obj.fade-out, .cg-dot.fade-out { animation: none; opacity: .12; }
    .df-dot.pre { opacity: 1; transform: none; }
    .df-dot.pop { animation: none; }
    .df-dot.fade-out { animation: none; opacity: .12; }
    .mem-inner { transition: none; }
    .mem-card.done .mem-face { animation: none; }
  }

  /* ---- Trofeeën ---- */
  /* kast-voortgang in de plakkende kop: hoeveel van de kast is gevuld */
  .kast-progress { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; max-width: 340px; margin: 2px auto 0; }
  .kast-progress-text { font-size: 13px; font-weight: 700; opacity: .85; text-align: center; }
  .kast-bar { width: 100%; height: 9px; border-radius: var(--r-pill); overflow: hidden; background: var(--glass-black-32); border: 1px solid var(--glass-white-14); }
  .kast-bar-fill { height: 100%; border-radius: var(--r-pill); background: var(--gold-accent); transition: width .6s ease; }
  /* de kast heeft planken: kleine themakopjes met een teller per plank */
  #trophy-shelves { width: 100%; max-width: 680px; }
  /* elke categorie zit in een eigen paneel: duidelijke visuele groepering */
  .shelf { background: var(--glass-black-18); border: 1px solid rgba(255,255,255,.12); border-radius: var(--r-md); padding: 6px 12px 13px; margin: 14px 0; }
  .shelf-title { margin: 4px 2px 9px; text-shadow: 0 1px 0 var(--glass-black-25); border-bottom: 1px solid var(--glass-white-13); padding-bottom: 7px; }
  .shelf-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 800; }
  .shelf-title .shelf-count { font-size: 12.5px; font-weight: 700; opacity: .95; background: var(--glass-black-30); border-radius: var(--r-pill); padding: 3px 11px; white-space: nowrap; }
  /* hele categorie compleet: zelfde goud-signaal als een behaalde trofee */
  .shelf-title .shelf-count.full { color: var(--gold-light); background: rgba(255,206,77,.25); opacity: 1; }
  /* flex i.p.v. grid, zelfde reden als .item-grid in de kleedkamer: de meeste
     plankjes hebben een oneven aantal trofeeën, en CSS Grid geeft elke rij
     dezelfde kolomposities -- de laatste, onvolledige rij bleef daardoor links
     hangen i.p.v. te centreren. flex-wrap + justify-content:center centreert
     elke rij apart, ook de laatste. */
  .trophy-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; width: 100%; align-items: stretch; }
  /* Vaste kolombreedte (flex-grow: 0) i.p.v. meegroeien. Met 'flex: 1 1 124px'
     verdeelden de kaarten in een vólle rij de hele breedte onder elkaar, maar een
     laatste, alleenstaande kaart had niemand om mee te delen en liep door tot zijn
     max-width -- die kaart werd dus zichtbaar bréder dan de kaarten erboven, precies
     op de plek waar hij al als enige gecentreerd stond. Een kaart mag nergens in de
     app van formaat wisselen, dus nu telt elke plank een vast aantal even brede
     kolommen en centreert justify-content de rij als geheel: de laatste kaart staat
     nog steeds midden onder de rij erboven, maar heeft nu dezelfde maat. */
  .trophy-card {
    position: relative; flex: 0 1 calc(50% - 4.5px); max-width: 190px;
    background: var(--glass-white-13); border: 2px solid var(--glass-white-30);
    border-radius: var(--r-md); padding: 12px 8px 11px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; transition: filter .12s;
  }
  /* filter i.p.v. background: werkt hetzelfde bovenop élke kaartstaat (locked,
     done, ready's gouden verloop, ...) zonder de per-staat achtergrondkleur te
     hoeven overschrijven -- zelfde soort hover-teruggave als .item-card in de
     kleedkamer, die hiervoor nog helemaal ontbrak */
  .trophy-card:hover { filter: brightness(1.08); }
  .trophy-card:active { transform: scale(.97); }
  .trophy-card .temoji { font-size: 36px; line-height: 1; height: 40px; }
  .trophy-card .tname { font-size: 15px; font-weight: bold; margin-top: 4px; line-height: 1.12; }
  .trophy-card .tdesc { font-size: 12.5px; opacity: .85; margin-top: 2px; line-height: 1.15; }
  /* drie kolommen zodra de plank het comfortabel trekt, vier op tabletbreedte --
     dezelfde kolomtelling die de oude 'auto-fill, minmax(124px, 1fr)' vanzelf koos,
     nu alleen expliciet, zodat álle kaarten op een plank even breed blijven. */
  @media (min-width: 560px) { .trophy-card { flex-basis: calc(33.333% - 6px); } }
  @media (min-width: 760px) { .trophy-card { flex-basis: calc(25% - 6.75px); } }
  /* 'Kast vol!' (eindtrofee) over de volle breedte */
  .trophy-card.wide { flex-basis: 100%; max-width: 100%; }
  /* ===== staten ===== */
  /* NIET GESTART: normale paarse kaart, icoon licht gedimd, lege dunne balk */
  .trophy-card.fresh .temoji { opacity: .78; }
  /* BEZIG: normale kaart, icoon vol, dunne balk met duidelijke vulling (geen glow).
     Neutrale, iets lichtere rand dan 'niet gestart' -- meteen te onderscheiden
     zonder de tekst te moeten lezen. Bewust GEEN blauw: blauw betekent overal
     elders in de app "geselecteerd/aan het bekijken" (kleedkamer), dus een
     blauwe rand hier zou een tweede, verwarrende betekenis aan diezelfde
     kleur geven. */
  .trophy-card.busy { border-color: rgba(255,255,255,.42); }
  /* BIJNA BEHAALD: sterke balkvulling + subtiele gouden glow (glow via inline style) */
  .trophy-card.almost .trophy-progress-fill { background: var(--gold-accent); }
  /* LOCKED: donkerder, icoon sterk gedimd, klein slotje (voorlopig sluimerend) */
  .trophy-card.locked { background: var(--glass-black-26); border-color: var(--glass-white-10); }
  .trophy-card.locked .temoji { filter: grayscale(1); opacity: .5; }
  .trophy-card.locked .tname { opacity: .6; }
  .trophy-card.locked .tdesc { opacity: .45; }
  .trophy-lock {
    position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; z-index: 3;
    background: rgba(30,15,55,.95); border: 2px solid var(--glass-white-40);
    box-shadow: var(--e-1);
  }
  /* BEHAALD: ingevuld, niet uitgedoofd.
     Was: de zwakste kaart van de plank -- lichtere rand en mindere vulling dan een
     kaart waar je nog aan bezig bent, plus 10% extra transparantie eroverheen. Een
     behaalde trofee zag er daardoor onaffer uit dan een onbegonnen trofee. Het enige
     echte "gewonnen"-signaal was een los 🏆-badge dat buiten de kaartrand hing --
     dubbelop bij trofeeën die zélf een beker als icoon hebben (Platina plaat), en
     overbodig op een scherm dat al 🏆 Trofeeënkast heet.
     Nu de volle 'verdiend'-taal die de rest van de app al spreekt (afgelopen stad op
     de kaart, aangetrokken stuk in de kleedkamer): gouden rand + zachte goudvulling,
     naam in goud. Vlak, zonder gloed en zonder beweging -- gloed en puls blijven
     exclusief van 'klaar om te openen', zodat goud-in-rust = verdiend en
     goud-dat-beweegt = doe hier iets. */
  .trophy-card.done { background: rgba(255,214,90,.10); border-color: var(--gold-accent); }
  .trophy-card.done .tname { color: var(--gold-light); }
  /* Het onderste vakje is de statusregel van élke kaart: voortgang + balk, 'Nog niet
     vrij', of '🎁 Open!'. Alleen 'behaald' liet het leeg -- die kaarten hielden een
     gat onderin terwijl de buren in dezelfde rij tot onderaan gevuld waren, en juist
     dat maakte de planken rommelig. Nu staat hier de stempel, op dezelfde regel als
     alle andere statussen. Omlijnd en stil tegenover de vólle, pulserende gouden pil
     van 'Open!': dezelfde vorm, andere toon -- af versus te doen. */
  .trophy-done-pill {
    display: block; text-align: center; border-radius: var(--r-pill);
    font-size: 13px; font-weight: 900; letter-spacing: .01em; padding: 4px 8px;
    color: var(--gold-light); background: rgba(0,0,0,.22); border: 1px solid rgba(255,214,90,.55);
  }
  /* onderste blok (status/voortgang) zakt netjes naar de kaartbodem */
  .trophy-bottom { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  /* tekstkleur volgt de balk: neutraal wit-lavendel = bezig (default), goud = bijna,
     gedempt = niet gestart/locked. Geel/goud blijft dus uitsluitend "nu actief/aan"
     betekenen (zie kleedkamer); voortgang die nog niet bijna klaar is, is neutraal. */
  .trophy-progress-text { font-size: 13px; font-weight: 700; color: var(--lavender-text); min-height: 17px; line-height: 1.15; }
  .trophy-progress-text.sub { color: var(--muted-lavender-text); font-weight: 600; opacity: .75; }
  .trophy-card.fresh .trophy-progress-text { color: var(--muted-lavender-text); opacity: .82; }
  .trophy-card.almost .trophy-progress-text { color: var(--gold-accent); }
  /* dunne progressbalk onderaan de kaart */
  .trophy-progress { height: 7px; border-radius: var(--r-pill); overflow: hidden; background: rgba(0,0,0,.34); border: 1px solid var(--glass-white-18); }
  /* neutrale wit-lavendel vulling = bezig/actief; alleen "bijna" en "nu aan"
     (kleedkamer) krijgen goud -- blauw is hier bewust weg (zie .trophy-card.busy). */
  .trophy-progress-fill { height: 100%; border-radius: var(--r-pill); transition: width .5s ease; background: rgba(255,255,255,.75); }
  /* korte uitleg onder een categoriekop (bv. bij thema-looks) */
  .shelf-note { font-size: 12px; font-weight: 600; color: var(--lavender-text); opacity: .82; margin: -3px 2px 9px; }
  /* ===== KLAAR OM TE OPENEN =====
     Was: een volledig ander kaartje -- gouden vlak, 🎁 in plaats van het eigen
     icoon, en "Open trofee!" als kop met de échte naam als klein bijschrift.
     Vijf klaarliggende trofeeën naast elkaar zagen er daardoor uit als vijf
     keer hetzelfde ding. Nu gewoon de normale kaart (eigen icoon, eigen naam,
     eigen beschrijving) met een gouden rand, en "🎁 Open!" in het onderste
     vakje waar anders de voortgangsbalk staat. ===== */
  .trophy-card.ready {
    border-color: var(--gold-accent); background: rgba(255,214,90,.14);
    box-shadow: 0 0 14px rgba(255,170,0,.4);
  }
  .ready-open {
    display: block; text-align: center; color: var(--ink-on-gold); background: var(--gold-accent);
    font-size: 13.5px; font-weight: 900; letter-spacing: .01em;
    border-radius: var(--r-pill); padding: 5px 8px;
    animation: readyPulse 1.4s ease-in-out infinite;
  }
  @keyframes readyPulse { 0%,100% { transform: scale(1); box-shadow: 0 4px 13px rgba(255,170,0,.45); } 50% { transform: scale(1.03); box-shadow: 0 6px 22px rgba(255,170,0,.75); } }
  /* dé gouden mijlpaal-pil: één component voor "rang omhoog" en "trofee klaar",
     op het eindscherm (.end-milestone) en in de trofeeënkast. Hoogstens één
     tegelijk in beeld. */
  .gold-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--ink-on-gold); font-weight: 800; font-size: 16.5px; font-family: inherit;
    background: linear-gradient(180deg, var(--gold-cta-top), var(--gold-cta-bottom)); border: none; border-radius: var(--r-pill);
    padding: 10px 18px; box-shadow: 0 4px 14px rgba(255,170,0,.45);
    animation: readyPulse 1.4s ease-in-out infinite; cursor: pointer;
  }
  .gold-pill:active { transform: scale(.96); }
  /* ---- Claim-feestje: klein, vrolijk, blijft open tot er getikt wordt ---- */
  .trophy-pop-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(20,4,40,.45); animation: popFade .25s ease; cursor: pointer;
  }
  .trophy-pop-overlay.closing { animation: popFade .3s ease reverse forwards; }
  .trophy-pop { padding: 22px 30px; }
  .tp-head { font-size: 16px; font-weight: 800; color: var(--gold-light); }
  .tp-emoji { font-size: 66px; line-height: 1.1; margin: 4px 0; filter: drop-shadow(0 0 10px rgba(255,215,64,.8)); }
  .tp-name { font-size: 20px; font-weight: 800; color: var(--c-white); }
  .tp-joepie { font-size: 15px; font-weight: 700; color: var(--pink-light); margin-top: 4px; }
  @keyframes popFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { 0% { transform: scale(.4) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.1) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  /* ---- Ster-status omhoog: dé grote mijlpaal. Het nieuwe rang-icoon knalt naar
     voren met een uitbarsting van datzelfde icoon eromheen. ---- */
  .rankup-overlay {
    position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(circle at 50% 44%, rgba(74,20,140,.5), rgba(20,4,40,.66)); animation: popFade .3s ease;
  }
  .rankup-overlay.closing { animation: popFade .3s ease reverse forwards; }
  .rankup-core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
  .rankup-sparks { position: absolute; left: 50%; top: 50px; width: 0; height: 0; }
  .rankup-spark { position: absolute; left: 0; top: 0; font-size: 30px; opacity: 0; animation: rankSpark 1s ease-out both; }
  .rankup-badge { font-size: 94px; line-height: 1; filter: drop-shadow(0 6px 16px rgba(0,0,0,.55)); animation: rankBadgePop .7s cubic-bezier(.2,1.5,.4,1) both; }
  .rankup-label { font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-light); text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: rankTextRise .5s ease .28s both; }
  .rankup-name { font-size: clamp(26px, 8vw, 34px); font-weight: 900; color: var(--c-white); text-shadow: 0 0 16px var(--gold-cta-bottom), 0 3px 0 rgba(0,0,0,.35); animation: rankTextRise .5s ease .4s both; }
  @keyframes rankBadgePop { 0% { transform: scale(0) rotate(-45deg); } 60% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes rankTextRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes rankSpark {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    22% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05); }
  }

  /* ===== Trofee-feestje, versie "dopamine" =====
     Vier momenten: (1) de klare kaart lokt met glans + wiebel, (2) de tik geeft
     een ripple, (3) het openen is een schatkist die openknalt met stralen,
     schokgolf en een confetti-kanon, (4) de behaalde kaart glimt kort na. */

  /* (1) Klare trofee: een glans-veeg glijdt over de kaart + het cadeau wiebelt */
  .trophy-card.ready { overflow: hidden; }
  .trophy-card.ready::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%; z-index: 3; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg);
    animation: shineSweep 2.6s ease-in-out infinite;
  }
  @keyframes shineSweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
  .trophy-card.ready .temoji { animation: giftWiggle 2.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes giftWiggle {
    0%, 58%, 100% { transform: rotate(0) translateY(0); }
    66% { transform: rotate(-9deg); } 74% { transform: rotate(8deg); }
    82% { transform: rotate(-5deg) translateY(-2px); } 90% { transform: rotate(3deg); }
  }

  /* (2) Tik-ripple: een lichtkringetje dat vanaf de vingerplek uitdijt */
  .tap-ripple {
    position: fixed; z-index: 93; pointer-events: none; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,150,.85), rgba(255,236,150,0) 70%);
    transform: translate(-50%, -50%) scale(0); animation: tapRipple .5s ease-out forwards;
  }
  @keyframes tapRipple { 0% { transform: translate(-50%,-50%) scale(0); opacity: .9; } 100% { transform: translate(-50%,-50%) scale(9); opacity: 0; } }

  /* (3) Openen: schatkist-moment met stralen, schokgolf en emoji-inslag */
  .tp-stage { position: relative; width: 150px; height: 118px; margin: 6px auto 2px; display: flex; align-items: center; justify-content: center; }
  .tp-chest { position: absolute; z-index: 2; font-size: 74px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); animation: chestShake .5s ease-in-out infinite; }
  @keyframes chestShake { 0%,100% { transform: rotate(-5deg) translateY(0); } 25% { transform: rotate(5deg) translateY(-2px); } 50% { transform: rotate(-4deg); } 75% { transform: rotate(4deg) translateY(-2px); } }
  .tp-emoji { position: relative; z-index: 3; font-size: 66px; line-height: 1.1; filter: drop-shadow(0 0 10px rgba(255,215,64,.85)); opacity: 0; transform: scale(.2); }
  .tp-rays {
    position: absolute; width: 210px; height: 210px; z-index: 1; opacity: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,236,150,.5) 0deg 9deg, transparent 9deg 21deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
  }
  .tp-ring { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 4px solid rgba(255,236,150,.9); z-index: 1; opacity: 0; }
  .trophy-pop .tp-name, .trophy-pop .tp-joepie { opacity: 0; }
  .trophy-pop.burst .tp-chest { animation: chestBurst .4s ease forwards; }
  @keyframes chestBurst { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(1.25) rotate(-4deg); } 100% { transform: scale(1.75); opacity: 0; } }
  /* Onthulling én daarna: het emoji verschijnt met een bounce en blijft dan zacht
     wiegen zolang de trofee 'open' staat (tot je sluit). */
  .trophy-pop.burst .tp-emoji { animation: emojiReveal .55s cubic-bezier(.2,1.5,.4,1) .12s forwards, emojiBob 2.6s ease-in-out .75s infinite; }
  @keyframes emojiReveal { 0% { opacity: 0; transform: scale(.2) rotate(-12deg); } 60% { opacity: 1; transform: scale(1.18) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes emojiBob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05); } }
  /* De lichtstralen blijven traag ronddraaien terwijl de trofee open is. */
  .trophy-pop.burst .tp-rays { animation: raysReveal .5s ease .12s forwards, raysSpin 10s linear .12s infinite; }
  @keyframes raysReveal { 0% { opacity: 0; } 100% { opacity: .5; } }
  @keyframes raysSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .trophy-pop.burst .tp-ring { animation: ringOut .55s ease-out .12s forwards; }
  @keyframes ringOut { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(3.4); } }
  .trophy-pop.burst .tp-name { animation: rankTextRise .45s ease .25s both; }
  .trophy-pop.burst .tp-joepie { animation: rankTextRise .45s ease .38s both; }

  /* Confetti-kanon: stukjes vliegen vanuit één punt naar buiten (met lichte zwaartekracht) */
  .burst-bit { position: fixed; z-index: 92; pointer-events: none; font-size: 24px; will-change: transform, opacity; animation: burstOut .95s cubic-bezier(.15,.6,.3,1) forwards; }
  @keyframes burstOut {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
  }

  /* (4) Net behaald: een eenmalige gouden shimmer over de kaart. Blijft binnen de
     kaart (inset:0 + verschuivende gradient); z-index 2 houdt 'm onder een eventueel
     hoekbadge (het slotje staat op z-index 3). */
  .trophy-card.just-claimed::after {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
    background: linear-gradient(105deg, transparent 38%, rgba(255,236,150,.7) 50%, transparent 62%);
    background-size: 250% 100%; background-position: 120% 0;
    animation: claimShimmer .9s ease-out forwards;
  }
  @keyframes claimShimmer { from { background-position: 120% 0; } to { background-position: -40% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .trophy-card.ready, .ready-open { animation: none; }
    .trophy-card.ready::after, .trophy-card.ready .temoji, .trophy-card.just-claimed::after { animation: none; }

    .tp-chest, .tp-rays, .tp-ring, .burst-bit, .tap-ripple { display: none; }
    .trophy-pop .tp-name, .trophy-pop .tp-joepie, .trophy-pop.burst .tp-emoji { opacity: 1; transform: none; animation: none; }
    .rankup-badge, .rankup-label, .rankup-name { animation: none; }
    .rankup-spark { display: none; }
  }
  /* geel/goud stipje op het Trofeeën-tabblad zolang er iets nieuws in de kast ligt —
     zelfde kleurtaal als de rest van de trofee-elementen (banner, kast-balk, ready-kaart) */
  .nav-item { position: relative; }
  .nav-item .nav-dot {
    position: absolute; top: 3px; right: calc(50% - 22px); width: 12px; height: 12px;
    border-radius: 50%; background: var(--gold-accent); border: 2px solid var(--c-white); display: none;
    box-shadow: 0 1px 4px var(--glass-black-40);
  }
  .nav-item.has-new .nav-dot { display: block; }
  @media (max-width: 520px) {
    /* gelijke flexibele zijkolommen: de titel blijft écht in het schermmidden,
       ook nu de linkercel leeg is (met auto|1fr|auto hing hij ~47px naar links) */
    .screen-header { grid-template-columns: 1fr auto 1fr; gap: 8px; }
    .screen-header .header-title { font-size: 20px; overflow: hidden; text-overflow: ellipsis; }
  }

  /* ---- Level einde ---- */
  /* verticaal gecentreerd via veilige auto-marges (knipt nooit af bij overloop) */
  /* Wit glas op 14% was net genoeg om op een vlak verloop te bestaan, maar het
     is geen oppervlak: de gouden pil, de drie vakjes en de juichtekst zweefden
     er meer bovenop dan erin. Nu een echt donker paneel in dezelfde taal als de
     plakkende kop -- dat leest ook straks nog, als er licht achter staat. */
  .result-card {
    background: rgba(32,8,54,.80);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid var(--glass-white-22); box-shadow: var(--e-2);
    border-radius: var(--r-lg); padding: 18px 22px 20px; text-align: center;
    width: 100%; max-width: 420px; margin: auto 0;
  }
  /* de titel is hier de kop van een kaart, niet van een scherm: kleiner dan de
     .title elders, zodat de sterren eronder de blikvanger blijven */
  .result-card .title { font-size: clamp(22px, 6vw, 30px); margin: 2px 0 0; }
  /* eigen klasse i.p.v. de vorige losse inline width/height -- net als de andere
     paspop-scènes (.dress-stage, .show-stage) nu met eigen smalle-scherm-maat,
     zodat 'm ook op een laag/liggend toestel nooit afgesneden wordt */
  .end-stage { width: 150px; height: 168px; margin: 4px auto 0; }
  .end-text { font-size: 18px; }
  .result-stars { font-size: 48px; letter-spacing: 4px; margin: 6px 0 2px; }
  /* korte schermen: het eindscherm moet ook op een 320x568 in één beeld passen --
     het is een vier-seconden-moment, daar hoort geen scrollen bij */
  @media (max-height: 740px) {
    .result-card { padding: 11px 16px 10px; }
    .result-card .title { font-size: clamp(19px, 5.4vw, 24px); }
    .end-stage { width: 104px; height: 116px; }
    .result-stars { font-size: 36px; letter-spacing: 2px; margin: 3px 0 0; }
    .end-text { font-size: 15px; }
    .earn-line { gap: 6px; margin: 7px 0 8px; }
    .earn-chip { font-size: 14px; padding: 7px 4px; }
    .end-milestone { min-height: 30px; margin-bottom: 8px; }
    .milestone-hint { font-size: 13px; padding: 6px 12px; }
    .end-actions { gap: 7px; }
    .end-actions .btn.big { font-size: 20px; padding: 11px 18px; }
    .end-actions .btn.soft { font-size: 15px; padding: 9px 16px; }
    .gold-pill { font-size: 15px; padding: 8px 14px; }
  }
  .result-stars span { display: inline-block; }
  /* gemiste ster: dof én kleurloos — zelfde taal als op de reiskaart */
  .result-stars .dim { opacity: .25; filter: grayscale(1); }
  /* Opbrengst: altijd dezelfde drie vakjes, altijd in dezelfde volgorde en
     dezelfde breedte -- 💎 verdiend · ⭐ sterren · 👏 publiek. Het was een rij
     losse pillen die op een telefoon in 1/2/1 afbrak, met wisselend aantal
     chips, plús een rangpil en een trofeebanner erbij: zes gouden/gekleurde
     dingen onder elkaar op precies het scherm dat één ding moet vieren.
     Een nul tonen mag: dat maakt de fanmeter zichtbaar dat hij ergens toe leidt. */
  .earn-line { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
  .earn-chip { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 16px; font-weight: bold; line-height: 1;
    background: var(--glass-black-30); border-radius: var(--r-pill); padding: 9px 6px; }
  .earn-chip.dia { background: rgba(41,182,246,.34); }
  .earn-chip.star { background: rgba(255,215,64,.26); }
  .earn-chip.fan { background: rgba(255,64,129,.28); }
  /* Mijlpaal: precies één regel, en hoogstens één ding. Volgorde van belang:
     nieuwe ster-status > nieuwe trofee > hoe ver nog tot de volgende status.
     De eerste twee zijn een beloning (gouden pil, tikbaar); de derde is een
     vooruitblik en blijft daarom bewust stil (gestippeld, niet pulserend). */
  .end-milestone { margin: 0 0 14px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
  .milestone-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 700;
    color: var(--gold-light); background: rgba(255,215,64,.14); border: 1px dashed rgba(255,215,64,.45);
    border-radius: var(--r-pill); padding: 8px 15px; }
  .end-actions { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .end-actions .btn { width: 100%; max-width: 320px; }
  .end-actions .btn.big { font-size: 23px; padding: 15px 20px; }

  /* ---- Kleedkamer ----
     Opbouw: vaste kop (titel + 💎 + paspop + tabbladen) blijft plakken bovenaan,
     het rek met spulletjes scrollt eronder door, en de actiebalk (passen/kopen)
     zit vast boven de navigatie. Zo is elke tik meteen zichtbaar op de paspop. */
  #screen-dress { padding-bottom: 190px; }
  /* De kop was ooit 0-407px van een 844px scherm: titel, paspop, een
     Spullen/Looks-schakelaar én acht categorieën in twee rijen. De schakelaar
     stond daarna naast de paspop, met de dobbelsteen eronder -- een blok van
     342px dat midden in een band van 459px zweefde, met de categorierij eronder
     wél over de volle breedte. Twee uitlijningen boven elkaar, plus een knop
     (verras me) die bij geen van beide groepen hoorde: dat las als scheef.
     Nu is er één keuzerij: "Looks" is gewoon de eerste categorie. Vanuit het
     kind gezien is "laat me outfits zien" dezelfde vraag als "laat me jurken
     zien" -- twee aparte bedieningen voor één vraag was de eigenlijke fout. */
  .hub-sticky {
    position: sticky; top: -12px; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    width: calc(100% + 24px); margin: -12px -12px 12px; padding: 12px 12px 10px;
    /* was .92 -- dat is in de praktijk ondoorzichtig, en straks een balk dwars
       door de tekening heen. Op .82 schuift de inhoud er zichtbaar onderdoor. */
    background: rgba(43,7,71,.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--glass-white-14);
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    box-shadow: var(--e-2);
  }
  .hub-sticky .screen-header { margin-bottom: 4px; }
  /* de rand-/gloedbehandeling zit nu in de gedeelde .stage-frame (zie .stage
     hierboven) -- hier alleen nog de eigen afmeting van de kleedkamer-scène */
  .dress-stage { width: 208px; height: 175px; }
  .dress-stage .deco { font-size: 20px; }
  @media (max-height: 700px) { .dress-stage { width: 160px; height: 134px; } }
  /* 🎲 verras me: trekt een willekeurige outfit uit wat ze al bezit. Hoort bij
     háár, dus staat hij als merkje op de rand van het podiumkader -- precies het
     patroon dat de spelerskeuze al gebruikt voor het ▶-merkje (.play-mark). Eén
     rand, geen extra ringen: dát was de klacht, niet de plek. */
  .stage-wrap { position: relative; display: flex; justify-content: center; }
  .shuffle-btn {
    position: absolute; right: -6px; bottom: -6px; width: 42px; height: 42px;
    border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    font-size: 20px; line-height: 1; font-family: inherit;
    border: 2px solid rgba(255,255,255,.75); box-shadow: var(--e-1);
    background: linear-gradient(180deg, var(--purple-light), var(--purple-mid));
    transition: transform .15s;
  }
  .shuffle-btn:hover { transform: scale(1.06); }
  .shuffle-btn:active { transform: scale(.94); filter: brightness(.88); }
  /* Eén scrollende rij met alleen iconen -- alleen de categorie die aanstaat zet
     er zijn woord bij. Het was een vaste 4x2-grid waarin de helft van de labels
     werd afgekapt ("Schoe…", "Microf…", "Acces…"): een emoji plus een half woord
     is slechter dan één van de twee. Twee rijen worden zo één rij, en het woord
     staat er nog steeds -- alleen bij de categorie waar je nú in kijkt. */
  .shop-tabs-wrap { width: 100%; max-width: 960px; margin-top: 7px; }
  .shop-tabs {
    display: flex; gap: 6px; padding: 2px 4px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth;
  }
  .shop-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    font-family: inherit; font-size: 15px; font-weight: bold; border: none; cursor: pointer;
    padding: 0 12px; border-radius: var(--r-pill); color: var(--c-white); background: var(--glass-white-18);
    transition: transform .07s, background .12s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; min-width: 46px; flex: none;
  }
  .tab-btn .tab-ico { font-size: 21px; line-height: 1; }
  .tab-label { white-space: nowrap; }
  /* Looks staat vooraan en houdt altijd zijn woord: het is geen kledingsoort maar
     een andere manier van kijken, dus het mag zich van de acht categorieën
     onderscheiden. Het streepje erna maakt die scheiding zichtbaar. */
  .tab-btn.looks { margin-right: 9px; position: relative; }
  .tab-btn.looks::after {
    content: ''; position: absolute; right: -6px; top: 20%; bottom: 20%;
    width: 1.5px; border-radius: 1px; background: var(--glass-white-22);
  }
  .tab-btn:active { transform: scale(.95); }
  .tab-btn.active { background: linear-gradient(180deg, var(--blue-fill-bottom), var(--blue-fill-top)); color: var(--purple-shadow); }
  /* flex i.p.v. grid: bij een oneven aantal spulletjes bleef het laatste kaartje
     in een CSS-grid altijd in de eerste kolom hangen (grid deelt élke rij
     dezelfde kolomposities toe), dus links uitgelijnd met een lege plek ernaast
     in plaats van gecentreerd. flex-wrap + justify-content:center centreert
     élke rij apart, vol of niet -- ook de laatste, hoe je ook telt. */
  .item-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 680px; }
  .item-card {
    position: relative; flex: 1 1 130px; max-width: 190px;
    background: var(--glass-white-13); border: 2px solid var(--glass-white-35);
    border-radius: var(--r-md); padding: 10px; text-align: center; cursor: pointer;
    transition: transform .07s, background .12s, border-color .12s, box-shadow .12s;
  }
  .item-card:hover { background: var(--glass-white-22); }
  .item-card:active { transform: scale(.97); }
  /* Kaart-staten: blauw = "hier kijk je naar", goud = "dit staat aan". De blauwe
     variant had ook nog een 3px ring én een schaalsprong; dat was een vierde
     signaal in een raster dat er al drie heeft, terwijl de paspop erboven de
     preview al veel duidelijker laat zien. Alleen de rand blijft. */
  .item-card.selected { background: rgba(56,189,248,.16); border-color: var(--blue-text); }
  .item-card.equipped { border-color: var(--gold-accent); background: rgba(255,214,90,.10); box-shadow: 0 0 12px rgba(255,215,64,.48); }
  .item-card.selected.equipped { border-color: var(--gold-accent); box-shadow: 0 0 12px rgba(255,215,64,.48); }
  /* .owned and .selected are two plain (non-combined) classes with identical
     specificity, both setting background/border-color -- .owned happened to
     be declared later in the file, so it silently won that tie and previewing
     an owned item showed a half-gray, half-blue card (gray body, blue ring
     only, since .owned doesn't touch box-shadow/transform). Ownership is
     already communicated by the status badge below, so the card itself
     should just show the same full "you're looking at this" blue as any
     other selected item -- this combined selector's higher specificity wins
     outright, no reliance on rule order. */
  .item-card.owned.selected { background: rgba(56,189,248,.16); border-color: var(--blue-text); }
  /* zelfde tie als hierboven, maar dan voor :hover -- .owned/.equipped/.selected
     zetten allemaal hun eigen achtergrond, met dezelfde specificiteit als de
     kale .item-card:hover regel. Die verliest dus stilzwijgend de tie (bron-
     volgorde), en een owned/equipped/selected kaartje reageerde daardoor
     helemaal niet op hover terwijl een niet-bezeten kaartje wél oplichtte.
     Hier expliciet per staat een eigen, iets lichtere hover-tint (in de eigen
     kleur van die staat) zodat ieder kaartje evengoed op hover reageert. */
  .item-card.owned:hover { background: rgba(180,184,196,.18); }
  .item-card.equipped:hover { background: rgba(255,214,90,.18); }
  .item-card.selected:hover, .item-card.owned.selected:hover { background: rgba(56,189,248,.24); }
  .item-card.selected.equipped:hover { background: rgba(255,214,90,.18); }
  .item-card.just-bought { animation: boughtPop .85s ease; }
  @keyframes boughtPop { 0% { transform: scale(1); } 35% { transform: scale(1.08); box-shadow: 0 0 22px rgba(255,215,64,.75); } 100% { transform: scale(1); } }
  /* Eén miniatuur-zone voor álle spullen. Er waren er drie: een getekende jurk
     zweefde vrij op een basislijn, een emoji hing eronder zonder schaduw, en een
     podium was een wit omrand bolletje van 46px. Dezelfde soort dingen zagen er
     dus per categorie anders uit. Nu staat alles in hetzelfde vak van 52px, op
     dezelfde optische hoogte en met dezelfde slagschaduw; wat verschilt is nog
     alleen waar de tekening vandaan komt (getekend of emoji). */
  .item-thumb { height: 52px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
  .item-thumb svg { height: 52px; width: auto; display: block; filter: drop-shadow(0 2px 3px var(--glass-black-30)); }
  .item-thumb .thumb-emo { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 3px var(--glass-black-30)); }
  /* een podium is een plek, geen voorwerp: zijn kleur ís het item, dus een klein
     decorvlak met het herkenningsicoon erop -- in hetzelfde vak, zelfde schaduw */
  .item-thumb .thumb-stage {
    width: 46px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center;
    font-size: 22px; border: 1.5px solid rgba(255,255,255,.5);
    filter: drop-shadow(0 2px 3px var(--glass-black-30)); text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .item-thumb .thumb-swatch { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); }
  .item-name { font-size: 14px; font-weight: bold; overflow-wrap: break-word; hyphens: auto; }
  .item-status {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 21px; margin-top: 5px; padding: 3px 9px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 800; line-height: 1; white-space: nowrap;
    background: var(--glass-black-24); color: var(--muted-text-2);
  }
  .item-status.price { color: var(--gold-light); background: rgba(255,179,0,.16); }
  .item-status.need { color: var(--gold-accent); background: var(--glass-black-30); opacity: .88; }
  .item-status.owned { color: var(--muted-text-3); background: rgba(180,184,196,.25); }
  .item-status.on { color: var(--ink-on-gold); background: var(--gold-accent); }
  .item-status.new { color: var(--ink-on-gold); background: var(--gold-accent); animation: readyPulse 1.4s ease-in-out 2; }

  /* ---- Looks-modus: complete outfits als spaardoel, dwars door de categorieën
     heen. Elk stukje is een mini-versie van de gewone kleren-kaart (zelfde
     miniatuur + dezelfde rand-taal: geen rand/dof = ontbreekt, grijs = bezit,
     goud+gloed = nu aan) i.p.v. een tekstregel -- zo oogt de looks-pagina als
     een natuurlijke uitbreiding van de Kleren-pagina, niet als iets aparts. */
  .item-grid.looks-view { flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; max-width: 560px; gap: 10px; }
  /* kaart houdt altijd dezelfde vorm/structuur/hoogte aan, ongeacht status of
     hoeveel stukjes een look heeft -- positie in de lijst verandert nooit (zie
     renderLookGoals). De hele kaart is zelf de "trek aan wat ik heb"-actie
     (geen apart knopje/teller meer nodig: de stukjes-rand toont de voortgang
     al goud-op-goud zodra alles aan staat), dus de kop blijft kaal: alleen
     icoon + naam, geen teller of voortgangsbalk. */
  .look-goal {
    height: 136px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--glass-white-10); border: 1.5px solid var(--glass-white-14);
    border-radius: var(--r-md); padding: 10px 12px; text-align: left; cursor: pointer;
    transition: transform .07s;
  }
  .look-goal:active { transform: scale(.98); }
  .look-goal.flash { animation: lookFlash 1.4s ease; }
  @keyframes lookFlash { 0%, 100% { box-shadow: none; } 25%, 60% { box-shadow: 0 0 0 2px var(--gold-accent), 0 0 16px rgba(255,214,90,.55); } }
  .look-goal-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
  .look-goal-head .lemoji { font-size: 22px; line-height: 1; }
  .look-goal-head .lname { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* stukjes-rij: mini-kaartjes, dezelfde miniaturen + rand-kleurtaal als .item-card.
     Gelijke flex-breedte (i.p.v. wrap) zodat de rij altijd op één regel staat,
     hoe je ook telt (meestal 4 stukjes, regenboogster heeft er 5). */
  .look-pieces { flex: 1; display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .look-piece {
    flex: 1 1 0; min-width: 0; height: 72px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; text-align: center;
    border-radius: var(--r-sm); padding: 3px 2px; transition: transform .07s, background .12s;
  }
  .look-piece:active { transform: scale(.94); }
  /* vaste, compacte icoon-zone: elk stukje staat zo op dezelfde basislijn, strak
     om het icoon heen, ongeacht of het een svg-tekening, emoji of kleurbolletje is. */
  .look-piece .item-thumb { height: 30px; width: 100%; display: flex; align-items: center; justify-content: center; margin: 0 0 3px; }
  .look-piece .item-thumb svg { height: 24px; width: auto; }
  /* icoon-gewicht in balans: kleine/smalle vormen (schoenen, micro, bril e.d.
     via emoji) iets groter, van nature grote vormen (jurk) juist iets kleiner --
     anders oogt de rij ongelijk terwijl de stukjes zelf gelijk belangrijk zijn. */
  .look-piece[data-cat="dress"] .item-thumb svg { height: 21px; }
  /* shirt-met-broek is smaller dan een jurk: op 21px zou het stukje kleiner
     ogen dan de emoji ernaast, terwijl het even belangrijk is */
  .look-piece[data-cat="dress"] .item-thumb.smal svg { height: 26px; }
  .look-piece[data-cat="shoes"] .item-thumb svg { height: 29px; }
  .look-piece[data-cat="mic"] .item-thumb svg { height: 27px; }
  .look-piece .item-thumb .thumb-emo { font-size: 22px; line-height: 1; }
  .look-piece .item-thumb .thumb-stage { width: 24px; height: 21px; font-size: 12px; border-width: 1px; border-radius: 5px; }
  .look-piece .item-thumb .thumb-swatch { width: 22px; height: 22px; border-width: 1px; }
  .look-piece .lp-name {
    font-size: 10px; font-weight: 700; line-height: 1.15; color: var(--muted-lavender-text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  /* precies dezelfde staten als .item-card: ontbreekt = dof/grijswaarden,
     bezit = zachtgrijs, nu aan = goud + gloed */
  .look-piece.miss { opacity: .45; }
  .look-piece.miss .item-thumb { filter: grayscale(1); }
  .look-piece.have { background: rgba(180,184,196,.16); }
  .look-piece.have .lp-name { color: var(--muted-text-3); }
  .look-piece.on { background: rgba(255,214,90,.16); box-shadow: 0 0 0 1.5px var(--gold-accent); }
  .look-piece.on .lp-name { color: var(--gold-light); }

  /* bezit/aan staat op het kaartje via rustige kaartkleur: grijs = hebben, goud = aan. */
  .item-card.owned { border-color: rgba(180,184,196,.64); background: rgba(180,184,196,.10); }
  /* actiebalk: naam + prijs + dé knop, altijd in beeld boven de navigatie */
  .dress-bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 39;
    display: none; align-items: center; gap: 10px; width: min(94vw, 430px); min-height: 52px;
    background: rgba(30, 4, 52, .86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid var(--glass-white-22); border-radius: var(--r-lg);
    padding: 10px 14px; box-shadow: var(--e-2);
  }
  .dress-bar .db-info { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; text-align: left; white-space: nowrap; overflow: hidden; }
  .dress-bar .db-name { font-size: 16.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dress-bar .db-sub { flex: 0 1 auto; min-width: 0; font-size: 13.5px; opacity: .92; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dress-bar .db-highlight { color: var(--gold-accent); font-weight: 700; }
  .dress-bar .btn.small { white-space: nowrap; flex-shrink: 0; }
  /* wegvliegende diamant bij een aankoop */
  .fly-dia { position: fixed; z-index: 95; font-size: 22px; pointer-events: none; }

  /* ---- Instellingen (ouder-dashboard) ---- */
  .settings-sheet { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 14px; }

  /* zelfde donkerpaarse .hub-sticky-kop als de rest van de app: ← terug ·
     Instellingen · (opgeslagen-bevestiging), met de profielkiezer en de
     Voortgang|Instellen-navigatie er direct onder, ook altijd in beeld */
  /* max-width: zonder dit rekt de balk op brede (desktop) schermen uit tot de
     volle breedte van .hub-sticky -- dan wordt de geselecteerde knop een groot
     leeg goud blok en zweeft de tekst van de andere knop eenzaam ver weg aan
     de andere kant. Blijft op smalle schermen gewoon 100% breed. */
  /* ==== Ouderdeel: twee navigatieniveaus, en ze moeten er ánders uitzien ====
     Hiervoor waren het twee identieke .segmented-sporen, pal op elkaar: niets
     vertelde dat het ene "wiens gegevens" kiest en het andere "wat daarover".
     Niveau 1 (wie) is nu een open, scrollende rij portretten -- geen spoor
     eromheen, want juist dat spoor laat iets als tabbladen lezen. Niveau 2 (wat)
     houdt het omsloten spoor. Zelfde max-width, dus ze lijnen links uit. */
  .who-row {
    display: flex; gap: 6px; padding: 2px 4px; width: 100%; max-width: 460px;
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .who-row::-webkit-scrollbar { display: none; }
  /* hergebruikt .tab-btn uit de kleedkamer; alleen het portret is nieuw */
  .who-btn { padding-left: 5px; gap: 8px; min-height: 48px; }
  .who-portrait { width: 38px; height: 38px; }
  .who-portrait svg { top: -5px; width: 65px; }
  /* Bewust NIET het blauw van .tab-btn.active: blauw betekent in deze app
     "actieve navigatie", en een ster kiezen is geen navigatie maar het bepalen
     van de context (wiens gegevens). Paars is de kleur van gewone keuzes, net
     als bij .chip.on. Zo verschillen de twee niveaus in vorm en in kleur. */
  .who-btn.active {
    background: linear-gradient(180deg, var(--purple-light), var(--purple-mid));
    color: var(--c-white);
    box-shadow: 0 3px 10px rgba(var(--purple-mid-rgb), .38);
  }
  .who-btn.active .who-portrait { border-color: var(--c-white); }
  #settings-subtabs { margin-top: 8px; }

  .segmented { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--glass-black-26); width: 100%; max-width: 460px; }
  .segmented button {
    flex: 1; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; color: var(--c-white);
    border: none; background: transparent; border-radius: var(--r-sm); padding: 10px 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  /* drie labels moeten in het spoor passen zonder af te breken; de maatregel
     hieronder is het vangnet voor grote systeemletters (gemeten past het op
     320px ook zonder) */
  .segmented button { min-width: 0; white-space: nowrap; }
  @media (max-width: 360px) {
    .segmented { gap: 3px; padding: 3px; }
    .segmented button { font-size: 14.5px; padding: 10px 4px; }
  }
  /* blauw = actieve navigatie/keuze (zelfde taal als .tab-btn.active in de
     kleedkamer en .nav-item.active in de vaste navigatie) -- paars blijft
     gereserveerd voor gewone (niet-navigatie) keuzes, goud voor spelen/verdiend */
  .segmented button.on { background: linear-gradient(180deg, var(--blue-fill-bottom), var(--blue-fill-top)); color: var(--purple-shadow); box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  /* korte, subtiele bevestiging na elke automatische opslag -- verschijnt even
     in de anders lege rechterkop-cel, geen aparte "Opslaan"-knop nodig */
  .saved-pill {
    font-size: 12.5px; font-weight: 700; color: var(--green-deep); background: var(--green-badge-bg);
    border-radius: var(--r-pill); padding: 5px 12px; white-space: nowrap;
    opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .saved-pill.show { opacity: 1; transform: translateY(0); }
  /* De opslagbevestiging reserveert ~100px in de rechtercel, en omdat de
     zijkolommen 1fr delen kneep dat de titel in het midden dood ("Voor ou..."
     op 320px). Uit de stroom halen loste dat op maar liet de flits over de
     titel heen lopen; op smalle schermen krimpt ze daarom tot alleen het vinkje
     -- kort genoeg om de titel te laten passen, en de betekenis (opgeslagen)
     zit toch al in het vinkje. */
  @media (max-width: 400px) {
    .saved-pill .sp-word { display: none; }
    .saved-pill { padding: 5px 8px; font-size: 14px; }
  }

  .settings-panel { display: flex; flex-direction: column; gap: 14px; }
  .set-card { background: var(--c-white); color: var(--c-ink); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--e-2); }
  .set-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .set-card-head .ico { width: 34px; height: 34px; border-radius: var(--r-sm); flex-shrink: 0; display: grid; place-items: center; font-size: 18px; background: var(--paper-tint); border: 1px solid var(--paper-border); }
  .set-card-head h2 { font-size: 18px; font-weight: 700; color: var(--purple-mid); }
  .set-card-head .sub { font-size: 12.5px; color: var(--paper-ink-muted); font-weight: 500; margin-top: 1px; }
  /* "Wat oefenen" en "Hoe spelen" zijn de kern van dit scherm -- een paarse
     (structuur-kleur) icoonvulling + iets steviger kop zet ze visueel voorop
     t.o.v. de secundaire kaarten (Profiel, Gegevens beheren) eronder */
  .set-card.primary { border: 1.5px solid var(--purple-light); }
  .set-card.primary .set-card-head .ico { background: linear-gradient(180deg, var(--purple-light), var(--purple-mid)); color: var(--c-white); border-color: transparent; }
  .set-card.primary .set-card-head h2 { font-size: 19.5px; }
  /* Wissen zat als permanent zichtbaar rood vlak onderaan het instellingenscherm,
     altijd in beeld naast gewone instellingen. Nu zit het achter een rustige
     openklapper: het rode vlak bestáát pas als een ouder er zelf om vraagt.
     <details> i.p.v. eigen JS -- toetsenbord en schermlezer krijgen we gratis. */
  .danger-reveal { margin-top: 12px; }
  .danger-reveal > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    min-height: 44px; box-sizing: border-box; padding: 9px 15px;
    font-size: 13.5px; font-weight: 700; color: var(--paper-ink-muted);
    border: 1.5px solid var(--paper-border); border-radius: var(--r-pill);
  }
  .danger-reveal > summary::-webkit-details-marker { display: none; }
  .danger-reveal > summary::after { content: '▾'; opacity: .7; }
  .danger-reveal[open] > summary { color: var(--danger-title); border-color: var(--danger-border); }
  .danger-reveal[open] > summary::after { content: '▴'; }
  .danger-reveal .danger-zone { margin-top: 10px; }
  /* Dezelfde openklapper, maar voor een gewone keuze i.p.v. een gevaarlijke: de
     oefeninstellingen bij het maken van een ster. Vandaar de papierkleuren i.p.v.
     het rood, en een volle breedte met twee regels i.p.v. een pil -- de tweede
     regel toont wát er nu ingesteld staat, zodat een ouder die hem nooit opent
     tóch ziet waar haar kind mee begint. */
  .set-reveal { margin-top: 15px; }
  .set-reveal > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    min-height: 44px; box-sizing: border-box; padding: 10px 14px;
    border: 1.5px solid var(--paper-border); border-radius: var(--r-md);
  }
  .set-reveal > summary::-webkit-details-marker { display: none; }
  .set-reveal > summary::after { content: '▾'; margin-left: auto; opacity: .7; flex: none; }
  .set-reveal[open] > summary { border-color: var(--purple-light); }
  .set-reveal[open] > summary::after { content: '▴'; }
  /* hetzelfde tegeltje als op een kaartkop, zodat het als één familie leest */
  .sr-ico {
    width: 34px; height: 34px; border-radius: var(--r-sm); flex: none; display: grid; place-items: center;
    font-size: 18px; background: var(--paper-tint); border: 1px solid var(--paper-border);
  }
  .sr-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sr-title { font-size: 13px; font-weight: 700; color: var(--paper-ink); }
  .sr-val { font-size: 12px; font-weight: 500; color: var(--paper-ink-muted); }
  .set-reveal-body { margin-top: 12px; }
  /* twee groepen (Wat oefenen / Hoe spelen) zonder er twee kaarten ín een kaart
     van te maken: een streepje en een kleinere kop doen hier hetzelfde werk */
  .reveal-group + .reveal-group { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--paper-border); }
  .rg-title { font-size: 14px; font-weight: 700; color: var(--purple-mid); margin-bottom: 10px; }
  /* streepje tussen de kindkaarten en het app-brede blok eronder: het staat op de
     paarse schermachtergrond, niet op een witte kaart, vandaar de witte tekst */
  .sheet-rule { display: flex; align-items: center; gap: 10px; margin: 4px 2px 0;
    color: var(--c-white); opacity: .8; font-size: 12.5px; font-weight: 700; }
  .sheet-rule::before, .sheet-rule::after { content: ''; flex: 1; height: 1px; background: var(--glass-white-22); }
